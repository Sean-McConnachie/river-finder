[[scheme]]
id = "kaimai"
name = "Kaimai hydro scheme"
operator = "Manawa Energy (formerly Trustpower)"
note = """Run of river with daily storage. Western diversions: the Opuiaki Weir sends the Opuiaki River through Tunnel 4
(which also takes the Tauwharawhara Stream) into the Ngatuhoa Canal, fed too by the Ngatuhoa Weir; Tunnel 5 takes the
canal to the upper Mangaonui Stream and Lake Mangaonui. Eastern diversions: the Omanawa weirs (Tunnel 2) and the
Mangapapa weir on the upper Wairoa (REC2 name; Tunnel 3). The Lloyd Mandeno Canal takes Lake Mangaonui (up to 14.2 m3/s)
to Lloyd Mandeno Power Station on the upper Wairoa; Lake Matariki and Lower Mangapapa lead into Lake McLaren, which also
gets the Mangakarengorengo River through two tunnels (up to 7 m3/s). The Ruahihi Canal (up to 31.2 m3/s) takes Lake
McLaren to Ruahihi Power Station. The Wairoa below the McLaren Falls dam had no required residual flow (150 l/s under
the 2026 consents) and the Mangakarengorengo joins it just below the dam: it runs on release days (about 26 a year, the
dam-release run) and when the weirs spill. EA Report 4 (2.8, pp. 10-11, Figure 2-9) confirms the stations and Lake
McLaren: four stations (Lloyd Mandeno 1972, Lower Mangapapa 1979, Ruahihi 1981, Kaimai 5 1994), Lake McLaren held
by a 26 m concrete arch dam across the lower Mangapapa River, a gated inlet into the 2.5 km canal
to Ruahihi, and a bypass at the dam for "recreational flows into the Wairoa River on set days each year"; it names
none of the intakes and gives no intake rate, residual flow, level or number of release days. Not modelled: the
Tauwharawhara take (up to 283 l/s, a stream of about 2 km2), Lake Matariki, the short Lower Mangapapa bypass and
Kaimai 5 (Report 4 does not say where it is). Intakes, flows and levels from the 2025-26 fast-track re-consenting
documents (rf-6u2), read through web-search excerpts only and unconfirmed (fasttrack.govt.nz refuses scripts)."""
sources = ["https://www.manawaenergy.co.nz/kaimai-power-scheme",
           "https://en.wikipedia.org/wiki/Kaimai_hydro_power_scheme",
           "https://www.emi.ea.govt.nz/Environment/Datasets/HydrologicalModellingDataset/1_InfrastructureAndHydroConstraintAttributes/HMD%20Report%204%20-%20Hydro-power%20Schemes%20Background%20and%20Descriptions.pdf",
           "https://www.fasttrack.govt.nz/__data/assets/pdf_file/0022/26653/Kaimai-HEPS-Appendix-A-Consent-Conditions-Final.pdf",
           "https://www.fasttrack.govt.nz/__data/assets/pdf_file/0020/12863/B.05-Appendix-F-Existing-Resource-Consents.pdf.pdf",
