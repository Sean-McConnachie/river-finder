operator = "Contact Energy"
note = """Clyde (Lake Dunstan) and Roxburgh are storage dams with the stations at the dam; the Clutha below is regulated.
Lake Hawea is a controlled storage (Hawea River below the control dam). The Kawarau Falls gates (1926) at the Lake
Wakatipu outlet do not control its outflow at normal flows. EA Report 4 (3.4, p. 20): "while Lake Wakatipu has control
gates at its outlet, these were built for mining purposes and are very seldom used. Therefore, only Lake Hāwea is
controlled and outflows from the other two lakes are classed as tributary flows"; its attributes table lists Lake
Wakatipu as a run-of-river reservoir and Lake Hawea as controlled. The Electricity Commission's Lake Level History
(Opus, 27 Feb 2009, 3.6.1 and Table 3.8, pp. 26-27; read in rf-6u2) counts Wakatipu among "the natural Lakes Wanaka
and Wakatipu": the structure (1924-26) was built "initially to close the outlet and allow access to gold deposits in
the river bed", its gates were used until 1938 and again in 1941-1956 for the construction of Roxburgh (an earlier
note, from a search excerpt, had the gates holding floods back: the report says that of the Taupo gates, 2.1.1). take = 0
(an estimate of 0.3 until rf-6u2): the point marks nothing and stays listed for coverage."""
