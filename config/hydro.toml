# Hydro schemes that divert, regulate or drown river reaches (rf-8x2). Read by src/river_finder/hydro.py;
# method, sources and limits in docs/hydro.md. `river-finder hydro check` prints where each point snaps and how far
# its marking runs; `river-finder hydro attach` writes data/nz/hydro.pkl (per reach) and data/nz/hydro_summary.json.
#
# Each scheme lists points. role:
#   intake  `take` (default 1) of the natural flow leaves the river here (weir, dam or intake into a canal or tunnel):
#           the reaches below are "diverted" while the water taken is at least `diverted_share` of their natural flow
#   dam     storage dam or lake control structure with the station at the dam toe: the flow below is "regulated"
#   return  tailrace or outfall: the water of `returns` (default: every intake of the scheme) comes back here; it
#           ends their "diverted" reaches and makes the reaches below "regulated" (regulates = false: a run-of-river
#           bypass, the river is natural again below)
# reservoir = true also marks the lake behind the point (and the dam itself) as "reservoir".
# A point snaps to the nearest reach of `river` (REC2 name) within snap_named_m; river = "" takes the nearest reach.
# `until` (river name) stops the marking at that confluence, `km` after that distance.
#
# Coordinates: dams, weirs and power stations mapped in OpenStreetMap (Overture Maps 2026-10-21.0, base/infrastructure
# water/dam, water/weir, power/plant, power/generator: "osm" in the notes), consent map references (ECan; Kaimai
# Appendix F), else from the operator and scheme descriptions ("approx": placed on the named river from the description,
# a level on the LiDAR DEM or a catchment area; check before relying on the extent).
#
# General sources for every scheme:
#   Electricity Authority, Hydrological Modelling Dataset, Report 4: Hydro-power Schemes Background and Descriptions
#     (WSP, final report of 11 July 2025; EMI file of 30 Oct 2025; the 2022 edition linked in rf-8x2 moved to the EMI
#     archive, _AdditionalInformation/ArchivedDatasets/20221231_HydrologicalModellingDataset):
#     https://www.emi.ea.govt.nz/Environment/Datasets/HydrologicalModellingDataset/1_InfrastructureAndHydroConstraintAttributes/HMD%20Report%204%20-%20Hydro-power%20Schemes%20Background%20and%20Descriptions.pdf
#     and its attributes table (20241231_InfrastructureAndHydroConstraintAttributes.csv, same folder). Read in rf-6u2
#     (2026-11-27): "EA Report 4" in the notes, with section, page and figure (the 2018 and 2022 editions have the same
#     scheme text). It describes the schemes' layout but gives no intake rates, residual flows or shares for the Kaimai
#     intakes, Wilberforce, the Rangitata Diversion Race or Piriaka; it corrects the Kawarau gates (take 0.3 -> 0).
#     Also read: EA Report 2 (Flow Series Description and Methodology, same date; 2_Flows_20241231 folder) and the
#     Electricity Commission's Lake Level History (Opus, 2009; Clutha sources). Values they do not cover keep their
#     estimate, approx or search-excerpt mark (docs/hydro.md, Sources).
#   Te Ara, Hydroelectricity: https://teara.govt.nz/mi/hydroelectricity/print
#   Wikipedia, Hydroelectric power in New Zealand: https://en.wikipedia.org/wiki/Hydroelectric_power_in_New_Zealand

[settings]
diverted_share = 0.5    # diverted: the water taken upstream is at least this share of the reach's natural flow (by area)
regulated_share = 0.5   # regulated: water taken + controlled upstream is at least this share
snap_named_m = 3000.0   # snap to the named river within this distance
snap_any_m = 700.0      # else to the nearest reach (1 km2 or more) within this distance
max_km = 400.0          # longest walk down from a point
reservoir_grad = 0.5    # m/km: reaches upstream of a reservoir point this flat are the lake (lakes are flat in the DEM)
reservoir_km = 30.0     # default lake length searched upstream (per point: reservoir_km)
dam_m = 300.0           # reaches within this distance of a reservoir point are the dam itself

[audit]
# Hydro classes left out of `ml audit` and the candidate runs (models/audits/<model>_top_runs.csv). [] keeps them in
# (the audit then only labels them in its `hydro` column).
exclude = ["diverted", "reservoir"]

[web]
enabled = true          # `web data` writes <region>_hydro.json (the Top rivers page and the map's details read it)

