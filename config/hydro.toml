[[scheme]]
id = "coleridge"
name = "Lake Coleridge"
operator = "Manawa Energy (formerly Trustpower)"
note = """Lake Coleridge feeds the power station on the Rakaia through intake tunnels; its natural outlet, Lake Stream
(to the Harper), is dammed and spills only in lake floods. The Harper Diversion takes the Harper River (up to 40 m3/s,
no residual flow required) by canal to the lake; the Oakden Bank below it takes what is left of the Harper (up to
50 m3/s) into the Oakden Canal, which also carries the Wilberforce Canal (up to 30 m3/s; at least 3 m3/s stays in the
Wilberforce below its diversion bank). Positions and rates: Environment Canterbury consents (Open Data Portal, read
2026-11-27, rf-6u2). EA Report 4 (3.6, p. 22, Figure 3-8) confirms the layout: the Harper Diversion intake above the
Oakden Canal intake on the Harper, the Wilberforce Canal intake (1977) joining the Oakden Canal, the Acheron Diversion
(1932), and the natural outlet "regulated by a control gate", with spill seldom (some as reverse flow through the
Oakden Canal); it gives no diversion rates. EA Report 2 (2.2.6, p. 22): "Diversions from the Harper and Wilberforce
rivers cease during floods when the diversion bunds are washed away" (the shares describe normal flows). Not
modelled: the Acheron diversion (pipeline and race to the lake)."""
sources = ["https://en.wikipedia.org/wiki/List_of_power_stations_in_New_Zealand",
           "https://www.emi.ea.govt.nz/Environment/Datasets/HydrologicalModellingDataset/1_InfrastructureAndHydroConstraintAttributes/HMD%20Report%204%20-%20Hydro-power%20Schemes%20Background%20and%20Descriptions.pdf",
           "https://www.emi.ea.govt.nz/Environment/Datasets/HydrologicalModellingDataset/2_Flows_20241231/HMD%20Report%202%20-%20Flow%20Series%20Description%20and%20Methodology.pdf",
           "https://www.ecan.govt.nz/data/consent-search/consentdetails/CRC173079",
           "https://www.ecan.govt.nz/data/consent-search/consentdetails/CRC173064",
           "https://www.ecan.govt.nz/data/consent-search/consentdetails/CRC172958",
           "https://www.ecan.govt.nz/data/consent-search/consentdetails/CRC173092",
           "https://data.ecan.govt.nz/Catalogue/Method?MethodId=2",
           "https://braidedrivers.org/rivers/rakaia/"]

