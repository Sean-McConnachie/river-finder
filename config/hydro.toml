[[scheme]]
id = "tongariro"
name = "Tongariro Power Scheme"
operator = "Genesis Energy"
note = """Western Diversion: the Whakapapa intake and a 16.5 km tunnel to Lake Te Whaiau, with intake dams on the Okupata,
Taurewa, Tawhitikuri and Mangatepopo streams on the way; the Whanganui headwaters go by a short tunnel to the Te
Whaiau Stream; Lake Otamangakau and the Wairehu Canal take it all to Lake Rotoaira. Eastern Diversion: Lake Moawhango
(Moawhango River, 22 Whangaehu tributaries) to the Tongariro by a 19 km tunnel; Rangipo Dam diverts the Tongariro to
Rangipo Power Station, whose 3 km tailrace tunnel returns it just above the Poutu Intake, which sends the river to
Lake Rotoaira and Tokaanu (Lake Taupo). Not modelled: the Whangaehu-side aqueduct intakes, the Waihohonu intake (EA
Report 4, 2.2: the Tongariro section begins at it), and the Taurewa and Tawhitikuri intakes (about 2 m3/s each). EA
Report 4's Figure 2-3 (Genesis schematic, p. 4) shows the Taurewa and Tawhitikuri intakes on the Western Diversion
between the Okupata and Mangatepopo intakes (from the west: Whakapapa, Okupata, Taurewa, Tawhitikuri, Mangatepopo),
not to scale; no source found gives where they are (the Tawhitikuri Stream is named in REC2, up to 8.4 km2; no stream
is named Taurewa in REC2 or the LINZ Topo50 river names), rf-6u2."""
sources = ["https://en.wikipedia.org/wiki/Tongariro_Power_Scheme", "https://teara.govt.nz/en/map/11834/tongariro-power-development",
           "https://genesisenergy.co.nz/about/generation/rivers-lakes-and-rainfall",
           "https://www.horizons.govt.nz/HRC/media/Media/One%20Plan/Jarrod-Bowler-for-Genesis-Power-Ltd.pdf?ext=.pdf",
