diversion bank (gravel weirs K34:815-774, 200 m from the point). take = 0.85 (was an estimate of 0.3) is still an
estimate: the Wilberforce's flow at the diversion was not found; at the Rakaia's mean specific flow (203 m3/s from
2,900 km2, 70 l/s/km2) the river carries about 24 m3/s here, of which all but 3 m3/s is taken (0.87); the share is
at least 0.5 at any flow between 6 and 60 m3/s. EA Report 4 (3.6, Figure 3-8) shows the Wilberforce Canal intake but
