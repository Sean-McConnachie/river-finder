# Rainfall accumulation per catchment (epic rf-t26). Read and validated by src/river_finder/rainfall/config.py.

# Windows (hours) for observed rain (the past x hours) and forecast rain (the next x hours).
# Any whole hour in 1..24: the buffers keep 24 hourly slots.
windows = [1, 3, 6, 12, 24]

[paths]
nz_data = "data/nz"              # national data, relative to the repository root; --data overrides it
tiles = "tiles"                  # <nz_data>/tiles/<tile>/local_catchment_core.tif (8 m, gid per pixel)
segments = "segments_table.pkl"  # one row per reach: the row order of every catchment array
rain = "rain"                    # outputs: weights_<grid>.npz (+ .json), obs_<source>.npz, fc_<source>.npz (+ .json)

[observed]
source = "ecmwf"      # source family that feeds the observed metric: ecmwf | the satellite family (gsmap, to become
                      # IMERG). ECMWF is the main observed source: satellite ingestion is deferred (rf-t26.2, 2026-11-19)
                      # until the storm validation shows it beats ECMWF against the gauges.
compare = []          # other families kept in their own observed buffers, for side-by-side comparison

[forecast]
source = "ecmwf"      # source family that feeds "rain in the next x hours"

# NZ windows of each product's native 0.1 degree grid. lon0/lat0 = centre of the north-west cell;
# rows run north to south. Both cover every national tile (166.09..178.75 E, 34.27..47.44 S) with a margin.

[grids.gsmap]         # JAXA GSMaP: cell centres on x.x5 deg (global 3600 x 1200, first centre 0.05E 59.95N)
lon0 = 165.85
lat0 = -33.85
dlon = 0.1
dlat = -0.1
nx = 132
ny = 140

[grids.ecmwf]         # ECMWF IFS open data 0p1: grid points on x.x0 deg (global 3600 x 1801 from 90N, 180)
lon0 = 165.8
lat0 = -33.8
dlon = 0.1
dlat = -0.1
nx = 133
ny = 141

# ECMWF IFS (rf-t26.3; src/river_finder/rainfall/ecmwf.py has the details and the comparison behind the choices).
[ecmwf]
# Where hourly IFS rain comes from:
#   openmeteo-s3: Open-Meteo's hourly copy of the IFS run (native O1280 grid, regridded bilinearly to the 0.1 deg
#                 cells; CC-BY 4.0), hourly to 90 h, out ~6 h after the run;
#   ecmwf-s3:     ECMWF open data 0.1 deg GRIB tp (exactly this grid), 3-hourly steps split evenly into hours,
#                 out ~8.5-9.5 h after the run.
reader = "openmeteo-s3"
obs_leads = [1, 18]   # ECMWF_OBS: lead hours a run may give the observed proxy (span >= 6: runs are 6 h apart). Each
                      # hour takes the newest run that has it, so older runs give leads 1-6 and the newest one its
                      # leads up to "now" (5-11 h with Open-Meteo, up to ~15 h with ecmwf-s3): the window ends at now
obs_runs = 6          # runs read for the observed window: the latest and the 5 before it (5 cover 24 h; the 6th
                      # stands in when one is missing; a run is only listed when a newer one lacks an hour)
search_hours = 48     # "latest" looks back this far for a published run
cache = "cache"       # under <rain>: decoded NZ fields per run (re-runs download only listings); "" = no cache
keep_days = 3         # cached runs older than this are deleted
ecmwf_urls = ["https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/", "https://storage.googleapis.com/ecmwf-open-data/"]
openmeteo_url = "https://openmeteo.s3.amazonaws.com/"

# Rain gauges (rf-t26.4; src/river_finder/rainfall/gauges.py, docs/rain-gauges.md): hourly totals from the regional
# councils' Hilltop servers, cached under <rain>/<dir>, for the gauge scale factors of rf-t26.5.
# None of these servers could be reached from the development container (the proxy refused every council host),
# so the .hts files and time zones below are unverified: run `river-finder rain gauges --discover` where the
# servers answer and fix hts / measurements / timezone from what it prints.
[gauges]
dir = "gauges"            # under <rain>: sites.json, series/<council>/<site>.npz, gauges_hourly.npz (+ .json)
days = 35                 # each run asks for the last 35 x 24 whole hours (rf-t26.5 compares 30 days); cached
                          # hours are not asked again, except the newest refetch_hours
keep_days = 60            # cached hours older than this are dropped
refetch_hours = 48        # always fetched again: telemetry arrives late and councils edit recent records
chunk_days = 10           # longest span of one GetData request
request_gap_s = 1.0       # at least this long between two requests to one server (councils run in parallel)
timeout_s = 60
retries = 4               # per request on HTTP 429/5xx and network errors, backoff doubling from ~1 s
max_mm_per_hour = 200.0   # hourly totals above this (or below 0) are marked suspect

# Per council: base_url = server root(s), tried in order; hts = candidate data files, the first whose
# MeasurementList has a rainfall measurement is used; measurements = names to look for, in order
# (case-insensitive, "Rainfall" also matches "Rainfall [Rainfall]"); timezone of the times the server sends:
# NZST (UTC+12 all year, as NEMS requires of recorders), Pacific/Auckland (NZ wall clock) or UTC;
# method = raw (records summed here into hours ending) | total-end | total-start (the server's hourly totals);
# region = the scaling region for a gauge that cannot be placed (the river-guide region names of the network).
[gauges.councils.wcrc]
name = "West Coast Regional Council"
enabled = true
base_url = ["https://hilltop.wcrc.govt.nz/", "http://hilltop.wcrc.govt.nz/"]
hts = ["data.hts"]       # Hilltop Server's usual file name; unverified for WCRC
measurements = ["Rainfall", "Rainfall Total", "Rain"]
timezone = "NZST"
method = "raw"
quality = true
region = "West Coast"
licence = "not stated for the Hilltop service; WCRC calls its web rainfall data raw and unverified"
attribution = "Rainfall data: West Coast Regional Council"
source = "host: MfE 2023 stocktake of council water-quality data (http://hilltop.wcrc.govt.nz/wq.hts); flood-watch.wcrc.govt.nz reads a Hilltop server"

[gauges.councils.ecan]
name = "Environment Canterbury"
enabled = true
base_url = ["https://wateruse.ecan.govt.nz/", "http://wateruse.ecan.govt.nz/"]
hts = ["data.hts"]       # unverified: ECan names its files per series (RiverRecorderQcEcanDaily.hts)
measurements = ["Rainfall", "Rainfall Total", "Rain"]
timezone = "NZST"         # ECan's rainfall pages: "times are in NZ standard time"
method = "raw"
quality = true
region = "Canterbury"
licence = "Canterbury Maps open data is Creative Commons Attribution; terms of the Hilltop service not checked"
attribution = "Rainfall data: Environment Canterbury"
source = "host: a public Hilltop Server at http://wateruse.ecan.govt.nz/RiverRecorderQcEcanDaily.hts; ECan publishes rainfall per site on data.ecan.govt.nz (Open Data Portal, csv/json/xml, not Hilltop)"

[gauges.councils.tdc]
name = "Tasman District Council"
enabled = true
base_url = ["https://envdata.tasman.govt.nz/", "http://envdata.tasman.govt.nz/"]
hts = ["data.hts"]       # unverified for TDC
measurements = ["Rainfall", "Rainfall Total", "Rain"]
timezone = "NZST"
method = "raw"
quality = true
region = "Tasman"
licence = "not stated for the Hilltop service: check TDC's terms before publishing"
attribution = "Rainfall data: Tasman District Council"
source = "host: MfE 2023 stocktake of council water-quality data (envdata.tasman.govt.nz/WaterQuality.hts)"
