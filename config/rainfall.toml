# Rainfall accumulation per catchment (epic rf-t26). Read and validated by src/river_finder/rainfall/config.py.

# Windows (hours) for observed rain (the past x hours) and forecast rain (the next x hours).
# Any whole hour in 1..24: the buffers keep 24 hourly slots.
windows = [1, 3, 6, 12, 24]

[paths]
nz_data = "data/nz"              # national data, relative to the repository root; --data overrides it
tiles = "tiles"                  # <nz_data>/tiles/<tile>/local_catchment_core.tif (8 m, gid per pixel)
segments = "segments_table.pkl"  # one row per reach: the row order of every catchment array
rain = "rain"                    # outputs: weights_<grid>.npz (+ .json), obs_<source>.npz, fc_<source>.npz (+ .json)

[observed]
source = "ecmwf"      # source family that feeds the observed metric: ecmwf | the satellite family (gsmap, to become
                      # IMERG). ECMWF is the main observed source: satellite ingestion is deferred (rf-t26.2, 2026-11-19)
                      # until the storm validation shows it beats ECMWF against the gauges.
compare = []          # other families kept in their own observed buffers, for side-by-side comparison

[forecast]
source = "ecmwf"      # source family that feeds "rain in the next x hours"

# NZ windows of each product's native 0.1 degree grid. lon0/lat0 = centre of the north-west cell;
# rows run north to south. Both cover every national tile (166.09..178.75 E, 34.27..47.44 S) with a margin.

[grids.gsmap]         # JAXA GSMaP: cell centres on x.x5 deg (global 3600 x 1200, first centre 0.05E 59.95N)
lon0 = 165.85
lat0 = -33.85
dlon = 0.1
dlat = -0.1
nx = 132
ny = 140

[grids.ecmwf]         # ECMWF IFS open data 0p1: grid points on x.x0 deg (global 3600 x 1801 from 90N, 180)
lon0 = 165.8
lat0 = -33.8
dlon = 0.1
dlat = -0.1
nx = 133
ny = 141

# ECMWF IFS (rf-t26.3; src/river_finder/rainfall/ecmwf.py has the details and the comparison behind the choices).
[ecmwf]
# Where hourly IFS rain comes from:
#   openmeteo-s3: Open-Meteo's hourly copy of the IFS run (native O1280 grid, regridded bilinearly to the 0.1 deg
#                 cells; CC-BY 4.0), hourly to 90 h, out ~6 h after the run;
#   ecmwf-s3:     ECMWF open data 0.1 deg GRIB tp (exactly this grid), 3-hourly steps split evenly into hours,
#                 out ~8.5-9.5 h after the run.
reader = "openmeteo-s3"
obs_leads = [1, 18]   # ECMWF_OBS: lead hours a run may give the observed proxy (span >= 6: runs are 6 h apart). Each
                      # hour takes the newest run that has it, so older runs give leads 1-6 and the newest one its
                      # leads up to "now" (5-11 h with Open-Meteo, up to ~15 h with ecmwf-s3): the window ends at now
obs_runs = 6          # runs read for the observed window: the latest and the 5 before it (5 cover 24 h; the 6th
                      # stands in when one is missing; a run is only listed when a newer one lacks an hour)
search_hours = 48     # "latest" looks back this far for a published run
cache = "cache"       # under <rain>: decoded NZ fields per run (re-runs download only listings); "" = no cache
keep_days = 3         # cached runs older than this are deleted
ecmwf_urls = ["https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/", "https://storage.googleapis.com/ecmwf-open-data/"]
openmeteo_url = "https://openmeteo.s3.amazonaws.com/"

# Rain gauges (rf-t26.4; src/river_finder/rainfall/gauges.py, docs/rain-gauges.md): hourly totals from the regional
# councils' gauge servers, cached under <rain>/<dir>, for the gauge scale factors of rf-t26.5. Checked live on
# 2026-11-21: WCRC and TDC through Hilltop Server, ECan through its Open Data Portal; all three send NZST.
[gauges]
dir = "gauges"            # under <rain>: sites.json, series/<council>/<site>.npz, gauges_hourly.npz (+ .json)
days = 35                 # each run asks for the last 35 x 24 whole hours (rf-t26.5 compares 30 days); cached
                          # hours are not asked again, except the newest refetch_hours
keep_days = 60            # cached hours older than this are dropped
refetch_hours = 48        # always fetched again: telemetry arrives late and councils edit recent records
chunk_days = 10           # longest span of one GetData request
request_gap_s = 1.0       # at least this long between two requests to one server (councils run in parallel)
timeout_s = 60
retries = 4               # per request on HTTP 429/5xx and network errors (TDC resets 4-6 % of connections),
                          # backoff doubling from ~1 s
max_mm_per_hour = 200.0   # hourly totals above this (or below 0) are marked suspect
inactive_days = 30        # a site whose record ended longer ago is inactive: no data request, not in the hourly
recheck_days = 7          # output; Hilltop: no request at all until this long after its last check

# Per council: kind = hilltop (default) | ecan-portal; base_url = server root(s), tried in order;
# hilltop: hts = candidate data files, the first whose MeasurementList has a rainfall measurement is used;
# measurements = the rain series to look for (case-insensitive, "Rainfall" also matches "Rainfall [Rainfall]"):
# their site lists are merged, and per site the series whose record reaches nearest to now is used (ties
# within 6 h go to the earlier name; a name with the word "raw" is unverified telemetry, never "good");
# timezone of the times the server sends: NZST (UTC+12 all year), Pacific/Auckland (NZ wall clock) or UTC;
# method = raw (records summed here into hours ending) | total-end | total-start (the server's hourly totals);
# region = the scaling region for a gauge that cannot be placed (the river-guide region names of the network).
# ecan-portal: hourly totals per site from data.ecan.govt.nz (hts, measurements, method, quality not used).
[gauges.councils.wcrc]
name = "West Coast Regional Council"
enabled = true
base_url = ["https://hilltop.wcrc.govt.nz/", "http://hilltop.wcrc.govt.nz/"]
hts = ["data.hts", "PublicLive.hts"]   # data.hts serves the default file (websitedata20260424.hts on 2026-11-21)
# "Rainfall" is verified and ends at the last audit (2021-2026); "Rainfall (raw)" is the live telemetry
measurements = ["Rainfall", "Rainfall (corrected)", "Rainfall (raw)"]
timezone = "NZST"         # checked 2026-11-21: newest records 14 min old as NZST (74 as NZDT), none in the future
method = "raw"
quality = true
region = "West Coast"
licence = "not stated for the Hilltop service; WCRC calls its web rainfall data raw and unverified"
attribution = "Rainfall data: West Coast Regional Council"
source = "https://hilltop.wcrc.govt.nz/data.hts (Hilltop Server 2404.2.2.62); host from the MfE 2023 stocktake of council water-quality data"

[gauges.councils.ecan]
name = "Environment Canterbury"
enabled = true
kind = "ecan-portal"      # its Hilltop server resets every https connection from here: see ecan_hilltop below
base_url = ["https://data.ecan.govt.nz/"]
timezone = "NZST"         # ECan: "times are in NZ standard time"; checked 2026-11-21 (newest samples 7-22 min old)
region = "Canterbury"
licence = "Creative Commons Attribution 4.0 International (ECan Open Data Portal: all data unless stated otherwise); provisional, unreviewed values"
attribution = "Rainfall data: Environment Canterbury (with Christchurch City Council and Earth Sciences New Zealand gauges)"
source = "https://data.ecan.govt.nz/ Open Data Portal: data/51 Rainfall summary by area (Sites=All), data/78 Rainfall for individual site (SiteNo, Period)"

# ECan's Hilltop server, off: https://wateruse.ecan.govt.nz/ reset every connection from the development container on
# 2026-11-21 and the .hts file with rainfall is not known. Enable it (and disable ecan) to try it elsewhere.
[gauges.councils.ecan_hilltop]
name = "Environment Canterbury (Hilltop)"
enabled = false
base_url = ["https://wateruse.ecan.govt.nz/", "http://wateruse.ecan.govt.nz/"]
hts = ["data.hts"]        # unverified: ECan names its files per series (RiverRecorderQcEcanDaily.hts)
measurements = ["Rainfall", "Rainfall Total", "Rain"]
timezone = "NZST"
method = "raw"
quality = true
region = "Canterbury"
licence = "Creative Commons Attribution 4.0 (ECan open data); terms of the Hilltop service not checked"
attribution = "Rainfall data: Environment Canterbury"
source = "host: a public Hilltop Server at http://wateruse.ecan.govt.nz/RiverRecorderQcEcanDaily.hts (search index)"

[gauges.councils.tdc]
name = "Tasman District Council"
enabled = true
base_url = ["https://envdata.tasman.govt.nz/", "http://envdata.tasman.govt.nz/"]
hts = ["data.hts"]
# "Rainfall" is live (verified up to the last visit, QC 200 after it); "Raw Rainfall" ends at the last visit
measurements = ["Rainfall", "Raw Rainfall"]
timezone = "NZST"         # checked 2026-11-21: newest records 8 min old as NZST; TDC also has a "Rainfall NZDT" copy
method = "raw"
quality = true
region = "Tasman"
licence = "not stated for the Hilltop service: check TDC's terms before publishing"
attribution = "Rainfall data: Tasman District Council"
source = "https://envdata.tasman.govt.nz/data.hts (Hilltop Server); host from the MfE 2023 stocktake of council water-quality data"

# Gauge scale factors (rf-t26.5, rf-t26.13; src/river_finder/rainfall/scaling.py, docs/rainfall-scaling.md): per source
# family and region, sum(gauge mm) / sum(grid mm at the gauges' cells) over the last `days`, with guard rails.
# `rain scale` updates <rain>/<dir>/: <family>_cells.npz (the grid's hourly mm at the gauge cells, backfilled and
# appended), factors_<family>.json (current factor and version per region) and factors_<family>.history.jsonl
# (every version, with the gauges, hours and sums behind it). Version 0 = unscaled (factor 1).
[scaling]
apply = true              # rain ecmwf (and rain scale) scale the buffers with the current factors; local totals use them
publish = false           # rain publish: gauge-scaled values only when true. Off until WCRC and TDC state their licences
                          # (rf-t26.14; ECan is CC BY 4.0): until then the published files carry the raw values
dir = "scaling"           # under <rain>
days = 30                 # the comparison window: the last 30 x 24 whole hours (ending now, or at the newest gauge hour)
keep_days = 40            # hours of the cell store older than this are dropped
min_gauges = 3            # fewer usable gauges (after merging copies of one station) in a region: factor 1, version 0
min_usable = 0.8          # a gauge counts only with >= 80 % of the window's hours usable (state <= 1) and a grid value
min_gauge_mm = 30.0       # no ratio below these mean totals per gauge over the window (gauges, grid at their cells):
min_grid_mm = 30.0        # the current factor is held (a dry month says nothing about the bias)
clamp = [0.5, 2.0]        # factor limits
max_step = 1.25           # one update moves a factor by at most x1.25 (or /1.25)
min_change = 0.02         # a change below 2 % keeps the current factor and version
min_update_hours = 20     # at most one new version per region per 20 h (a daily update; rain scale --force overrides)
dedupe_km = 3.0           # gauges within 3 km are compared as possible copies of one station (WCRC and TDC publish 7
                          # of the same gauges, up to 2.4 km apart in their coordinates) ...
dedupe_min_wet_hours = 10 # ... over their common usable hours: with >= 10 hours of rain at either, they are copies
dedupe_equal_share = 0.95 # when >= 95 % of those hours agree within 0.05 mm (copies: 99-100 %; distinct gauges at the
dedupe_equal_mm = 0.05    # same site: <= 53 %). One copy is kept: see docs/rainfall-scaling.md
colocated_m = 100.0       # distinct gauges within 100 m are reported with the lag that matches them best

[scaling.ecmwf]
products = ["ECMWF_OBS", "ECMWF_FC"]   # the ECMWF factor scales the observed proxy and the forecast (one model)
readers = ["openmeteo-s3", "ecmwf-s3"] # the cell store takes each hour from the first reader that has it (the observed
                                       # proxy's rule: the newest run with the hour within [ecmwf] obs_leads). Open-Meteo
                                       # keeps ~8 days of runs, ECMWF's AWS bucket the 0.1 deg runs since 2026-10-20 06z
