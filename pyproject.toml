[project]
name = "river-finder"
version = "0.1.0"
description = "Find unexplored whitewater in New Zealand from terrain, rainfall and geology"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "numba>=0.61",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "pillow>=10",
  "matplotlib>=3.9",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "scipy>=1.13",
  "pyarrow>=17",
]

[project.scripts]
river-finder = "river_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pysheds>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/river_finder"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
