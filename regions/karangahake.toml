# Reference region: Karangahake Gorge (Ohinemuri River), between the Coromandel and Kaimai ranges.
# Bbox checked 2026-11-11 by tracing REC2 upstream from Karangahake (Waitawheta confluence):
#   Ohinemuri at Karangahake (175.7217,-37.4233, 208 km2): lon 175.722..175.922, lat -37.482..-37.325
#   + Waitawheta River (75 km2) reaches south to -37.560
# Box adds ~2 km. The K Gorge is a high-volume flood run: Class IV-IV+ bouldery rapids above Karangahake.
name = "karangahake"
description = "Ohinemuri River through the Karangahake Gorge, with the Waitawheta from the northern Kaimai"
role = "reference"
bbox_wgs84 = [175.68, -37.58, 175.95, -37.30]  # [min_lon, min_lat, max_lon, max_lat]
crs = "EPSG:2193"

[dem]
coarse = "new-zealand/new-zealand-contour/dem_8m/2193"
lidar = "new-zealand/new-zealand/dem_1m/2193"
routing_res = 5.0

[[known_runs]]
river = "Ohinemuri River"    # Karangahake Gorge ("K Gorge")
status = "listed"
outlet_wgs84 = [175.7217, -37.4233]
rec2_cum_area_km2 = 208.1
