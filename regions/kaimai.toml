# Reference region: Kaimai Range (Bay of Plenty / Waikato)
# Bbox checked 2026-11-11 by tracing the REC2 network upstream from each river's outlet.
#   Wairoa (mouth 176.093,-37.686, 464 km2): upstream lon 175.906..176.163, lat -38.019..-37.686
# The box adds a ~2 km buffer, and extends west to 175.80 to include the Kaimai crest and western escarpment.
name = "kaimai"
description = "Kaimai Range / Mamaku plateau and the Wairoa catchment gorges"
role = "reference"
bbox_wgs84 = [175.80, -38.04, 176.19, -37.66]  # [min_lon, min_lat, max_lon, max_lat]
crs = "EPSG:2193"

[dem]
coarse = "new-zealand/new-zealand-contour/dem_8m/2193"
fine = [
  "bay-of-plenty/bay-of-plenty_2019-2022/dem_1m/2193",
  "waikato/waikato_2021/dem_1m/2193",
]

# REC2 names (NZ_River_Names_REC2_V1). Chain: Tuakopae -> Mangakarengorengo -> Wairoa.
[[known_runs]]
river = "Wairoa River"
status = "listed"            # in online guides
outlet_wgs84 = [176.093, -37.686]
rec2_cum_area_km2 = 464.1

[[known_runs]]
river = "Tuakopae Stream"    # Sean calls it the Tuakopai
status = "listed"
outlet_wgs84 = [175.984, -37.843]
rec2_cum_area_km2 = 8.5

[[known_runs]]
river = "Mangakarengorengo River"
status = "unlisted"          # the flood run; NOT in online guides -> hold-out test case
outlet_wgs84 = [176.043, -37.806]
rec2_cum_area_km2 = 108.4
