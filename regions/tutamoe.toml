# Reference region: Tutamoe / Waima plateau (Northland, inland of Omapere, west of Kaikohe)
# The bbox is approximate. Refine it once the 8 m DEM is loaded.
name = "tutamoe"
description = "Tutamoe/Waima basalt plateau feeding the Waima, Waipoua and Mangakahia"
role = "reference"
bbox_wgs84 = [173.35, -35.80, 173.90, -35.35]  # [min_lon, min_lat, max_lon, max_lat]
crs = "EPSG:2193"

[dem]
coarse = "new-zealand/new-zealand-contour/dem_8m/2193"
fine = [
  "northland/northland_2018-2020/dem_1m/2193",
  "northland/northland_2024/dem_1m/2193",
]

[known_runs]
# Names to confirm with the user (see the beads question issue)
rivers = ["Waima", "Waipoua", "Mangakahia"]
