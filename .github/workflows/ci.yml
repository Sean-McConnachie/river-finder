name: CI
# Manual only (Actions tab -> CI -> Run workflow): runs on every push failed to start and sent
# an email each time. Put push/pull_request back once Actions can run on this repository.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
