# Known runnability labels for reaches. Edit freely: this file feeds the 3D separation viewer
# (and later, model training). One [[section]] per known section.
#
# status   = "runnable" | "not_runnable"
# grade    = optional, international/NZ grade as written in guides: "3", "4-4+", "5", "III+", ...
# held_out = true keeps it out of model training (the Mangakarengorengo test)
# Extent, in order of precedence (all coordinates are [lon, lat] WGS84):
#   put_in + take_out     -> reaches on the flow path between the two points
#   outlet + upstream_km  -> main stem upstream of a point for that distance
#   (neither)             -> every steep reach (>= 10 m/km, >= 2 km2) of the named river; APPROXIMATE
# river must match the REC2 name (see the viewer's river tooltips).

