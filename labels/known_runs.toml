# Known runnability labels for reaches. Edit freely: this file feeds the 3D separation viewer
# (and later, model training). One [[section]] per known section.
#
# status   = "runnable" | "not_runnable"
# grade    = optional, international/NZ grade as written in guides: "3", "4-4+", "5", "III+", ...
# held_out = true keeps it out of model training (the Mangakarengorengo test)
# Extent, in order of precedence (all coordinates are [lon, lat] WGS84):
#   put_in + take_out     -> reaches on the flow path between the two points
#   outlet + upstream_km  -> main stem upstream of a point for that distance
#   (neither)             -> the steep reaches (>= 10 m/km, >= 2 km2) of the named river, on one downstream
#                            path: pieces that join down the river are kept together, same-name reaches in
#                            other valleys or up another fork are dropped (labels.one_path); APPROXIMATE
# river must match the REC2 name (see the viewer's river tooltips).
# put_in_river / take_out_river / outlet_river = optional: the name that point snaps to on the national tables
#   (models.map_section), e.g. the main river a take-out sits on, or "" for the nearest reach whatever its name

[[section]]
region = "kaimai"
river = "Wairoa River"
status = "runnable"
grade = "5"
put_in = [176.0455, -37.8056]
take_out = [176.05159, -37.78672]
source = "Commercial rafting listings describe the dam-release Wairoa as Grade 5. Extent: NZ RiverGuide 'McLaren Falls to Powerstation' (put-in below McLaren Falls; take-out 2.7 km down the river, the guide's length, because the guide's inferred Ruahihi take-out snaps onto the Omanawa). Was the whole steep river by name until rf-aq6.27."

