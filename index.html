      el("tbody", {}, ...WINDOWS.map((w) => el("tr", { class: w === x ? "det-rain-cur" : null, "aria-current": w === x ? "true" : null },
        el("th", { scope: "row", text: `${w} h` }),
        el("td", { class: "n", text: Rn.fmt.mm(a.past[w].mm) }), el("td", { class: "n", text: Rn.fmt.m3(a.past[w].m3) }),
        el("td", { class: "n", text: Rn.fmt.mm(a.next[w].mm) }), el("td", { class: "n", text: Rn.fmt.m3(a.next[w].m3) }))))));
    const behind = h.observed?.hours_behind_now, nowT = Rn.parseTime(h.now);
    const run = h.forecast?.run, runAge = h.forecast?.run_age_hours;
    const times = el("p", { class: "rf-note" },
      tp ? `Past: the hours up to ${Rn.time(tp.end)}${behind ? `, ${behind} h before the latest whole hour (${Rn.time(nowT)})` : ""}. ` : "",
      tn ? `Next: the hours from ${Rn.time(tn.start)}${run ? `, from the ECMWF run of ${Rn.time(run)}${runAge != null ? ` (${runAge} h old)` : ""}` : ""}. ` : "",
      `Updated ${Rn.time(data.generated)} (`, ageSpan(data), ").");
    const raw = WINDOWS.every((w) => a.past[w].scale <= 1 && a.next[w].scale <= 1);
    const missing = Math.max(...WINDOWS.map((w) => Math.max(a.past[w].miss, a.next[w].miss)));
    const caveats = [
      `Model data, not gauged: the past hours are the first hours of recent ECMWF forecast runs, standing in for measured rain${raw ? ", with no rain-gauge correction yet" : ""}.`,
      tp ? `The past windows end at ${Rn.time(tp.end)}${behind ? `, ${behind} h before now: the newest hours are in neither window yet` : ""}.` : "",
      "Depths are averaged over the whole upstream catchment; m³ = depth × catchment area. Rain takes time to reach the river, longer in big catchments.",
      a.flags & 16 ? "Part of this catchment is cut off at the edge of a processing tile, so the totals here miss some of its rain." : "",
      missing ? `Up to ${missing} h had no data upstream and count as 0 mm.` : "",
    ].filter(Boolean);
    const ix = data.index || {}, lic = ix.licences || [], notes = ix.products || {};
    const prods = (kind) => [...new Set(WINDOWS.flatMap((w) => a[kind][w].products))].map((t) => notes[t] || t).join("; ") || "none";
    const source = el("p", { class: "rf-note", text: `Source of the past hours: ${prods("past")}. Of the next hours: ${prods("next")}.` });
    const attr = el("p", { class: "rf-note det-rain-attr" }, h.attribution || ix.attribution || "Rain: ECMWF IFS open data, CC BY 4.0.",
      ...(lic.length ? [" Sources: ", ...lic.flatMap((l, k) => [k ? ", " : "", ext(l.url, l.name.replace(/ \(.*\)$/, ""))]), "."] : []));
    box.replaceChildren(intro, table, times, source, el("ul", { class: "det-rain-caveats" }, ...caveats.map((t) => el("li", { text: t }))), attr);
  }

  M.rain = { lines, section, outlet, ramp, classOf, TENTHS, LABELS, sync };
})();

/* --- pages/map/60-detail.js --- */
/* Full-screen river details (RF.detail renderers for "section", "run" and "reach"): summary, a stats
   table, the long profile (elevation and height-to-area against distance), a flow-rate placeholder,
   put-in / take-out coordinates, hazards and links to sources. Renderers load their region through
   RF.data, so they work from any page. Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el, fmt, icon } = RF.util;
  const SRC_NOTE = {
    riverguide: "From the NZ RiverGuide (Whitewater NZ; WWNZ and Graham Charles, NZ Whitewater 4th ed.), CC BY-SA 3.0 NZ.",
    packrafting: "Summary in our own words from packraftingtrips.nz; follow the link for the original.",
    other: "Summary in our own words; follow the links for the originals.",
    local: "Local knowledge recorded in labels/known_runs.toml.",
  };
  const ext = (href, text) => el("a", { href, target: "_blank", rel: "noopener", class: "det-link" }, el("span", { text }), el("span", { html: icon("external"), "aria-hidden": "true" }));
  const median = (a) => { const b = a.filter((v) => isFinite(v)).sort((p, q) => p - q); return b.length ? b[b.length >> 1] : NaN; };

  /** A reach's named river (or ±20 reaches of main stem when unnamed), downstream order. */
  function stretch(S, seg) {
    const nm = S.r[seg], same = (i) => (nm >= 0 ? S.r[i] === nm : true);
    const up = []; let cur = seg, n = 0;
    while (S.u[cur] >= 0 && same(S.u[cur]) && S.d[S.u[cur]] === cur && n++ < (nm >= 0 ? 4000 : 20)) { cur = S.u[cur]; up.push(cur); }
    const down = []; cur = seg; n = 0;
    while (S.d[cur] >= 0 && same(S.d[cur]) && n++ < (nm >= 0 ? 4000 : 20)) { cur = S.d[cur]; down.push(cur); }
    return [...up.reverse(), seg, ...down];
  }

  /**
   * The numbers each predicted run gets (RF.runs.measure: same parameters and model), plus the elevation range,
   * the median Melton ratio and the reaches the profile follows. A known section placed by river name can be
   * several separate pieces (n > 1): then the profile follows the main stem of the longest piece. Null: no reaches.
   */
  function stats(R, ms, model) {
    const S = R.segments, st = RF.runs.measure(R, ms, { model });
    if (!st) return null;
    const parts = RF.runs.pieces(S, ms), longest = parts.reduce((b, q) => (q.len > b.len ? q : b)), stem = longest.stem;
    return Object.assign(st, {
      n: st.pieces, simple: parts.length === 1 && stem.length === longest.members.length, stem, wholePiece: stem.length === longest.members.length,
      stemKm: stem.reduce((t, m) => t + S.len[m], 0) / 1000, zTop: S.zt[st.top], zBot: S.zb[st.bottom],
      zMax: Math.max(...ms.map((m) => S.zt[m])), zMin: Math.min(...ms.map((m) => S.zb[m])), mel: median(ms.map((m) => S.mel[m])) });
  }

  function statsTable(st, score) {
    // not one joined stretch: no single top → bottom, so say what each figure covers
    const many = st.n > 1, over = many ? `${st.n} separate pieces` : "the main stem and its side branches";
    const rows = [
      ["Length", `${st.len.toFixed(1)} km`, st.simple ? "" : `Total of ${over}`],
      ["Average gradient", `${fmt.grad(st.grad)} m/km`, st.simple ? `${fmt.int(st.drop)} m drop over the length` : `Length-weighted over ${over}`],
      ["Max gradient", `${fmt.grad(st.s50)} m/km`, "Steepest 50 m of channel"],
      ["Height-to-area", isFinite(st.mel) ? st.mel.toFixed(3) : "–", "Melton ratio: catchment relief ÷ √area (median)"],
      ["Flow (mean annual flood)", `${fmt.flow(st.maf)} m³/s`, `NIWA statistic at the bottom${many ? " of the largest piece" : ""}, not live flow`],
      many ? ["Catchment area", `${fmt.km2(st.aBot)} km²`, "At the bottom of the largest piece (the pieces have no common top)"]
        : ["Catchment area", `${fmt.km2(st.aTop)} → ${fmt.km2(st.aBot)} km²`, "Top → bottom"],
      many ? ["Elevation", `${fmt.int(st.zMin)} to ${fmt.int(st.zMax)} m`, "Lowest to highest point of the pieces (NZVD2016)"]
        : ["Elevation", `${fmt.int(st.zTop)} → ${fmt.int(st.zBot)} m`, "NZVD2016"],
    ];
    if (score) rows.push(["Model score", `${score.pct.toFixed(score.pct >= 99 ? 1 : 0)} percentile`, `${score.model}: nationally, higher is more like the known runs`]);
    if (st.acc) {
      rows.push(many ? ["Road access", fmt.dist(st.acc.road), "Nearest road to any of the pieces (OpenStreetMap)"]
        : ["Road access", `${fmt.dist(st.acc.putIn)} · ${fmt.dist(st.acc.takeOut)}`, "From the top · from the bottom (OpenStreetMap)"]);
      rows.push(["Nearest foot track", fmt.dist(st.acc.foot), "Along the section"]);
      rows.push(["Mapped waterfalls", st.falls ? `${st.falls}${st.fallsH ? `, tallest ${st.fallsH} m` : ""}` : "None mapped", "OpenStreetMap; coverage is patchy"]);
    }
    return el("div", { class: "rf-tablewrap" }, el("table", { class: "rf-table det-stats" },
      el("thead", {}, el("tr", {}, el("th", { text: "Measure" }), el("th", { class: "n", text: "Value" }), el("th", { class: "det-note", text: "Note" }))),
      el("tbody", {}, ...rows.map(([k, v, n]) => el("tr", {}, el("th", { scope: "row" }, k, n ? el("span", { class: "det-note-inline", text: n }) : null),
        el("td", { class: "n", text: v }), el("td", { class: "rf-muted det-note", text: n }))))));
  }

  function profile(S, ms, highlight) {
    const xs = [], zs = [], ha = [], rows = [];
    let cum = 0;
    ms.forEach((m, k) => {
      if (k === 0) { xs.push(0); zs.push(S.zt[m]); ha.push(S.mel[m]); }
      cum += S.len[m] / 1000;
      xs.push(cum); zs.push(S.zb[m]); ha.push(S.mel[m]);
      rows.push([cum, S.zb[m], S.g[m], S.mel[m], S.a[m]]);
    });
    const markers = [];
    if (S.fallsN) { let c = 0; ms.forEach((m) => { const mid = c + S.len[m] / 2000; if (S.fallsN[m]) markers.push({ x: mid, label: `Mapped waterfall${S.fallsH[m] ? `, ${S.fallsH[m]} m` : ""}` }); c += S.len[m] / 1000; }); }
    if (highlight !== undefined) { let c = 0; ms.forEach((m) => { if (m === highlight) markers.push({ x: c + S.len[m] / 2000, label: "The reach you selected" }); c += S.len[m] / 1000; }); }
    const chart = RF.chart.tracks({
      label: "Long profile: elevation and height-to-area against distance downstream",
      x: xs, xLabel: "Distance downstream (km)", xFmt: (v) => (v >= 10 ? v.toFixed(0) : v.toFixed(1)),
      tracks: [
        { label: "Elevation", unit: "m", y: zs, color: M.token("--accent"), area: true, height: 150, fmt: (v) => String(Math.round(v)), markers },
        { label: "Height-to-area (Melton)", unit: "", y: ha, color: M.token("--falls"), height: 90, fmt: (v) => v.toFixed(2), tipFmt: (v) => v.toFixed(3) },
      ],
    });
    const table = el("details", { class: "det-data" }, el("summary", { text: "Profile data (table)" }),
      el("div", { class: "rf-tablewrap" }, el("table", { class: "rf-table" },
        el("thead", {}, el("tr", {}, ...["km", "Elevation m", "Gradient m/km", "Height-to-area", "Area km²"].map((h) => el("th", { class: "n", text: h })))),
        el("tbody", {}, ...rows.map((r) => el("tr", {}, el("td", { class: "n", text: r[0].toFixed(2) }), el("td", { class: "n", text: Math.round(r[1]) }),
          el("td", { class: "n", text: fmt.grad(r[2]) }), el("td", { class: "n", text: r[3].toFixed(3) }), el("td", { class: "n", text: fmt.km2(r[4]) })))))));
    return [chart, table];
  }

  function coordBlock(label, lat, lon, desc, note) {
    const [E, N] = RF.util.toNZTM(lat, lon);
    return el("div", { class: "det-coord" }, el("h4", { text: label }), desc ? el("p", { text: desc }) : null,
      el("div", { class: "rf-row" }, el("span", { class: "rf-muted det-k", text: "Lat, lon" }), RF.util.copyable(fmt.coord(lat, lon))),
      el("div", { class: "rf-row" }, el("span", { class: "rf-muted det-k", text: "NZTM" }), RF.util.copyable(`${Math.round(E)} E, ${Math.round(N)} N`)),
      note ? el("p", { class: "rf-note", text: note }) : null);
  }

  function linkGroups(name, mid, sec, near, linz) {
    const [lon, lat] = mid, q = encodeURIComponent;
    const groups = [];
    if (sec?.links?.length) groups.push(["Guides and sources", sec.links.map((l) => ext(l.u, l.t))]);
    if (linz) groups.push(["River line and name", [ext("https://data.linz.govt.nz/layer/103632-nz-river-name-lines-pilot/", "LINZ NZ River Name Lines (CC BY 4.0)")]]);
    const gauges = [];
    if (sec?.gauge) gauges.push(el("span", { class: "det-gauge" }, `Gauge named in the guide: ${sec.gauge}. `, ext(`https://www.google.com/search?q=${q(`${sec.gauge} river flow gauge NZ`)}`, "Look it up")));
    const gb = ({ feature, km }) => el("button", { type: "button", class: "det-gaugebtn", onclick: () => RF.detail.open(feature) },
      el("span", { text: feature.name }), el("span", { class: "num rf-muted", text: `${km.toFixed(1)} km` }));
    if (near?.flow.length) gauges.push(el("div", { class: "det-gaugelist" }, el("span", { class: "rf-muted det-gk", text: "River gauges" }), ...near.flow.map(gb)));
    if (near?.rain.length) gauges.push(el("div", { class: "det-gaugelist" }, el("span", { class: "rf-muted det-gk", text: "Rain gauges" }), ...near.rain.map(gb)));
    if (!near?.flow.length && !near?.rain.length) gauges.push(el("span", { class: "rf-note", text: "No gauges within 25 km." }));
    groups.push(["Gauges", gauges]);
    groups.push(["Maps", [
      ext(`https://basemaps.linz.govt.nz/@${lat.toFixed(5)},${lon.toFixed(5)},z14`, "LINZ Basemaps"),
      ext(`https://www.openstreetmap.org/?mlat=${lat.toFixed(5)}&mlon=${lon.toFixed(5)}#map=14/${lat.toFixed(5)}/${lon.toFixed(5)}`, "OpenStreetMap"),
      ext(`https://www.google.com/maps/search/?api=1&query=${lat.toFixed(5)},${lon.toFixed(5)}`, "Google Maps")]]);
    groups.push(["Videos and web", [
      ext(`https://www.youtube.com/results?search_query=${q(`${name} ${sec?.section || ""} kayak`.trim())}`, "Search videos"),
      ext(`https://www.google.com/search?q=${q(`${name} whitewater kayak New Zealand`)}`, "Search the web")]]);
    return el("div", { class: "det-links" }, ...groups.map(([h, items]) => el("div", { class: "det-linkgroup" }, el("h4", { text: h }), el("div", { class: "det-linklist" }, ...items))));
  }

  const section = (title, ...kids) => el("section", { class: "det-sec" }, el("h3", { text: title }), ...kids);

  async function riverDetail(f, ctx) {
    const R = await RF.data.region(f.region), S = R.segments;
    let ms, sec = null, highlight;
    if (f.kind === "section") { sec = f.sec || R.sections.find((x) => x.id === f.id); ms = sec.m.slice(); }
    else if (f.kind === "run") ms = f.members.slice();
    else { ms = stretch(S, f.seg); highlight = f.seg; }
    // scored like the predicted runs on the map: the current model's best reach
    const sc = RF.state.model ? await RF.data.scores(R.id, RF.state.model) : null;
    const st = stats(R, ms, sc?.pct?.length ? sc : null);
    if (!st) return { title: f.name, subtitle: R.title, body: el("p", { class: "rf-muted", text: "No modelled reaches here." }) };
    const many = st.n > 1;
    const score = sc?.pct?.length ? { pct: st.score,
      model: sc.fallback ? "Pooled regression (this build has no per-model scores)" : RF.models.get(RF.state.model)?.title || RF.state.model } : null;
    const onSection = f.kind !== "section" ? R.sections.find((x) => ms.some((m) => x.m.includes(m))) : null;
    const name = f.kind === "section" ? sec.river : f.name;

    // header
    const showBtn = el("button", { type: "button", class: "rf-btn det-show", "aria-label": "Show on map", onclick: () => { ctx.close(); RF.go("map", { select: f }); } },
      el("span", { html: icon("pin"), "aria-hidden": "true" }), el("span", { class: "det-show-label", text: "Show on map" }));
    ctx.actions.append(showBtn);
    const eyebrow = f.kind === "section" ? `Known river · ${sec.srcName === "riverguide" ? "NZ RiverGuide" : sec.srcName}`
      : f.kind === "run" ? (f.status === "listed" ? "Predicted run · in the guides" : f.status === "heldout" ? "Predicted run · test river" : "Predicted run · not in the guides")
        : f.linz ? `LINZ ${f.linz.type} · numbers from the modelled channel` : "Modelled channel";
    const title = f.kind === "section" && sec.section ? `${sec.river}: ${sec.section}` : name;

    // summary
    const pills = el("div", { class: "rf-row" });
    if (sec) pills.append(el("span", { class: "rf-pill det-grade", style: `--g:${M.gradeColor(M.gradeBin(sec))}`, text: sec.grade ? `Grade ${sec.grade}` : "Grade not recorded" }));
    if (f.kind === "run" && !(onSection && f.status === "candidate")) pills.append(el("span", { class: `rf-pill ${f.status === "candidate" ? "rf-pill--ok" : f.status === "heldout" ? "rf-pill--warn" : ""}`, text: f.status === "candidate" ? "Not in the guides" : f.status === "heldout" ? "Test river (held out)" : "In the guides" }));
    if (onSection) pills.append(el("span", { class: "rf-pill rf-pill--accent", text: `In the guides: overlaps ${onSection.river}${onSection.section ? ` (${onSection.section})` : ""}` }));
    if (sec?.popularity) pills.append(el("span", { class: "rf-pill", text: sec.popularity }));
    if (sec?.time) pills.append(el("span", { class: "rf-pill", text: sec.time }));
    const desc = sec?.desc ? [el("p", { class: "det-desc", text: sec.desc }), el("p", { class: "rf-note", text: SRC_NOTE[sec.src] || "" })]
      : [el("p", { class: "det-desc", text: f.kind === "section" ? "No description recorded." : onSection ? "Part of this stretch is a section in the guides (see above); open it from the map for its description." : "Not in the guides." })];
    const gen = el("p", { class: "rf-note", text: many
      ? `${st.len.toFixed(1)} km mapped in ${st.n} separate pieces, at an average ${fmt.grad(st.grad)} m/km. The largest drains ${fmt.km2(st.aBot)} km², with a mean annual flood of ${fmt.flow(st.maf)} m³/s at its bottom.`
      : `${st.len.toFixed(1)} km${st.simple ? "" : " with side branches"} at an average ${fmt.grad(st.grad)} m/km, ${st.simple ? `dropping ${fmt.int(st.drop)} m` : "the main stem dropping"} from ${fmt.int(st.zTop)} m to ${fmt.int(st.zBot)} m. Catchment ${fmt.km2(st.aTop)} → ${fmt.km2(st.aBot)} km²; mean annual flood ${fmt.flow(st.maf)} m³/s at the bottom.${f.kind === "reach" ? ` The profile covers ${f.name === "Unnamed stream" ? "the main stem around the reach" : `the ${f.name} channel`}.` : ""}` });
    const apart = many ? el("p", { class: "rf-note", text: "The pieces are not joined, so the section has no single drop, top or bottom. The long profile shows the longest piece." }) : null;
    const stemNote = st.simple ? null : el("p", { class: "rf-note",
      text: `The profile shows ${st.stemKm.toFixed(1)} of the ${st.len.toFixed(1)} km mapped: ${many ? (st.wholePiece ? "the longest piece" : "the main stem of the longest piece") : "the main stem"}.` });

    // coordinates: published put-in and take-out, else the ends of the profiled stretch
    const top = st.stem[0], bot = st.stem[st.stem.length - 1], topLL = S.c[top][0], botLL = S.c[bot][S.c[bot].length - 1];
    const ends = f.kind !== "section" ? ["Top", "Bottom"] : many ? ["Top of the longest piece", "Bottom of the longest piece"] : ["Top of the mapped section", "Bottom of the mapped section"];
    const coords = [];
    if (sec?.putIn) coords.push(coordBlock("Put-in", sec.putIn[0], sec.putIn[1], sec.putInDesc, sec.coords === "inferred" ? "Worked out from directions, not published: check before relying on it." : null));
    else coords.push(coordBlock(ends[0], topLL[1], topLL[0], null, null));
    if (sec?.takeOut) coords.push(coordBlock("Take-out", sec.takeOut[0], sec.takeOut[1], sec.takeOutDesc, sec.coords === "inferred" ? "Worked out from directions, not published: check before relying on it." : null));
    else coords.push(coordBlock(ends[1], botLL[1], botLL[0], null, null));
    const midC = S.c[st.stem[st.stem.length >> 1]][0];

    const body = [
      el("div", { class: "det-summary" }, pills, ...desc, gen, apart),
      section("Key numbers", statsTable(st, score)),
      section("Long profile", ...profile(S, st.stem, highlight), stemNote),
      M.rain?.section(f, R), // 57-rain.js: live rain at the outlet (null without live rain)
      section("Flow rate", RF.chart.placeholder("Flow rate over time",
        `To do: live and historical flow need the river gauges (planned). For now the best guide is the NIWA mean annual flood at the bottom${many ? " of the largest piece" : ""}: ${fmt.flow(st.maf)} m³/s.`)),
      section("Put-in and take-out", el("div", { class: "det-coords" }, ...coords)),
    ].filter(Boolean);
    if (sec?.hazards?.length || sec?.deaths) {
      body.push(section("Hazards", el("div", { class: "rf-row" }, ...(sec.hazards || []).map((h) => el("span", { class: "rf-pill rf-pill--warn", text: h }))),
        sec.deaths ? el("p", { class: "rf-note", text: `Fatalities recorded on or near this section: ${sec.deaths}. See the sources.` }) : null,
        sec.flow ? el("p", { class: "rf-note", text: `Flow notes: ${sec.flow}` }) : null));
    }
    const near = M.nearGauges ? await M.nearGauges(midC[1], midC[0]).catch(() => null) : null;
    body.push(section("Links", linkGroups(name, midC, sec, near, f.linz)));
    body.push(el("p", { class: "rf-note det-foot", text: [
      sec ? `Placed on the river network by: ${sec.how}.` : "",
      f.kind === "run" ? "A run is a stretch of consecutive reaches that pass the run-finder settings (see Models)." : "",
      "Leads from terrain data only: check access, land ownership, hazards and local knowledge before going anywhere."].filter(Boolean).join(" ") }));
    return { eyebrow, title, subtitle: R.title, body };
  }

  ["section", "run", "reach"].forEach((k) => RF.detail.register(k, riverDetail));
  M.riverDetail = riverDetail;
})();

/* --- pages/map/70-falls.js --- */
/* Waterfalls and rapids (OpenStreetMap, most heights from the LINZ Topo50 import) with their detail
   view: height and its source, coordinates to copy, OSM and photo links, the reach they sit on.
   Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el, fmt, icon } = RF.util;
  const EMPTY = { type: "FeatureCollection", features: [] };
  const ext = (href, text) => el("a", { href, target: "_blank", rel: "noopener", class: "det-link" }, el("span", { text }), el("span", { html: icon("external"), "aria-hidden": "true" }));
  const count = (k) => (M.R?.falls || []).filter((f) => f[5] === k).length;

  M.defineGroup({ id: "features", label: "Waterfalls and rapids", link: "https://www.openstreetmap.org/copyright" });
  M.defineLayer({ id: "falls", parent: "features", label: "Waterfalls", note: "OpenStreetMap / LINZ Topo50", defaultOn: true, swatch: "dot",
    colors: [{ key: "c", token: "--falls" }], legend: "Waterfall (larger = taller)", count: () => count("w"), apply: applyFalls });
  M.defineLayer({ id: "rapids", parent: "features", label: "Rapids", note: "Ring marker", defaultOn: true, swatch: "dot",

      ] });

  });

  const titleCase = (s) => String(s).toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Aws|Ews|Cws)\b/g, (m) => m.toUpperCase());

  function applyGauges() {
    if (!M.ready || !M.map.getLayer("g-flow-ring")) return;

    M.vis("g-flow-ring", f); M.vis("g-rain-dot", r); M.vis("g-label", f || r);

    M.map.setPaintProperty("g-rain-dot", "icon-color", M.colorOf("g-rain"));

    const g = (k === "f" ? G?.flow : G?.rain)?.[i]; if (!g) return null;

      : { kind: "gauge-rain", region: M.R?.id || null, id: `gauge-rain:${g[0]}`, name: titleCase(g[1]), lat: g[2], lon: g[3], g };

  M.card["gauge-rain"] = (f) => ({ eyebrow: "Rain gauge", title: f.name,
    lines: [el("span", { class: "num", text: `CliFlo agent ${f.g[0]} · ${f.g[4]}` }), RF.util.copyable(fmt.coord(f.lat, f.lon))] });

      el("div", { class: "rf-row" }, el("span", { class: "rf-muted det-k", text: "Lat, lon" }), RF.util.copyable(fmt.coord(f.lat, f.lon))),
      el("div", { class: "rf-row" }, el("span", { class: "rf-muted det-k", text: "NZTM" }), RF.util.copyable(`${Math.round(E)} E, ${Math.round(N)} N`))));
  }
  const kv = (rows) => el("div", { class: "rf-tablewrap" }, el("table", { class: "rf-table det-stats" },
    el("tbody", {}, ...rows.map(([k, v, n]) => el("tr", {}, el("th", { scope: "row", text: k }), el("td", { class: "n", text: v }), n !== undefined ? el("td", { class: "rf-muted det-note", text: n }) : null)))));
  const showBtn = (f, ctx) => el("button", { type: "button", class: "rf-btn det-show", "aria-label": "Show on map", onclick: () => { ctx.close(); RF.go("map", { select: f }); } },
    el("span", { html: icon("pin"), "aria-hidden": "true" }), el("span", { class: "det-show-label", text: "Show on map" }));
  const live = () => RF.chart.placeholder("Live readings", "To do: live and historical readings will be integrated later. Follow the source links for current data.");

  RF.detail.register("gauge-flow", async (f, ctx) => {
    const g = f.g, src = (await RF.data.gauges()).sources?.flow, op = OPERATORS[g[5]];

      body: [

          ["Catchment area", `${fmt.km2(g[7])} km²`, "Upstream of the gauge"], ["Years of record", String(g[8] ?? "–"), "Used for the flood statistics"],
          ["Mean annual flood", `${fmt.flow(g[9])} m³/s`, "From the gauge record (Henderson & Collins 2018)"],
          ["10-year flood", `${fmt.flow(g[10])} m³/s`, ""], ["100-year flood", `${fmt.flow(g[11])} m³/s`, ""]]),

/* --- pages/top/top.js --- */
/* Top rivers page (#top): the ranked runs for the current model, in one region or across every region,
   with the filters and sorts a paddler uses. The bridge between the map browser and the model interface.
   Owned by the Top-rivers agent: see docs/ui/top-rivers.md and beads issue rf-aq6.5.
   Only edit files under src/river_finder/web/pages/top/. */
(() => {
  "use strict";
  const RF = window.RF, { el, fmt, icon } = RF.util;
  const PAGE = 20;       // rows shown first, then added each time the end of the list comes into view
  const ALL = "*";       // region picker value: rank across every region in RF.data.regions()
  const PARALLEL = 3;    // regions fetched at a time for "All regions"
  const STORE = "top:filters";
  const ROMAN = { 2: "II", 3: "III", 4: "IV", 5: "V", 6: "VI" };
  const STATUS = [["candidate", "New leads"], ["listed", "In guides"], ["heldout", "Test rivers"]];
  const STATUS_KEYS = STATUS.map(([k]) => k);
  const PILL = { candidate: ["rf-pill--ok", "New lead"], listed: ["", "In guides"], heldout: ["rf-pill--warn", "Test river"] };
  const SORTS = [["score", "Score (best first)"], ["grad", "Gradient (steepest)"], ["maf", "Flood flow (largest)"], ["len", "Length (longest)"]];
  const SORT_KEY = { grad: (r) => r.grad, maf: (r) => r.maf, len: (r) => r.len };
  const OPT = { grade: [2, 3, 4, 5, 6], grad: [10, 20, 30, 40, 50, 60, 80, 100], len: [1, 2, 3, 5, 10, 20],
    maf: [2, 5, 10, 20, 50, 100, 200, 500], road: [100, 250, 500, 1000, 2000, 5000] };
  const FALLS = [["any", "Any"], ["none", "None mapped"], ["some", "At least one"]];
  const DEFAULTS = () => ({ scope: null, sort: "score", status: STATUS_KEYS.slice(), gMin: null, gMax: null,
    lenMin: null, lenMax: null, mafMin: null, mafMax: null, gradMin: null, road: null, falls: "any" });

  let root = null, list = null, regionSel = null, newOnly = null, toggle = null, badge = null, panel = null, resetBtn = null;
  let progress = null, summary = null, modelLine = null;
  let F = DEFAULTS(), scope = null;
  let pool = [];          // items of the regions loaded so far: scope order, then the run finder's order
  let hasAcc = false, hasGrade = false, fallback = false, loading = false, stale = false, errors = [];
  let loadToken = 0, listToken = 0, io = null, rewind = false, frame = 0, view = null;
  const cache = new Map();          // region id → {model, params, items, fallback}
  const secIndex = new WeakMap();   // region → Map(reach → known sections on it)
  const ctl = {};                   // filter key → its control, for syncing after a reset

  // ---------- preferences (per browser) ----------
  function loadPrefs() {
    const d = DEFAULTS();
    try {
      const s = RF.store.get(STORE);
      if (!s || typeof s !== "object") return d;
      const pick = (v, opts) => (opts.includes(v) ? v : null);
      const status = Array.isArray(s.status) ? STATUS_KEYS.filter((k) => s.status.includes(k)) : [];
      return { scope: s.scope === ALL ? ALL : null, sort: SORTS.some(([k]) => k === s.sort) ? s.sort : d.sort,
        status: status.length ? status : d.status, gMin: pick(s.gMin, OPT.grade), gMax: pick(s.gMax, OPT.grade),
        lenMin: pick(s.lenMin, OPT.len), lenMax: pick(s.lenMax, OPT.len), mafMin: pick(s.mafMin, OPT.maf), mafMax: pick(s.mafMax, OPT.maf),
        gradMin: pick(s.gradMin, OPT.grad), road: pick(s.road, OPT.road), falls: FALLS.some(([k]) => k === s.falls) ? s.falls : d.falls };
    } catch (e) { return d; }
  }
  function savePrefs() { try { RF.store.set(STORE, F); } catch (e) { /* storage unavailable: filters last this visit only */ } }

  /** Active filters (sort and region are not filters). */
  function activeCount() {
    return [F.status.length !== STATUS_KEYS.length, F.gMin != null || F.gMax != null, F.lenMin != null || F.lenMax != null,
      F.mafMin != null || F.mafMax != null, F.gradMin != null, F.road != null, F.falls !== "any"].filter(Boolean).length;
  }

  // ---------- known sections: grade and guide link of a listed run ----------
  const gradeBin = (sec) => { const g = sec.gnum ?? sec.gmin ?? sec.gmax; return g == null ? 0 : Math.max(2, Math.min(6, Math.floor(g + 1e-6))); };
  /** The guide page among a section's links (not the API record), http(s) only. */
  function guideLink(sec) {
    const ok = (sec.links || []).filter((l) => l && /^https?:\/\//i.test(l.u || ""));
    return ok.find((l) => !/\/\/api\.|\.json(\?|$)/i.test(l.u)) || ok[0] || null;
  }
  function sectionsByReach(R) {
    let m = secIndex.get(R);
    if (!m) {
      m = new Map();
      (R.sections || []).forEach((s) => (s.m || []).forEach((reach) => { const a = m.get(reach); if (a) a.push(s); else m.set(reach, [s]); }));
      secIndex.set(R, m);
    }
    return m;
  }
  /** Rows of one region: the run plus what the list shows about it. The section a run is matched to is the
   *  graded one it overlaps most (else the one it overlaps most); the guide link is the first one with a link. */
  function itemsFor(R, runs) {
    const idx = sectionsByReach(R), title = R.title || R.id;
    return runs.map((r, k) => {
      const hits = new Map();
      r.members.forEach((m) => (idx.get(m) || []).forEach((s) => hits.set(s, (hits.get(s) || 0) + 1)));
      const secs = [...hits].sort((a, b) => (gradeBin(b[0]) ? 1 : 0) - (gradeBin(a[0]) ? 1 : 0) || b[1] - a[1]).map(([s]) => s);
      const sec = secs[0] || null;
      return { r, k, region: title, sec, bin: sec ? gradeBin(sec) : 0, link: secs.map(guideLink).find(Boolean) || null };
    });
  }

  // ---------- loading: one region, or all of them a few at a time ----------
  const yieldMain = () => (globalThis.scheduler?.yield ? globalThis.scheduler.yield() : new Promise((r) => setTimeout(r, 0)));

  /** The cached rows of a region, if they are for the current model and run-finder settings. */
  const fresh = (id) => { const c = cache.get(id); return c && c.model === RF.state.model && c.params === RF.state.runParams ? c : null; };

  /** Rows of one region. release: forget the region's decoded reaches afterwards (All regions keeps only the
   *  rows, so a national scan does not hold every region in memory; Map and Details load it again on demand). */
  async function regionItems(id, release) {
    const model = RF.state.model, params = RF.state.runParams, hit = fresh(id);
    if (hit) return hit;
    const R = await RF.data.region(id);
    const sc = model ? await RF.data.scores(id, model) : null;
    await yieldMain();   // the region was just decoded: let the page paint before the run finder runs
    const out = { model, params, items: itemsFor(R, RF.runs.find(R, { model: sc })), fallback: !!sc?.fallback };
    if (model === RF.state.model && params === RF.state.runParams) cache.set(id, out);
    if (release) RF.data.release(id);
    return out;
  }

  async function load() {
    const my = ++loadToken, regions = RF.data.regions(), ids = scope === ALL ? regions.map((r) => r.id) : [scope];
    const title = (id) => regions.find((r) => r.id === id)?.title || id;
    errors = [];
    if (ids.every(fresh)) {   // all in memory (a model or region switched back): no loading state, no flash
      const parts = ids.map(fresh);
      pool = parts.flatMap((p) => p.items); fallback = parts.some((p) => p.fallback); loading = false;
      setProgress(ids.length, ids.length); update();
      return;
    }
    const parts = new Array(ids.length);
    let next = 0, done = 0;
    pool = []; fallback = false; loading = true;
    setProgress(0, ids.length);
    update();
    const worker = async () => {
      while (next < ids.length) {
        const i = next++;
        try { parts[i] = await regionItems(ids[i], ids.length > 1); } catch (e) { if (my === loadToken) errors.push([title(ids[i]), e.message]); }
        if (my !== loadToken) return;
        done++;
        pool = parts.flatMap((p) => p?.items || []);
        fallback = parts.some((p) => p?.fallback);
        setProgress(done, ids.length);
        schedule();
        await yieldMain();
        if (my !== loadToken) return;
      }
    };
    await Promise.all(Array.from({ length: Math.min(PARALLEL, ids.length) }, worker));
    if (my !== loadToken) return;
    loading = false;
    setProgress(done, ids.length);
    update({ keep: true });
  }

  /** Reload now, or on the next visit when the page is hidden (model or run-finder changes elsewhere). */
  function reload() { if (root.hidden) stale = true; else load(); }

  function setProgress(done, total) {
    const lines = [];
    if (scope === ALL && (loading || errors.length)) {
      lines.push(el("span", { text: loading ? `Loaded ${done} of ${total} regions. The ranking updates as each one arrives. This downloads every region: best on Wi-Fi.` : `Ranked across ${total - errors.length} of ${total} regions.` }));
      if (loading) lines.push(el("progress", { max: total, value: done, "aria-hidden": "true" }));
    }
    if (errors.length) lines.push(el("span", { class: "top-err", text: `Could not load ${errors.map(([t, m]) => `${t} (${m})`).join("; ")}.` }));
    progress.replaceChildren(...lines);
    progress.hidden = !lines.length;
  }

  /** Re-rank once per frame while regions arrive (keeps the rows already shown and the scroll position). */
  function schedule() { if (!frame) frame = requestAnimationFrame(() => { frame = 0; update({ keep: true }); }); }

  // ---------- filtering and sorting ----------

      el("span", { class: "rf-eyebrow", text: label }),
      el("select", { id, class: "rf-select", onchange }, ...opts.map(([v, t]) => el("option", { value: v, selected: v === value, text: t }))));
    const controls = el("div", { class: "rf-row models-ctls" },
      pick("models-split", "Test set", sp.map((s) => [s.name, s.name === "reference" ? "Reference: the Mangakarengorengo only" : `Guide research: ${s.test.length} held-out rivers (${s.name})`]),
        view.split, (e) => { view.split = e.target.value; render(); }),
      pick("models-coords", "Test sections", [["any", "All coordinates, inferred included"], ["sourced", "Published coordinates only"]],
        view.coords, (e) => { view.coords = e.target.value; render(); }));
    const rows = RF.models.list().slice().reverse().map((m) => {
      const e = evalOf(m.id) || {};

        el("td", {}, el("strong", { text: m.title || m.id })),
        el("td", { class: "n", text: e.test_rivers != null ? `${e.test_rivers}${cut}` : "–" }),
        el("td", { class: "n", text: F2(e.auc) }), el("td", { class: "n", text: F2(e.auc_size_matched) }),
        el("td", { class: "n", text: F2(e.auc_style_matched) }), el("td", { class: "n", text: F2(e.auc_style_size_matched) }),
        el("td", { class: "n", text: PCT(e.recall_top10) }), el("td", { class: "n", text: e.median_pct != null ? Math.round(e.median_pct) : "–" }));
    });
    const s = sp.find((x) => x.name === view.split) || {};
    return el("div", { class: "rf-stack" }, controls,
      table([th("Model"), th("Test rivers", true), th("AUC", true), th("Size-matched", true), th("Style-matched", true),
        th("Style × size", true), th("Top 10%", true, "Share of test reaches in the model's top 10%"), th("Median pct", true)], rows),
      el("p", { class: "rf-note", html: `Each model ranks every reach of 2&nbsp;km² or more that is not on a known run (the background, which still holds unknown runs, so these are lower bounds). Test reaches should rank high. <b>AUC</b>: chance a test reach outranks a random background reach. <b>Size-matched</b>: only against background reaches of similar flood size. <b>Style-matched</b>: only against the same paddling style (Montgomery &amp; Buffington reach type from slope and confinement), so preferring steep creeks earns nothing. <b>Style × size</b>: same style and same flood quintile, so neither "steep" nor "big" earns anything. (−n): test rivers left out because that model trained on them.${s.strata ? ` Split: ${esc(s.strata)}, seed ${esc(s.seed ?? "fixed")}.` : ""}` }),
      el("p", { class: "rf-note", text: "This split holds out whole rivers, not whole catchments, so a test river can share its catchment with training rivers. That flatters flexible models; the cross-validation below holds out whole catchments and is the more honest comparison." }));
  }

  function cvSection() {
    const cv = CV();
    if (!cv) return el("p", { class: "rf-note", text: "No cross-validation results in this build (run `river-finder ml cv`)." });
    const ms = cv.models.slice().sort((a, b) => (b.cv.auc_style_size?.mean ?? 0) - (a.cv.auc_style_size?.mean ?? 0));
    const ms_ = (m, k) => { const v = m.cv[k]; return v ? `${F3(v.mean)}` : "–"; };
    const tip = (m, k) => { const v = m.cv[k]; return v ? `± ${F3(v.sd)} over repeats, ± ${F3(v.fold_sd)} over single folds` : null; };
    const rows = ms.map((m) => el("tr", {},
      el("td", {}, el("strong", { text: m.title }), el("span", { class: "rf-muted models-id", text: ` ${m.id}` })),
      el("td", { text: KIND[m.kind] || m.kind }), el("td", { class: "n", text: m.inputs }),
      el("td", { class: "n", title: tip(m, "auc_style_size"), text: ms_(m, "auc_style_size") }),
      el("td", { class: "n", title: tip(m, "auc_style"), text: ms_(m, "auc_style") }),
      el("td", { class: "n", title: tip(m, "auc_size"), text: ms_(m, "auc_size") }),
      el("td", { class: "n", title: tip(m, "auc"), text: ms_(m, "auc") }),
      el("td", { class: "n", text: m.cv.recall_top10 ? PCT(m.cv.recall_top10.mean) : "–" }),
      el("td", { class: "n", text: F3(m.loro_auc_style) })));
    return el("div", { class: "rf-stack" },
      table([th("Model"), th("Kind"), th("Inputs", true), th("Style × size", true), th("Style-matched", true), th("Size-matched", true),
        th("AUC", true), th("Top 10%", true), th("Held-out region", true, "Style-matched AUC with a whole guide region held out (mean over regions)")], rows),
      el("p", { class: "rf-note", html: `Out-of-fold means over ${esc(cv.repeats)} repeats of a ${esc(cv.folds)}-fold split that holds out whole sea-outlet catchments; every reach of ${esc(cv.domain_km2)}&nbsp;km² or more gets a score from a model that never saw its catchment. Hover a number for its spread. These are the model recipes, not the frozen cards above: <span class="num">v3</span> is the <span class="num">gbm_terrain</span> recipe trained once on the v2 training rivers. Style matching alone does not control river size (flood size alone scores about 0.90 style-matched), so style × size is the column that separates the models.` }),
      el("p", { class: "rf-note" }, mlPage ? "Every number, chart, data source and transformation is on the " : "Every number, chart and transformation is documented on the ML page (", mlLink(mlPage ? "ML page" : "build it with `river-finder ml page` before `web build`"), mlPage ? ", with the reach-type spec (PDF)." : ")."));
  }

  function render() {
    const p = RF.state.runParams || {};
    root.replaceChildren(el("div", { class: "rf-doc" },
      el("header", { class: "rf-stack" },
        el("span", { class: "rf-eyebrow", text: "Model interface" }),
        el("h1", { text: "Models" }),
        el("p", { class: "rf-note", text: "Which model is in use, what it was trained on, how it does on rivers and catchments it never saw, and the run-finder settings that the map and Top rivers use." }),
        mlPage ? el("p", { class: "rf-row" }, el("a", { href: "ml.html", class: "rf-btn models-mlbtn", html: `${RF.util.icon("model")}Open the ML page` }),
          el("span", { class: "rf-note", text: "Cross-validated metrics for every model, data by region and paddling style, feature separation and full documentation." })) : null,
        el("span", { class: "rf-status", text: "In progress: run-finder tuning and separation views are still to come" })),
      el("section", { class: "rf-panel rf-stack", "aria-labelledby": "models-reg-h" },
        el("h2", { id: "models-reg-h", text: "Models in this build" }),
        el("p", { class: "rf-note", text: "Choosing a model here changes the predicted runs on the map and the ranking in Top rivers (RF.setModel)." }),
        modelsTable()),
      el("section", { class: "rf-panel rf-stack", "aria-labelledby": "models-ev-h" },
        el("h2", { id: "models-ev-h", text: "On held-out guide rivers" }),
        evalSection()),
      el("section", { class: "rf-panel rf-stack", "aria-labelledby": "models-cv-h" },
        el("h2", { id: "models-cv-h", text: "Cross-validated model recipes" }),
        cvSection()),
      el("section", { class: "rf-panel rf-stack" },
        el("h2", { text: "Run-finder settings in use" }),
        el("dl", { class: "rf-kv" },
          el("dt", { text: "Flood flow, full credit" }), el("dd", { class: "num", text: p.q ? `${p.q[0]}–${p.q[1]} m³/s` : "–" }),
          el("dt", { text: "Gradient, full credit" }), el("dd", { class: "num", text: p.g ? `${p.g[0]}–${p.g[1]} m/km` : "–" }),
          el("dt", { text: "Height-to-area measure" }), el("dd", { text: p.haMeasure || "–" }),
          el("dt", { text: "Weights (flow, gradient, H/A)" }), el("dd", { class: "num", text: p.w ? p.w.join(", ") : "–" }),
          el("dt", { text: "Threshold" }), el("dd", { class: "num", text: p.threshold ?? "–" }),
          el("dt", { text: "Minimum run length" }), el("dd", { class: "num", text: p.minLen != null ? `${p.minLen} km` : "–" })),
        el("div", { class: "rf-row" }, el("button", { type: "button", class: "rf-btn", onclick: () => RF.setRunParams(null) }, "Reset to defaults")))));
  }

  RF.page("models", {
    title: "Models",
    mount(el_) { root = el_; render(); checkMlPage(); RF.on("model", render); RF.on("runs", render); },
    show() {},
    hide() {},
  });
})();

/* --- pages/info/info.js --- */
/* Info page (#info): what River Finder is, how it works, where the data comes from, current state.
   Also shows a short welcome dialog on a browser's first visit (and again when INFO_VERSION changes).
   Owner: core (beads rf-aq6.6). */
(() => {
  "use strict";
  const RF = window.RF, { el, fmt } = RF.util;
  const INFO_VERSION = "2026-11-18";
  const REPO = "https://github.com/Sean-McConnachie/river-finder";
  const ARC = "https://services3.arcgis.com/fp1tibNcN9mbExhG/ArcGIS/rest/services";

  const link = (href, text) => el("a", { href, target: "_blank", rel: "noopener" }, text);

  const SOURCES = [
    ["Elevation (8 m national DEM, 1 m LiDAR)", "LINZ, via the nz-elevation open data bucket", "Flow routing, catchment area, gradient, terrain shading", "CC BY 4.0",
      "https://registry.opendata.aws/nz-elevation/"],
    ["Satellite imagery (EOxCloudless 2025)", "EOX IT Services; contains modified Copernicus Sentinel data 2025", "Satellite base map (10 m)",
      "CC BY-NC-SA 4.0", "https://cloudless.eox.at"],
    ["NZ Topo50 maps", "LINZ Basemaps", "Topographic base map (standalone site, when built with a Basemaps key)", "CC BY 4.0", "https://basemaps.linz.govt.nz/"],
    ["River lines and names (NZ River Name Lines, Topo50)", "LINZ Data Service", "The river network on the map and its names", "CC BY 4.0",
      "https://data.linz.govt.nz/layer/103632-nz-river-name-lines-pilot/"],
    ["River network (REC2)", "NIWA (now Earth Sciences NZ)", "Reach names, validation of catchment areas", "CC BY 4.0", `${ARC}/REC2_Layers/FeatureServer/0`],
    ["River and rain gauges", "NIWA flood-statistics gauge sites; NIWA CliFlo stations", "Gauge layers, flood statistics at gauges", "CC BY 4.0",
      `${ARC}/NZ_Flood_Statistics_Henderson_Collins_V2_FlowGauges_Layer_WFL2/FeatureServer/0`],
    ["Flood statistics (Henderson and Collins 2018)", "NIWA (now Earth Sciences NZ)", "Mean annual flood per reach (the flow parameter)", "CC BY 4.0",
      `${ARC}/NZ_Flood_Statistics_Henderson_Collins_V2_REC1_Layer_WFL1/FeatureServer/0`],
    ["Live rain (ECMWF IFS open data, hourly)", "ECMWF, via Open-Meteo (open-meteo.com)",
      "Rain layer and river cards: rain over each catchment, past and next 1 to 24 h (model, not gauged; standalone site)", "CC BY 4.0",
      "https://www.ecmwf.int/en/forecasts/datasets/open-data"],
    ["Geology 1:250 000 (2023)", "GNS Science (now Earth Sciences NZ)", "Hard-rock beds", "CC BY 4.0",
      "https://gis.gns.cri.nz/server/rest/services/NZL_GNS_250K_Geology_2023/NZL_GNS_250K_geology_FeatureService_NZ/FeatureServer/55"],
    ["Known whitewater sections", "NZ RiverGuide (Whitewater NZ; WWNZ and Graham Charles, NZ Whitewater 4th ed.)", "Known runs, grades, training and test labels",
      "CC BY-SA 3.0 NZ", "https://www.riverguide.co.nz/"],
    ["More sections and beta", "packraftingtrips.nz, FurtherFaster, Ruahine Whitewater Club and others", "Sections not in the river guide (summaries with links)",
      "Owners' copyright (linked only)", "https://www.packraftingtrips.nz/"],
    ["Waterfalls, rapids, roads and tracks", "OpenStreetMap contributors, via Overture Maps", "Waterfall layer and heights, access distances, road names", "ODbL",

  function section(title, ...body) {

  function glance() {
    const regions = RF.data.regions(), models = RF.models.list();
    const guide = regions.filter((r) => !/reference/i.test(r.group || "")).length, refs = regions.length - guide;
    const reaches = regions.reduce((t, r) => t + (r.segments || 0), 0);
    const items = [
      ["Regions in this build", regions.length ? `${guide} river-guide regions${refs ? `, ${refs} reference areas` : ""}` : "none (no data)"],
      ["Reaches shown", reaches ? fmt.int(reaches) : "–"],
      ["Known sections", "339 (guide research, Nov 2026)"],

    return el("dl", { class: "info-glance" }, ...items.flatMap(([k, v]) => [el("div", {}, el("dt", { text: k }), el("dd", { text: v }))]));
  }

  function modelTable() {
    const ev = RF.models.evaluations?.evaluations || [];
    const rows = ev.filter((e) => e.split === "guides-v1" && e.coords === "any");

    rows.forEach((e) => tb.append(el("tr", {},
      el("td", {}, el("strong", { text: RF.models.get(e.model)?.title || e.model })),
      el("td", { class: "n", text: e.auc.toFixed(2) }), el("td", { class: "n", text: e.auc_size_matched.toFixed(2) }),
      el("td", { class: "n", text: `${Math.round(e.recall_top10 * 100)}%` }))));
    return el("div", { class: "rf-tablewrap" }, el("table", { class: "rf-table" },
      el("thead", {}, el("tr", {}, el("th", { text: "Model" }), el("th", { class: "n", text: "AUC" }), el("th", { class: "n", text: "Size-matched AUC" }),
        el("th", { class: "n", text: "Top-10% recall" }))), tb));
  }

  function sourcesTable() {
    const tb = el("tbody");
    SOURCES.forEach(([what, who, use, lic, href]) => tb.append(el("tr", {},
      el("td", {}, link(href, what)), el("td", { text: who }), el("td", { text: use }), el("td", { text: lic }))));
    return el("div", { class: "rf-tablewrap" }, el("table", { class: "rf-table info-sources" },
      el("thead", {}, el("tr", {}, ...["Data", "From", "Used for", "Licence"].map((h) => el("th", { text: h })))), tb));
  }

  const STEPS = [
    ["Terrain", "LINZ elevation models: the 8 m national DEM everywhere, 5 m from 1 m LiDAR in three reference areas (Kaimai Range, Karangahake Gorge, Tutamoe plateau)."],
    ["Flow", "Every cell drains to its steepest neighbour (Priority-Flood, D8, flat resolution). Summing upstream cells gives the catchment area of every point, checked against NIWA's REC2."],
    ["Reaches", "Channels over 0.5 km² are cut into reaches of about 250 m, each with gradient, steepest 50 m, catchment area, mean annual flood, height-to-area and geology."],

  ];

  function render(root) {
    const C = RF.config;
    root.replaceChildren(el("div", { class: "rf-doc info-doc" },
      el("header", { class: "info-hero" },

        el("h1", { text: "River Finder" }),
        el("p", { class: "info-lede", text: "Finds steep, runnable whitewater in New Zealand that is not in any guidebook, from terrain, flood statistics and geology, using the rivers already in the guides as the reference." }),
        el("div", { class: "rf-row" },
          el("button", { type: "button", class: "rf-btn rf-btn--primary", onclick: () => RF.go("map") }, "Open the map"),
          el("button", { type: "button", class: "rf-btn", onclick: () => RF.go("top") }, "See top rivers")),
        glance()),
      el("aside", { class: "info-safety", role: "note" },
        el("strong", { text: "Leads, not trip reports." }),
        el("span", { text: " Candidates come from terrain data only. Check access, land ownership, hazards, flows and local knowledge before going anywhere. Nothing here says a river is safe or runnable." })),

      section("Using the app",

          el("li", {}, el("strong", { text: "Map: " }), "pick a base map (terrain, satellite, catchment area) and switch layers on and off: known rivers by grade, predicted runs by score, the LINZ river network, live rain, gauges, waterfalls, roads and tracks. Tap anything for its details."),
          el("li", {}, el("strong", { text: "Top rivers: " }), "the best-scoring runs for the current model, each one a tap away on the map."),
          el("li", {}, el("strong", { text: "Models: " }), "which model is in use, how each does on rivers it never saw, and the run-finder settings."))),
      section("Current state",
        el("p", { class: "rf-note", html: `Models are tested on 49 guide rivers held out of training. <b>Flood size alone</b> already ranks guide rivers high (AUC 0.92 against every reach of 2 km² or more), so the <b>size-matched AUC</b>, which compares each test reach only with reaches of similar flood size, is the number that shows real terrain skill (0.5 = chance).` }),
        modelTable(),
        el("ul", { class: "info-list" },
          el("li", { text: "Catchment areas: named reference rivers within 3.2% of NIWA REC2; 70–82% of reaches over 5 km² within 10% (target 90%, not met yet: flat plateau divides and floodplain offsets on the 8 m contour DEM)." }),
          el("li", { text: "Known sections: 339 from the guide research; 301 take-outs were inferred from directions, so section extents are approximate." }),
          el("li", { text: "Waterfalls: OpenStreetMap coverage is patchy. No mapped waterfall does not mean no waterfall." }),
          el("li", { text: "Flow: mean annual flood is a statistic, not live flow. Gauge links point to the sources; live readings are planned." }),

        "Built ", el("span", { class: "num", text: C.built || "–" }), C.commit ? [" from ", link(`${REPO}/commit/${C.commit}`, C.commit)] : "",
        ` · ${C.target === "artifact" ? "claude.ai artifact" : "standalone site"} · `, link(REPO, "Source code"))));
  }

  function welcome() {

  RF.on("ready", () => {
    if (RF.store.get("info-seen") === INFO_VERSION) return;

  RF.page("info", {
    title: "Info",
    mount(root) { render(root); RF.on("model", () => render(root)); },
  });
  RF.info = { welcome, version: INFO_VERSION };
})();
