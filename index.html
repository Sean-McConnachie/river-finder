      if (!ok[s] || runId[s] >= 0 || (S.u[s] >= 0 && ok[S.u[s]])) continue;
      const members = []; let gap = [], cur = s;
      while (cur >= 0 && runId[cur] < 0) {
        if (ok[cur]) { members.push(...gap, cur); gap = []; }
        else { gap.push(cur); if (gap.length > p.maxGap) break; }
        cur = S.d[cur];
      }
      if (members.reduce((t, m) => t + S.len[m], 0) / 1000 < p.minLen) continue;
      const rid = runs.length; members.forEach((m) => { runId[m] = rid; });
      const r = summarize(C, members);
      runs.push(Object.assign({ kind: "run", region: R.id, id: `${R.id}:run:${members[0]}`, rid, members, name: r.river || "Unnamed creek" }, r));
    }
    const layers = paretoLayers(runs.map((r) => [Math.log10(Math.max(r.maf, 1e-3)), r.effG, r.ha]));
    runs.forEach((r, i) => { r.layer = layers[i]; });
    return rankBy === "pareto" ? runs.sort((a, b) => a.layer - b.layer || b.ws - a.ws) : runs.sort((a, b) => b.score - a.score);
  }

  let memo = null;
  /**
   * The numbers find() gives a run (len, grad, s50, aTop, aBot, maf, ha, score, acc, falls, ...) for any set of
   * reaches, such as a known section, scored with the same parameters and model. A section placed by river
   * name can be several separate pieces: `pieces` says how many (see summarize). Null when no reaches.
   * opts as find().
   */
  function measure(R, members, opts = {}) {
    const S = R?.segments, ms = S ? [...new Set(members || [])].filter((m) => m >= 0 && m < S.g.length) : [];
    if (!ms.length) return null;
    const p = opts.params || RF.state.runParams || defaults(), model = opts.model || null, rankBy = opts.rankBy || (model ? "model" : "pareto");
    if (!memo || memo.R !== R || memo.p !== p || memo.model !== model || memo.rankBy !== rankBy) memo = context(R, { params: p, model, rankBy });
    return summarize(memo, ms);
  }

  /** Two Chaikin passes: softens the 5-8 m grid staircase; keeps both end points. */
  function smooth(pts) {
    if (pts.length < 3) return pts;
    let sm = pts;
    for (let pass = 0; pass < 2; pass++) {
      const nx = [sm[0]];
      for (let i = 0; i < sm.length - 1; i++) {
        const a = sm[i], b = sm[i + 1];
        nx.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]], [0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
      }
      nx.push(sm[sm.length - 1]);
      sm = nx;
    }
    return sm;
  }
  const join = (S, ms) => {
    const pts = [];
    ms.forEach((m) => S.c[m].forEach((pt, k) => {
      const q = pts[pts.length - 1];
      if (k === 0 && q && q[0] === pt[0] && q[1] === pt[1]) return;
      pts.push(pt);
    }));
    return pts;
  };

  /** One smoothed line for reaches already in downstream order (a run): [[lon, lat], ...]. */
  function path(S, members) { return smooth(join(S, members)); }

  /**
   * Smoothed lines for any set of reaches (in any order, with branches): one line per connected
   * downstream chain, so reaches are never joined out of order. Returns [[[lon, lat], ...], ...].
   */
  function chains(S, members) {
    const set = new Set(members), fed = new Set(), seen = new Set(), out = [];
    members.forEach((m) => { if (set.has(S.d[m])) fed.add(S.d[m]); });
    const walk = (start) => {
      const chain = []; let cur = start;
      while (cur >= 0 && set.has(cur) && !seen.has(cur)) { seen.add(cur); chain.push(cur); cur = S.d[cur]; }
      if (!chain.length) return;
      const pts = join(S, chain);
      if (cur >= 0 && seen.has(cur)) pts.push(S.c[cur][0]); // close the joint at a confluence already drawn
      out.push(smooth(pts));
    };
    members.filter((m) => !fed.has(m)).forEach(walk);
    members.forEach((m) => { if (!seen.has(m)) walk(m); });
    return out;
  }

  /** Every reach upstream of (and including) a reach: Uint8Array mask in reach order. */
  function upstream(S, seg) {
    const n = S.d.length, ups = new Array(n);
    for (let i = 0; i < n; i++) { const d = S.d[i]; if (d >= 0) (ups[d] ||= []).push(i); }
    const mask = new Uint8Array(n), stack = [seg];
    while (stack.length) { const s = stack.pop(); if (mask[s]) continue; mask[s] = 1; (ups[s] || []).forEach((u) => stack.push(u)); }
    return mask;
  }

  RF.runs = { defaults, find, measure, pieces, path, chains, smooth, upstream, segmentScores, percentiles, paretoLayers };
})();

/* --- core/detail.js --- */
/* RF.detail: the full-screen detail view used for anything selectable (rivers, gauges, waterfalls,
   roads). It sits over the current page without touching it, so closing it (×, Esc, browser back)
   leaves the map view and every scroll position exactly as they were. Owner: core.
   Renderers are registered per feature kind (the Map page registers river, waterfall, gauge, ...). */
(() => {
  "use strict";
  const RF = window.RF, { el, icon, esc } = RF.util;
  const renderers = {};
  let current = null; // {wrap, opener, pushed, feature}

  function onKey(e) { if (e.key === "Escape" && current) { e.preventDefault(); close(); } }

  function fallback(f) {
    const dl = el("dl", { class: "rf-kv" });
    Object.entries(f).forEach(([k, v]) => {
      if (v === null || v === undefined || typeof v === "object") return;
      dl.append(el("dt", { text: k }), el("dd", { text: String(v) }));
    });
    return { title: f.name || f.kind || "Details", eyebrow: f.kind, body: dl };
  }

  /** Open the detail view for a feature reference. Returns a promise that resolves when rendered. */
  async function open(feature, opts = {}) {
    if (!feature) return;
    if (current) remove();
    const opener = opts.opener || document.activeElement;
    const titles = el("div", { class: "rf-detail-titles" },
      el("span", { class: "rf-eyebrow", "data-role": "eyebrow" }), el("h2", { "data-role": "title", id: "rf-detail-title", text: feature.name || "Loading…" }),
      el("span", { class: "rf-muted", "data-role": "subtitle", style: "font-size:var(--fs-sm)" }));
    const closeBtn = el("button", { type: "button", class: "rf-btn rf-btn--quiet rf-iconbtn", "aria-label": "Close details", html: icon("close") });
    closeBtn.addEventListener("click", () => close());
    const actions = el("div", { class: "rf-row", "data-role": "actions" });
    const head = el("header", { class: "rf-detail-head" }, titles, actions, closeBtn);
    const doc = el("div", { class: "rf-doc" }, el("p", { class: "rf-muted", text: "Loading…" }));
    const body = el("div", { class: "rf-detail-body" }, doc);
    const wrap = el("div", { class: "rf-detail", role: "dialog", "aria-modal": "true", "aria-labelledby": "rf-detail-title" }, head, body);
    document.body.append(wrap);
    let pushed = false;
    if (!opts.noHistory) { try { history.pushState({ rfDetail: true }, "", location.hash || "#"); pushed = true; } catch (e) { pushed = false; } }
    current = { wrap, opener, pushed, feature };
    document.addEventListener("keydown", onKey);
    closeBtn.focus({ preventScroll: true, focusVisible: false });
    RF.select(feature);
    try {
      const render = renderers[feature.kind] || fallback;
      const out = (await render(feature, { actions, close })) || {};
      if (!current || current.wrap !== wrap) return; // closed while rendering
      head.querySelector('[data-role="eyebrow"]').textContent = out.eyebrow || "";
      head.querySelector('[data-role="title"]').textContent = out.title || feature.name || "Details";
      head.querySelector('[data-role="subtitle"]').textContent = out.subtitle || "";
      doc.replaceChildren(...[].concat(out.body || []));
    } catch (e) {
      console.error(e);
      doc.replaceChildren(el("p", { html: `Could not show these details: ${esc(e.message)}` }));
    }
  }

  function remove() {
    if (!current) return;
    const { wrap, opener } = current;
    wrap.remove(); document.removeEventListener("keydown", onKey);
    current = null;
    try { opener?.focus?.({ preventScroll: true }); } catch (e) { /* gone */ }
  }

  /** Close the detail view (pops the history entry it pushed, so Back and × behave the same). */
  function close(opts = {}) {
    if (!current) return;
    if (current.pushed && !opts.fromHistory) { current.pushed = false; try { history.back(); } catch (e) { /* ignore */ } }
    remove();
    RF.emit("detail-close", {});
  }

  RF.detail = {
    /** render(feature, {actions, close}) → {title, subtitle, eyebrow, body: Node | Node[]} (may be async). */
    register(kind, render) { renderers[kind] = render; },
    open, close,
    isOpen: () => !!current,
    current: () => current?.feature || null,
  };
})();

/* --- core/chart.js --- */
/* RF.chart: small SVG charts in the app's tokens. Owner: core.
   RF.chart.tracks({x, xLabel, tracks: [{label, unit, y, color, area, fmt, markers}], ...}) draws one
   graph with stacked tracks that share the x axis and one crosshair (each track has its own y scale:
   several measures along a river without a misleading dual axis). Redraws on resize; touch friendly. */
(() => {
  "use strict";
  const RF = window.RF, { el } = RF.util;
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs = {}, ...kids) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v !== null && v !== undefined) e.setAttribute(k, v); });
    kids.forEach((k) => k !== null && k !== undefined && e.append(k.nodeType ? k : document.createTextNode(String(k))));
    return e;
  };

  /** About n round tick values covering [lo, hi]. */
  function ticks(lo, hi, n = 4) {
    if (!(hi > lo)) return [lo];
    const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
    const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
    return out;
  }
  const nearest = (xs, v) => { let lo = 0, hi = xs.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < v) lo = m; else hi = m; } return Math.abs(xs[lo] - v) <= Math.abs(xs[hi] - v) ? lo : hi; };

  function tracks(opts) {
    const { x, tracks: T, xLabel = "", xFmt = (v) => v.toFixed(1), label = "Chart" } = opts;
    const wrap = el("figure", { class: "rf-chart", role: "img", "aria-label": label });
    const tip = el("div", { class: "rf-chart-tip", hidden: true });
    const host = el("div", { class: "rf-chart-host" });
    wrap.append(host, tip);
    const M = { l: 52, r: 14, t: 22, gap: 30, b: 34 };

    function draw() {
      const W = Math.max(280, host.clientWidth || 600);
      const heights = T.map((t) => t.height || 120);
      const H = M.t + heights.reduce((a, b) => a + b, 0) + M.gap * (T.length - 1) + M.b;
      const x0 = x[0], x1 = x[x.length - 1] > x0 ? x[x.length - 1] : x0 + 1;
      const sx = (v) => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
      const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "rf-chart-svg" });
      let top = M.t;
      const frames = [];
      T.forEach((t, k) => {
        const h = heights[k], ys = t.y.filter((v) => v !== null && isFinite(v));
        let lo = Math.min(...ys), hi = Math.max(...ys);
        if (t.zero) lo = Math.min(0, lo);
        if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
        const pad = (hi - lo) * 0.08; lo -= t.zero && lo === 0 ? 0 : pad; hi += pad;
        const tk = ticks(lo, hi, h > 100 ? 4 : 3);
        const sy = (v) => top + h - (v - lo) / (hi - lo) * h;
        svg.append(s("text", { x: M.l, y: top - 8, class: "rf-chart-title" }, `${t.label}${t.unit ? ` (${t.unit})` : ""}`));
        tk.forEach((v) => {
          if (v < lo || v > hi) return;
          svg.append(s("line", { x1: M.l, x2: W - M.r, y1: sy(v), y2: sy(v), class: "rf-chart-grid" }));
          svg.append(s("text", { x: M.l - 6, y: sy(v) + 4, class: "rf-chart-ylab", "text-anchor": "end" }, (t.fmt || ((q) => String(q)))(v)));
        });
        const pts = x.map((xv, i) => (t.y[i] === null || !isFinite(t.y[i]) ? null : [sx(xv), sy(t.y[i])])).filter(Boolean);
        if (t.area && pts.length > 1) {
          svg.append(s("path", { d: `M${pts[0][0]},${top + h}L${pts.map((p) => p.join(",")).join("L")}L${pts[pts.length - 1][0]},${top + h}Z`, fill: t.color, "fill-opacity": 0.12, stroke: "none" }));
        }
        svg.append(s("path", { d: `M${pts.map((p) => p.join(",")).join("L")}`, fill: "none", stroke: t.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
        (t.markers || []).forEach((mk) => {
          const px = sx(mk.x), i = nearest(x, mk.x), py = sy(t.y[i]);
          svg.append(s("path", { d: `M${px},${py - 9}l-5,-9h10z`, class: "rf-chart-marker" }, s("title", {}, mk.label)));
        });
        svg.append(s("line", { x1: M.l, x2: W - M.r, y1: top + h, y2: top + h, class: "rf-chart-axis" }));
        frames.push({ top, h, sy, t });
        top += h + M.gap;
      });
      const base = top - M.gap;
      ticks(x0, x1, Math.max(3, Math.floor((W - M.l) / 90))).forEach((v) => {
        if (v < x0 || v > x1) return;
        svg.append(s("text", { x: sx(v), y: base + 16, class: "rf-chart-xlab", "text-anchor": "middle" }, xFmt(v)));
      });
      if (xLabel) svg.append(s("text", { x: W - M.r, y: base + 30, class: "rf-chart-xlab", "text-anchor": "end" }, xLabel));
      // crosshair
      const cross = s("line", { y1: M.t - 4, y2: base, class: "rf-chart-cross", visibility: "hidden" });
      const dots = frames.map((f) => s("circle", { r: 4, fill: f.t.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
      const hit = s("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: H, fill: "transparent", class: "rf-chart-hit" });
      svg.append(cross, ...dots, hit);
      const move = (ev) => {
        const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
        const xv = x0 + (px - M.l) / (W - M.l - M.r) * (x1 - x0), i = nearest(x, xv), cx = sx(x[i]);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
        const lines = [`${xLabel ? `${xFmt(x[i])} ${xLabel.replace(/^.*\((.*)\)$/, "$1")}` : xFmt(x[i])}`];
        frames.forEach((f, k) => {
          const v = f.t.y[i];
          if (v === null || !isFinite(v)) { dots[k].setAttribute("visibility", "hidden"); return; }
          dots[k].setAttribute("cx", cx); dots[k].setAttribute("cy", f.sy(v)); dots[k].setAttribute("visibility", "visible");
          lines.push(`${f.t.label}: ${(f.t.tipFmt || f.t.fmt || String)(v)}${f.t.unit ? ` ${f.t.unit}` : ""}`);
        });
        tip.replaceChildren(...lines.map((l, k) => el("div", { class: k ? "" : "rf-chart-tip-x", text: l })));
        tip.hidden = false;
        const left = (cx / W) * r.width;
        tip.style.left = `${Math.min(Math.max(left + 12, 0), r.width - tip.offsetWidth - 4)}px`;
        if (left + 12 + tip.offsetWidth > r.width) tip.style.left = `${Math.max(left - tip.offsetWidth - 12, 0)}px`;
      };
      const leave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); };
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", leave);
      host.replaceChildren(svg);
    }
    const ro = new ResizeObserver(RF.util.debounce(draw, 60));
    ro.observe(host);
    requestAnimationFrame(draw);
    return wrap;
  }

  /** An empty chart frame with a message (placeholders such as the flow-rate chart). */
  function placeholder(title, message) {
    return el("figure", { class: "rf-chart rf-chart--empty" },
      el("div", { class: "rf-chart-empty-title", text: title }), el("p", { class: "rf-note", text: message }));
  }

  RF.chart = { tracks, placeholder, ticks };
})();

/* --- pages/map/10-core.js --- */
/* Map page internals shared by the map files (loaded in name order): RF.mapkit (M).
   Owner: map agent. Other pages use RF.go("map", {select}) and RF.map.* (see 90-page.js). */
(() => {
  "use strict";
  const RF = window.RF;
  const M = (RF.mapkit = {});
  M.NZ_BOUNDS = [[166.3, -47.4], [178.7, -34.3]];
  M.map = null;           // the maplibregl.Map, once mounted
  M.R = null;             // the region on the map
  M.ready = false;
  M.isPhone = () => window.matchMedia("(max-width: 720px)").matches;

  // ---------- layer slots: groups are drawn in this order (bottom to top) ----------
  // Each group is closed by an invisible anchor layer; addLayer(def, group) inserts before it, or before
  // the layer `before` when that is on the map (to place a layer between two of its group).
  // "catchment" (the shaded catchment of the selection) sits under every line, so rivers stay visible on it.
  M.SLOTS = ["base", "terrain", "overlay", "regions", "catchment", "network", "access", "rivers", "points", "select", "labels"];
  M.initSlots = () => M.SLOTS.forEach((s) => M.map.addLayer({ id: `slot-${s}`, type: "background", layout: { visibility: "none" } }));
  M.addLayer = (def, group, before) => {
    if (M.map.getLayer(def.id)) M.map.removeLayer(def.id);
    M.map.addLayer(def, before && M.map.getLayer(before) ? before : `slot-${group}`);
  };
  M.setSource = (id, spec) => {
    const src = M.map.getSource(id);
    if (src && spec.type === "geojson") { src.setData(spec.data); return src; }
    if (src) { M.layersUsing(id).forEach((l) => M.map.removeLayer(l)); M.map.removeSource(id); }
    M.map.addSource(id, spec);
    return M.map.getSource(id);
  };
  M.layersUsing = (src) => (M.map.getStyle()?.layers || []).filter((l) => l.source === src).map((l) => l.id);
  M.vis = (id, on) => { if (M.map.getLayer(id)) M.map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); };

  // ---------- colours ----------
  M.token = (name) => RF.util.css(name) || "#888";
  M.isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  };
  M.hexRgb = (h) => { const s = h.replace("#", ""); const v = s.length === 3 ? s.split("").map((c) => c + c).join("") : s; return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16)); };
  const themeHandlers = [];
  M.onTheme = (fn) => themeHandlers.push(fn);
  const fireTheme = () => themeHandlers.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", fireTheme);
  new MutationObserver(fireTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- preferences (per browser) ----------
  const PREF_KEY = "map-prefs";
  M.prefs = Object.assign({ basemap: "terrain", layers: {}, colors: {}, catch: {} }, RF.store.get(PREF_KEY, {}) || {});
  if (M.prefs.basemap === "aerial") M.prefs.basemap = "satellite"; // renamed when LINZ aerial gave way to Sentinel-2
  M.savePrefs = RF.util.debounce(() => RF.store.set(PREF_KEY, M.prefs), 300);

  // ---------- label glyphs, served from glyphs/<Font_Name>__<range>.txt (base64) ----------
  M.FONT_WATER = ["Noto Sans Italic"];
  M.FONT_LABEL = ["Noto Sans Regular"];
  let glyphsReady = false;
  M.initGlyphs = () => {
    if (glyphsReady || !window.maplibregl) return;
    glyphsReady = true;
    window.maplibregl.addProtocol("rfglyph", async (params) => {
      const m = /^rfglyph:\/\/(.+)\/(\d+-\d+)$/.exec(params.url);
      if (!m) return { data: new ArrayBuffer(0) };
      const font = decodeURIComponent(m[1]).split(",")[0].trim().replace(/ /g, "_");
      try {
        const res = await fetch(`glyphs/${font}__${m[2]}.txt`);
        if (!res.ok) return { data: new ArrayBuffer(0) };
        return { data: RF.util.b64bytes(await res.text()).buffer };
      } catch (e) { return { data: new ArrayBuffer(0) }; }
    });
  };

  // ---------- region geometry helpers ----------
  /** Image corners for a region grid: TL, TR, BR, BL as [lon, lat]. */
  M.corners = (R) => { const [[la0, lo0], [la1, lo1]] = R.bounds; return [[lo0, la1], [lo1, la1], [lo1, la0], [lo0, la0]]; };
  M.lngLatBounds = (R) => { const [[la0, lo0], [la1, lo1]] = R.bounds; return [[lo0, la0], [lo1, la1]]; };
  M.fitRegion = (R, opts = {}) => M.map.fitBounds(M.lngLatBounds(R), Object.assign({ padding: M.padding(), duration: 600 }, opts));
  /** Padding that keeps fitted features clear of the side panel (desktop) or the card. */
  M.padding = () => {
    if (M.isPhone()) return { top: 60, bottom: 40, left: 24, right: 24 };
    const panel = document.querySelector(".map-panel:not([data-collapsed])");
    return { top: 40, bottom: 40, left: (panel ? panel.offsetWidth + 24 : 0) + 24, right: 72 };
  };
  M.bboxOf = (coords) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    coords.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    return [[x0, y0], [x1, y1]];
  };

  // ---------- hooks: later files register what to do when a region is drawn ----------
  M.regionHooks = [];
  M.onRegion = (fn) => M.regionHooks.push(fn);
})();

/* --- pages/map/20-basemaps.js --- */
/* Base maps: none, terrain (own LINZ-DEM hillshade), NZ Topo50 (LINZ Basemaps; standalone site only,
   needs a Basemaps key), satellite (Sentinel-2 cloudless 2025 by EOX, CC BY-NC-SA 4.0: live tiles on the
   standalone site, a pre-rendered image per region on the artifact host, which blocks tile servers),
   catchment area (linear) and catchment area (log), plus region outlines. Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit;
  const SITE = RF.config.target !== "artifact";
  const KEY = RF.config.basemapsKey || "";
  const linz = (set) => `https://basemaps.linz.govt.nz/v1/tiles/${set}/WebMercatorQuad/{z}/{x}/{y}.webp${KEY ? `?api=${encodeURIComponent(KEY)}` : ""}`;
  const LINZ_ATTR = '<a href="https://basemaps.linz.govt.nz/" target="_blank" rel="noopener">LINZ Basemaps</a> CC BY 4.0';
  // EOxCloudless (Sentinel-2 cloudless) 2025: the newest cloud-free mosaic, CC BY-NC-SA 4.0
  const S2_TILES = "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2025_3857/default/g/{z}/{y}/{x}.jpg";
  M.S2_ATTR = 'Satellite <a href="https://cloudless.eox.at" target="_blank" rel="noopener">EOxCloudless 2025</a> by EOX (modified Copernicus Sentinel data 2025) <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>';

  M.BASEMAPS = [
    { id: "none", label: "None", note: "Plain background" },
    { id: "terrain", label: "Terrain", note: "Shaded relief from the LINZ elevation model" },
    { id: "topo", label: "Topographic", note: "NZ Topo50 maps (LINZ)", site: true },
    { id: "satellite", label: "Satellite", note: "Sentinel-2 cloudless 2025 (EOX), 10 m pixels" },
    { id: "catch", label: "Catchment area", note: "Upstream area at every point, linear colour scale" },
    { id: "catch-log", label: "Catchment area (log)", note: "Upstream area, logarithmic colour scale" },
  ];
  // Topographic needs a LINZ Basemaps key built into the site (web build --basemaps-key); without one
  // LINZ answers 400 for most tiles, so the option is left out.
  M.basemapAvailable = (b) => (!b.site || SITE) && (b.id !== "topo" || !!KEY);
  /** Left out of the picker: topographic on a site built without a key (nothing to enable it). */
  M.basemapHidden = (b) => SITE && b.id === "topo" && !KEY;
  /** Two significant figures, no trailing zeros: 0.05, 0.5, 3.2, 45, 1200. */
  M.nice = (v) => v <= 0 ? "0" : String(+v.toPrecision(2));

  // Sequential blue, small to large catchment. Every land point is coloured, so the ramp spans the full
  // range: ridges pale, channels dark in light mode; in dark mode the largest rivers are brightest.
  const RAMP_LIGHT = ["#f4f8fd", "#dceafb", "#bcd6f6", "#94bdf0", "#6aa1e8", "#3f84dc", "#2a6cc0", "#1d5299", "#123a70", "#0a2550"];
  const RAMP_DARK = ["#101b28", "#152b44", "#1b3d61", "#225181", "#2c67a3", "#3f82c6", "#62a0e2", "#93c0f0", "#c5dcf8", "#eef5fd"];
  M.ramp = () => (M.isDark() ? RAMP_DARK : RAMP_LIGHT).map(M.hexRgb);
  M.rampAt = (t) => {
    const R = M.ramp(), x = Math.min(Math.max(t, 0), 1) * (R.length - 1), i = Math.min(Math.floor(x), R.length - 2), f = x - i;
    return [0, 1, 2].map((k) => Math.round(R[i][k] + (R[i + 1][k] - R[i][k]) * f));
  };

  // Catchment settings (per browser): smallest area shown, opacity, linear range, fade truncated.
  // minKm2 2e-5 = every land cell (the area code starts below one 5 m or 8 m cell)
  M.catchDefaults = { minKm2: 2e-5, opacity: 0.85, linMax: 100, fadeTrunc: true };
  /** Area for people: m² under 0.01 km², else km². */
  M.fmtArea = (km2) => !isFinite(km2) ? "–" : km2 < 0.01 ? `${Math.round(km2 * 1e6).toLocaleString("en-NZ")} m²` : `${RF.util.fmt.km2(km2)} km²`;
  M.catchSettings = () => Object.assign({}, M.catchDefaults, M.prefs.catch || {});

  function initBaseSources() {
    const map = M.map;
    if (SITE) {
      if (KEY) map.addSource("bm-topo", { type: "raster", tiles: [linz("topo-raster")], tileSize: 256, maxzoom: 17, attribution: LINZ_ATTR });
      map.addSource("bm-sat", { type: "raster", tiles: [S2_TILES], tileSize: 256, maxzoom: 14 });
      if (KEY) M.addLayer({ id: "bm-topo", type: "raster", source: "bm-topo", layout: { visibility: "none" }, paint: { "raster-fade-duration": 150 } }, "base");
      M.addLayer({ id: "bm-sat", type: "raster", source: "bm-sat", layout: { visibility: "none" }, paint: { "raster-fade-duration": 150 } }, "base");
    }
    let warned = false;
    map.on("error", (e) => {
      if (e?.sourceId && String(e.sourceId).startsWith("bm-")) {
        if (!warned) { warned = true; RF.util.toast(e.sourceId === "bm-sat" ? "Satellite tiles did not load. Check the connection." : "LINZ Basemaps tiles did not load. Check the connection or the API key."); }
        return;
      }
      console.warn("map:", e?.error?.message || e);
    });
    // region outlines (every region in the index)
    const feats = RF.data.regions().map((r) => {
      const [[la0, lo0], [la1, lo1]] = r.bounds;
      return { type: "Feature", properties: { id: r.id, title: r.title }, geometry: { type: "Polygon", coordinates: [[[lo0, la0], [lo1, la0], [lo1, la1], [lo0, la1], [lo0, la0]]] } };
    });
    map.addSource("regions", { type: "geojson", data: { type: "FeatureCollection", features: feats } });
    M.addLayer({ id: "regions-fill", type: "fill", source: "regions", paint: { "fill-color": "#000", "fill-opacity": 0 } }, "regions");
    M.addLayer({ id: "regions-line", type: "line", source: "regions", paint: { "line-color": M.token("--muted"), "line-width": 1, "line-dasharray": [3, 2], "line-opacity": 0.7 } }, "regions");
    M.addLayer({ id: "regions-label", type: "symbol", source: "regions", maxzoom: 9,
      layout: { "text-field": ["get", "title"], "text-font": M.FONT_LABEL, "text-size": 12, "text-allow-overlap": false },
      paint: { "text-color": M.token("--muted"), "text-halo-color": M.token("--surface"), "text-halo-width": 1.5 } }, "labels");
    M.onTheme(() => {
      if (!M.map.getLayer("regions-line")) return;
      M.map.setPaintProperty("regions-line", "line-color", M.token("--muted"));
      M.map.setPaintProperty("regions-label", "text-color", M.token("--muted"));
      M.map.setPaintProperty("regions-label", "text-halo-color", M.token("--surface"));
      M.map.setPaintProperty("bg", "background-color", M.token("--surface-2"));
      paintHillshade(); redrawCatch();
    });
  }
  M.onRegion((R) => {
    if (M.map.getLayer("regions-line")) M.map.setFilter("regions-line", ["!=", ["get", "id"], R.id]);
  });

  // ---------- per-region terrain and catchment ----------
  let C = null; // {R, area, trunc, disp, dispTrunc, canvas, ctx, maxLog}

  // Hillshade drawn on a canvas so the nodata margin is transparent and the tint follows the theme
  // (and lightens under the catchment colours).
  const HS = { light: ["#8c928d", "#f7f8f5"], dark: ["#0d110f", "#545d58"], lightCatch: ["#c3c8c3", "#fafbf9"], darkCatch: ["#0a0d0b", "#323a35"] };
  function paintHillshade() {
    if (!C || !C.hs) return;
    const dark = M.isDark(), catchOn = M.prefs.basemap.startsWith("catch");
    const [lo, hi] = HS[(dark ? "dark" : "light") + (catchOn ? "Catch" : "")].map(M.hexRgb);
    const L = new Uint32Array(256);
    for (let v = 1; v < 256; v++) {
      const t = v / 255, c = [0, 1, 2].map((k) => Math.round(lo[k] + (hi[k] - lo[k]) * t));
      L[v] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
    }
    const img = C.hsCtx.createImageData(C.R.width, C.R.height), px = new Uint32Array(img.data.buffer), h = C.hs;
    for (let i = 0; i < px.length; i++) px[i] = L[h[i]];
    C.hsCtx.putImageData(img, 0, 0);
    const src = M.map.getSource("terrain");
    if (src && src.play) { src.play(); src.pause(); }
    M.map.triggerRepaint();
  }

  async function loadRegionImages(R) {
    const coords = M.corners(R);
    C = null;
    const [hs, area, trunc] = await Promise.all([RF.util.decodeGray(R.hillshade, R.width, R.height),
      RF.util.decodeGray(R.area, R.width, R.height), RF.util.decodeGray(R.trunc, R.width, R.height)]);
    if (M.R !== R) return;
    const W = R.width, H = R.height;
    let maxCode = 0; for (let i = 0; i < area.length; i++) if (area[i] > maxCode) maxCode = area[i];
    // Display copy with channels widened by size (1 px; 3 px above 10 km²; 5 px above 100 km²), so
    // rivers stay visible zoomed out. Point readouts use the unwidened grid.
    const disp = area.slice(), dispTrunc = trunc.slice();
    const code = (km2) => Math.round((Math.log10(km2) - R.code.log_min) / R.code.step) + 2;
    const c10 = code(10), c100 = code(100);
    for (let i = 0; i < area.length; i++) {
      const c = area[i]; if (c < c10) continue;
      const rad = c >= c100 ? 2 : 1, r0 = (i / W) | 0, q0 = i - r0 * W;
      for (let dr = -rad; dr <= rad; dr++) for (let dq = -rad; dq <= rad; dq++) {
        const r = r0 + dr, q = q0 + dq; if (r < 0 || q < 0 || r >= H || q >= W) continue;
        const j = r * W + q; if (area[j] !== 0 && c > disp[j]) { disp[j] = c; dispTrunc[j] = trunc[i]; }
      }
    }
    const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
    const hsCanvas = document.createElement("canvas"); hsCanvas.width = W; hsCanvas.height = H;
    C = { R, hs, area, trunc, disp, dispTrunc, canvas, ctx: canvas.getContext("2d"), hsCanvas, hsCtx: hsCanvas.getContext("2d"),
          maxLog: R.code.log_min + (maxCode - 2) * R.code.step };
    M.setSource("terrain", { type: "canvas", canvas: hsCanvas, coordinates: coords, animate: false });
    M.addLayer({ id: "terrain", type: "raster", source: "terrain", layout: { visibility: "none" }, paint: { "raster-fade-duration": 0 } }, "terrain");
    paintHillshade();
    drawCatch();
    M.setSource("catch", { type: "canvas", canvas, coordinates: coords, animate: false });
    M.addLayer({ id: "catch", type: "raster", source: "catch", layout: { visibility: "none" }, paint: { "raster-fade-duration": 0, "raster-opacity": M.catchSettings().opacity } }, "overlay");
    applyBasemap();
    M.drawCatchLegend?.();
    areaHooks.forEach((fn) => { try { fn(R); } catch (e) { console.error(e); } });
  }
  const areaHooks = [];
  /** Run fn(R) once a region's area grid is decoded (M.areaGrid() is then that region's). */
  M.onAreaGrid = (fn) => areaHooks.push(fn);
  M.onRegion((R) => loadRegionImages(R).catch((e) => { console.error(e); RF.util.toast("Could not draw the terrain for this region."); }));
  // Artifact host: no tile servers, so the satellite base map is the region's pre-rendered image (webdata.write_satellite).
  M.onRegion((R) => {
    if (SITE) return;
    M.setSource("sat-img", { type: "image", url: `${R.id}_sat.jpg`, coordinates: M.corners(R) });
    M.addLayer({ id: "sat-img", type: "raster", source: "sat-img", layout: { visibility: M.prefs.basemap === "satellite" ? "visible" : "none" }, paint: { "raster-fade-duration": 0 } }, "base");
  });

  /** Colour lookup per area code (256 entries, RGBA packed little-endian). */
  function lut(R, s, mode, dark) {
    const out = new Uint32Array(256), minLog = Math.max(Math.log10(Math.max(s.minKm2, 1e-9)), R.code.log_min), maxLog = Math.max(C.maxLog, minLog + 0.5);
    const a = Math.round(255);
    for (let c = 2; c < 256; c++) {
      const lg = R.code.log_min + (c - 2) * R.code.step;
      if (lg < minLog) continue;
      const t = mode === "catch-log" ? (lg - minLog) / (maxLog - minLog) : Math.min(10 ** lg / s.linMax, 1);
      const [r, g, b] = M.rampAt(t);
      out[c] = (a << 24) | (b << 16) | (g << 8) | r;
    }
    return out;
  }

  function drawCatch() {
    if (!C) return;
    const s = M.catchSettings(), mode = M.prefs.basemap === "catch" ? "catch" : "catch-log";
    const L = lut(C.R, s, mode, M.isDark()), W = C.R.width, H = C.R.height;
    const img = C.ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer), d = C.disp, tr = C.dispTrunc;
    const fade = s.fadeTrunc;
    for (let i = 0; i < px.length; i++) {
      const v = L[d[i]];
      if (!v) continue;
      px[i] = fade && tr[i] ? (v & 0x00ffffff) | (90 << 24) : v;
    }
    C.ctx.putImageData(img, 0, 0);
  }
  function redrawCatch() {
    if (!C) return;
    drawCatch();
    const src = M.map.getSource("catch");
    if (src && src.play) { src.play(); src.pause(); }
    M.map.triggerRepaint();
    M.drawCatchLegend?.();
  }
  M.redrawCatch = RF.util.debounce(redrawCatch, 60);
  M.setCatch = (patch) => {
    M.prefs.catch = Object.assign({}, M.prefs.catch, patch); M.savePrefs();
    if ("opacity" in patch && M.map.getLayer("catch")) M.map.setPaintProperty("catch", "raster-opacity", patch.opacity);
    if (Object.keys(patch).some((k) => k !== "opacity")) M.redrawCatch();
  };

  /** The region's decoded grids once drawn: {R, area (8-bit log code), trunc (0/255)} on the heat-map grid, or null. */
  M.areaGrid = () => (C ? { R: C.R, area: C.area, trunc: C.trunc } : null);
  /** Index of the heat-map grid pixel (row * width + column) under a map point, or -1 outside the region. */
  M.pixelOf = (R, lngLat) => {
    const p = window.maplibregl.MercatorCoordinate.fromLngLat(lngLat);
    const E = 20037508.342789244, x = p.x * 2 * E - E, y = E - p.y * 2 * E;
    const pw = (R.merc[2] - R.merc[0]) / R.width, ph = (R.merc[3] - R.merc[1]) / R.height;
    const q = Math.floor((x - R.merc[0]) / pw), r = Math.floor((R.merc[3] - y) / ph);
    return q < 0 || r < 0 || q >= R.width || r >= R.height ? -1 : r * R.width + q;
  };

  /** Catchment area at a map point: {km2, trunc, channel: {km2, lon, lat} | null}, or null off land.
   *  Every land point has an area (down to one cell); a much larger channel within ~3 px is also given,
   *  because a finger rarely lands exactly on a 1 px stream. */
  M.areaAt = (lngLat) => {
    if (!C) return null;
    const R = C.R, E = 20037508.342789244, i0 = M.pixelOf(R, lngLat);
    if (i0 < 0) return null;
    const pw = (R.merc[2] - R.merc[0]) / R.width, ph = (R.merc[3] - R.merc[1]) / R.height;
    const q = i0 % R.width, r = (i0 - q) / R.width, c0 = C.area[i0];
    if (c0 < 1) return null;
    const km2 = (c) => 10 ** (R.code.log_min + (c - 2) * R.code.step);
    const here = c0 >= 2 ? km2(c0) : 0;
    let best = c0, bi = i0;
    for (let dr = -3; dr <= 3; dr++) for (let dq = -3; dq <= 3; dq++) {
      const rr = r + dr, qq = q + dq; if (rr < 0 || qq < 0 || rr >= R.height || qq >= R.width) continue;
      const i = rr * R.width + qq; if (C.area[i] > best) { best = C.area[i]; bi = i; }
    }
    let channel = null;
    if (bi !== i0 && best >= 2 && km2(best) >= 0.5 && km2(best) >= 20 * Math.max(here, 1e-6)) {
      const bq = bi % R.width, br = (bi - bq) / R.width;
      const mx = R.merc[0] + (bq + 0.5) * pw, my = R.merc[3] - (br + 0.5) * ph;
      const ll = new window.maplibregl.MercatorCoordinate((mx + E) / (2 * E), (E - my) / (2 * E)).toLngLat();
      channel = { km2: km2(best), lon: ll.lng, lat: ll.lat, trunc: C.trunc[bi] > 0 };
    }
    return { km2: here, trunc: C.trunc[i0] > 0, channel, pixelM: Math.round(pw * Math.cos(lngLat.lat * Math.PI / 180)) };
  };

  const basemapHooks = [];
  /** Run fn(id) whenever the base map in use changes (e.g. to adapt an overlay's paint). */
  M.onBasemap = (fn) => basemapHooks.push(fn);
  /** Show the chosen base map. */
  function applyBasemap() {
    const id = M.prefs.basemap, map = M.map; if (!map) return;
    const b = M.BASEMAPS.find((x) => x.id === id);
    const use = b && M.basemapAvailable(b) ? id : "terrain";
    M.vis("bm-topo", use === "topo");
    M.vis("bm-sat", use === "satellite");
    M.vis("sat-img", use === "satellite");
    M.vis("terrain", use === "terrain" || use.startsWith("catch"));
    M.vis("catch", use.startsWith("catch"));
    paintHillshade();
    document.querySelector(".map-root")?.setAttribute("data-basemap", use);
    basemapHooks.forEach((fn) => { try { fn(use); } catch (e) { console.error(e); } });
  }
  M.setBasemap = (id) => {
    const prevCatch = M.prefs.basemap.startsWith("catch");
    M.prefs.basemap = id; M.savePrefs();
    applyBasemap();
    if (id.startsWith("catch") && (prevCatch || true)) redrawCatch();
    M.renderLegend?.();
    M.renderBasemapControls?.();
  };
  M.initBasemaps = () => { initBaseSources(); applyBasemap(); };

  /** Legend content for the active base map (gradient bar for the catchment maps). */
  M.basemapLegend = () => {
    const id = M.prefs.basemap, { el } = RF.util;
    if (!id.startsWith("catch") || !C) return null;
    const s = M.catchSettings(), log = id === "catch-log", minLog = Math.max(Math.log10(s.minKm2), C.R.code.log_min), maxLog = Math.max(C.maxLog, minLog + 0.5);
    const cv = el("canvas", { width: 240, height: 10, class: "map-ramp", "aria-hidden": "true" });
    const ctx = cv.getContext("2d");
    for (let x = 0; x < 240; x++) {
      const t = x / 239, [r, g, b] = M.rampAt(t);
      ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(x, 0, 1, 10);
    }
    const ticks = el("div", { class: "map-ticks" });
    if (log) {
      const decades = []; for (let e = Math.ceil(minLog); e <= Math.floor(maxLog); e++) decades.push(e);
      const stride = Math.ceil(decades.length / 5);
      decades.filter((e, k) => k % stride === 0).forEach((e) => {
        const pos = (e - minLog) / (maxLog - minLog) * 100;
        const v = 10 ** e;
        ticks.append(el("span", { style: `left:${pos}%`, text: v < 0.01 ? `${Math.round(v * 1e6)} m²` : String(+v.toPrecision(1)) }));
      });
    } else {
      [0, 0.25, 0.5, 0.75, 1].forEach((t) => ticks.append(el("span", { style: `left:${t * 100}%`, text: t === 1 ? `${M.nice(s.linMax)}+` : M.nice(s.linMax * t) })));
    }
    return el("div", { class: "map-legend-block" }, el("div", { class: "map-legend-title", text: `Catchment area${log ? ", log scale (km² unless marked m²)" : ", km²"}` }), cv, ticks,
      el("p", { class: "rf-note", text: `${s.minKm2 > 3e-5 ? `Areas under ${M.fmtArea(s.minKm2)} are not coloured. ` : "Every land point is coloured. "}Tap the map for the area at any point.${s.fadeTrunc ? " Faded: catchments cut off by the region edge." : ""}` }));
  };
})();

/* --- pages/map/30-panel.js --- */
/* Map panel: region picker, base maps, the layer tree (indented, GIS style, per-layer colours) and
   the legend. A side panel on desktop, a bottom sheet on phones. Owner: map agent.

   Layer files register nodes with M.defineGroup / M.defineLayer:
     M.defineLayer({id, label, parent, colors: [{key, token | hex, label}], defaultOn, swatch: "line" | "dot" | "area",
                    apply(on, colorOf), count(), note (text, or a function → text), link, legend,
                    legendKey() → Node (legend key of a layer without colours), rowKey() → Node (key in its tree row),
                    legendBlock() → Node | null (a whole legend block instead of a row; mini: true also puts it in the
                    mini legend), controls() → Node (shown under the row while the node is on)})
   M.layerNotes: short notes under the tree (e.g. a layer this host cannot show).
   A layer shows when it and every group above it are on (as in QGIS). */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el, icon, fmt } = RF.util;
  M.nodes = new Map();
  M.order = [];
  M.layerNotes = [];
  const noteOf = (n) => (typeof n.note === "function" ? n.note() : n.note);

  M.defineGroup = (g) => { const n = Object.assign({ type: "group", defaultOn: true, colors: [] }, g); M.nodes.set(n.id, n); M.order.push(n.id); return n; };
  M.defineLayer = (l) => { const n = Object.assign({ type: "layer", defaultOn: false, colors: [], swatch: "line" }, l); M.nodes.set(n.id, n); M.order.push(n.id); return n; };
  M.isOn = (id) => { const n = M.nodes.get(id); if (!n) return false; const p = M.prefs.layers[id]; return p === undefined ? n.defaultOn : p; };
  M.isVisible = (id) => { let n = M.nodes.get(id); while (n) { if (!M.isOn(n.id)) return false; n = n.parent ? M.nodes.get(n.parent) : null; } return true; };
  /** Resolved colour of a layer's colour slot (user choice, else the token for the current theme). */
  M.colorOf = (id, key = "c") => {
    const n = M.nodes.get(id), user = M.prefs.colors[`${id}.${key}`];
    if (user) return user;
    const c = n?.colors.find((x) => x.key === key) || n?.colors[0];
    if (!c) return "#888888";
    return c.token ? M.token(c.token) : c.hex;
  };
  const children = (id) => M.order.map((k) => M.nodes.get(k)).filter((n) => (n.parent || null) === id);
  const descendants = (id) => children(id).flatMap((c) => [c, ...descendants(c.id)]);

  /** Re-apply every layer's visibility and colours (after toggles, colour edits, theme changes). */
  M.applyLayers = () => {
    if (!M.ready) return;
    M.order.forEach((id) => {
      const n = M.nodes.get(id);
      if (n.type !== "layer" || !n.apply) return;
      try { n.apply(M.isVisible(id), (key) => M.colorOf(id, key)); } catch (e) { console.error(`layer ${id}`, e); }
    });
    M.renderLegend();
  };
  M.onTheme(() => { M.applyLayers(); M.renderTree(); });

  // ---------- DOM ----------
  let panel, body, treeEl, baseEl, legendEl, regionSel, tabs = {};

  function regionPicker() {
    const groups = {};

    M.addLayer({ id: "names-label", type: "symbol", source: "src-names", minzoom: 11,
      layout: { "symbol-placement": "line", "text-field": ["get", "n"], "text-font": M.FONT_WATER, "text-size": ["interpolate", ["linear"], ["zoom"], 11, 11, 15, 14],
        "symbol-spacing": 350, "text-max-angle": 50, "text-padding": 4, "text-letter-spacing": 0.03, "text-offset": [0, -0.8] },
      paint: { "text-color": "#1f5fa8", "text-halo-color": "#fff", "text-halo-width": 1.6 } }, "labels");
    M.onTheme(() => {
      ["pred-casing", "known-casing"].forEach((l) => map.getLayer(l) && map.setPaintProperty(l, "line-color", casing()));
      if (map.getLayer("names-label")) {
        map.setPaintProperty("names-label", "text-color", M.isDark() ? "#9cc4f2" : "#1f5fa8");
        map.setPaintProperty("names-label", "text-halo-color", M.isDark() ? "#111513" : "#ffffff");
      }
    });
    if (M.isDark()) { map.setPaintProperty("names-label", "text-color", "#9cc4f2"); map.setPaintProperty("names-label", "text-halo-color", "#111513"); }

    M.clickable({ layers: ["known-line", "known-casing"], priority: 90, feature: (f) => sectionFeature(f.properties.i) });
    M.clickable({ layers: ["pred-line", "pred-casing"], priority: 80, feature: (f) => runs[f.properties.i] || null });
    M.clickable({ layers: ["net-line"], priority: 40, feature: (f) => reachFeature(f.properties.i) });
    M.clickable({ layers: ["linz-line"], priority: 45, feature: (f, e) => linzFeature(f, e) });
  });

  // ---------- data per region ----------
  const multi = (S, members) => ({ type: "MultiLineString", coordinates: RF.runs.chains(S, members) });

  function buildKnown(R) {
    const S = R.segments; if (!S) return EMPTY;
    return { type: "FeatureCollection", features: (R.sections || []).map((sec, i) => ({
      type: "Feature", properties: { i, g: M.gradeBin(sec), src: sec.src }, geometry: multi(S, sec.m) })) };
  }

  function buildNet(R) {
    const S = R.segments; if (!S) return EMPTY;
    // width 0..1 from catchment area on a log scale, 1 km² to about 3000 km²
    return { type: "FeatureCollection", features: S.c.map((c, i) => ({
      type: "Feature", properties: { i, w: Math.min(1, Math.max(0, Math.log10(Math.max(S.a[i], 1)) / 3.5)) },
      geometry: { type: "LineString", coordinates: c } })) };
  }

  // Moving average (half-window k): the D8 staircase bends too sharply for labels to follow it.
  function smooth(c, k) {
    if (c.length < 2 * k + 2) return c;
    const out = [c[0]];
    for (let i = 1; i < c.length - 1; i++) {
      const a = Math.max(0, i - k), b = Math.min(c.length - 1, i + k);
      let x = 0, y = 0; for (let j = a; j <= b; j++) { x += c[j][0]; y += c[j][1]; }
      if (i % 2 === 0) out.push([x / (b - a + 1), y / (b - a + 1)]);
    }
    out.push(c[c.length - 1]);
    return out;
  }

  // Named rivers as long lines: chain reaches downstream while the name stays the same, so labels fit.
  function buildNames(R) {
    const S = R.segments; if (!S) return EMPTY;
    const n = S.c.length, name = (i) => (S.r[i] >= 0 ? S.rivers[S.r[i]] : ""), feats = [];
    for (let i = 0; i < n; i++) {
      const nm = name(i); if (!nm) continue;
      const up = S.u[i];
      if (up >= 0 && name(up) === nm && S.d[up] === i) continue; // not the top of a chain
      const coords = []; let cur = i, guard = 0;
      while (cur >= 0 && name(cur) === nm && guard++ < 5000) {
        S.c[cur].forEach((p, k) => { if (k === 0 && coords.length) return; coords.push(p); });
        const d = S.d[cur];
        if (d < 0 || S.u[d] !== cur) break;
        cur = d;
      }
      if (coords.length > 1) feats.push({ type: "Feature", properties: { n: nm }, geometry: { type: "LineString", coordinates: smooth(coords, 6) } });
    }
    return { type: "FeatureCollection", features: feats };
  }

  async function buildPred(R) {
    const my = ++runToken, S = R.segments; if (!S) return;
    const model = RF.state.model ? await RF.data.scores(R.id, RF.state.model) : null;
    if (my !== runToken || M.R !== R) return;
    runs = RF.runs.find(R, { model });
    scored = { R, model };
    const sc = runs.map((r) => r.score), lo = Math.min(...sc), hi = Math.max(...sc);
    M.predRange = runs.length ? [lo, hi] : null;
    M.map.getSource("src-pred")?.setData({ type: "FeatureCollection", features: runs.map((r, i) => ({
      type: "Feature", properties: { i, t: hi > lo ? (r.score - lo) / (hi - lo) : 1, listed: r.status === "listed" ? 1 : 0 },
      geometry: { type: "LineString", coordinates: RF.runs.path(S, r.members) } })) });
    applyPred(); M.renderTree(); M.refreshCard("section");
  }
  M.runs = () => runs;

  // LINZ river lines (river_finder.linz): <id>_linz.json = {names, types, q, lines: [[type, name | -1, section id, flat]]}.
  // flat: integer lon/lat steps of q degrees, each point relative to the one before (the first to 0, 0);
  // files without q hold plain lon/lat. Unnamed headwater lines under 2 km² are left out of the file.
  M.linz = null;
  async function loadLinz(R) {
    let L = null;
    try { const r = await fetch(`${R.id}_linz.json`); if (r.ok) L = await r.json(); } catch (e) { L = null; }
    if (M.R !== R) return;
    M.linz = L;
    const q = L?.q || 0;
    const feats = (L?.lines || []).map(([t, n, sid, flat], i) => {
      const c = [];
      if (q) for (let j = 0, x = 0, y = 0; j < flat.length; j += 2) { x += flat[j]; y += flat[j + 1]; c.push([x * q, y * q]); }
      else for (let j = 0; j < flat.length; j += 2) c.push([flat[j], flat[j + 1]]);
      return { type: "Feature", properties: { i, t, n: n >= 0 ? L.names[n] : "", named: n >= 0, sid }, geometry: { type: "LineString", coordinates: c } };
    });
    M.linzFeats = feats;
    M.map.getSource("src-linz").setData({ type: "FeatureCollection", features: feats });
    // labels: LINZ names (their lines are smooth Topo50 centrelines); REC2 chains when there is no LINZ file
    M.map.getSource("src-names").setData(L ? { type: "FeatureCollection", features: feats.filter((f) => f.properties.named).map((f) => ({ type: "Feature", properties: { n: f.properties.n }, geometry: f.geometry })) } : buildNames(R));
    applyLinz(); applyNet(M.isVisible("net"), (k) => M.colorOf("net", k)); M.renderTree();
    M.flow?.orientLinz(); // 55-flow.js: turn the lines to run downstream
  }

  M.onRegion((R) => {
    M.linzFeats = null;
    if (!M.map.getSource("src-known")) return;
    M.map.getSource("src-known").setData(buildKnown(R));
    M.netData = buildNet(R); // 57-rain.js adds the rain of each reach to these features
    M.map.getSource("src-net").setData(M.netData);
    M.linz = null; M.map.getSource("src-linz").setData(EMPTY); M.map.getSource("src-names").setData(EMPTY);
    loadLinz(R);
    runs = []; scored = null; M.map.getSource("src-pred").setData(EMPTY);
    buildPred(R);
  });
  RF.on("model", () => { if (M.R && M.ready) buildPred(M.R); });
  RF.on("runs", () => { if (M.R && M.ready) buildPred(M.R); });

  // ---------- styling (visibility, colours, filters) ----------
  function applyKnown() {
    if (!M.ready || !M.map.getLayer("known-line")) return;
    const bins = [0, ...GRADES].filter((g) => M.isVisible(`known-g${g}`));
    const srcs = SOURCES.map(([k]) => k).filter((k) => M.isVisible(`known-src-${k}`));
    const filter = ["all", ["in", ["get", "g"], ["literal", bins]], ["in", ["get", "src"], ["literal", srcs]]];
    const color = ["match", ["get", "g"], ...GRADES.flatMap((g) => [g, M.gradeColor(g)]), M.gradeColor(0)];
    const on = M.isVisible("known") && bins.length > 0 && srcs.length > 0;
    ["known-line", "known-casing"].forEach((l) => { M.map.setFilter(l, filter); M.vis(l, on); });
    M.map.setPaintProperty("known-line", "line-color", color);
    M.flow?.sync();
  }
  function applyPred() {
    if (!M.ready || !M.map.getLayer("pred-line")) return;
    const on = M.isVisible("pred"), listed = M.isVisible("pred-listed");
    const f = listed ? ["all"] : ["==", ["get", "listed"], 0];
    ["pred-line", "pred-casing"].forEach((l) => { M.map.setFilter(l, f); M.vis(l, on); });
    M.map.setPaintProperty("pred-line", "line-color", ["interpolate", ["linear"], ["get", "t"], 0, M.colorOf("pred", "lo"), 0.5, M.colorOf("pred", "mid"), 1, M.colorOf("pred", "hi")]);
    M.flow?.sync();
  }
  function applyNet(on, colorOf) {
    if (!M.ready || !M.map.getLayer("net-line")) return;
    // stand in for the LINZ lines where a region has none (no LDS key at build time)
    M.vis("net-line", on || (M.isVisible("linz") && !M.linz));
    M.map.setPaintProperty("net-line", "line-color", on ? colorOf("c") : M.colorOf("linz"));
    M.flow?.sync();
  }
  function applyLinz() {
    if (!M.ready || !M.map.getLayer("linz-line")) return;
    M.vis("linz-line", M.isVisible("linz"));
    M.map.setPaintProperty("linz-line", "line-color", M.colorOf("linz"));
    M.flow?.sync();
  }
  function applyNames(on) { if (M.ready) M.vis("names-label", on); }

  // ---------- feature references, cards ----------
  function sectionFeature(i) {
    const sec = M.R?.sections?.[i]; if (!sec) return null;
    return { kind: "section", region: M.R.id, id: sec.id, name: sec.river, section: sec.section, grade: sec.grade, src: sec.src, members: sec.m, sec };
  }
  /** The modelled reach nearest a point (within maxM metres), or -1. */
  function nearestReach(S, lon, lat, maxM = 300) {
    const k = Math.cos(lat * Math.PI / 180), lim = (maxM / 111200) ** 2;
    let best = lim, bi = -1;
    for (let i = 0; i < S.c.length; i++) {
      const c = S.c[i];
      for (let j = 0; j < c.length; j++) {
        const dx = (c[j][0] - lon) * k, dy = c[j][1] - lat, d = dx * dx + dy * dy;
        if (d < best) { best = d; bi = i; }
      }
    }
    return bi;
  }
  M.nearestReach = nearestReach;
  const LINZ_TYPE = { river_cl: "river", canal_cl: "canal" };
  function linzFeature(f, e) {
    const p = f.properties, S = M.R?.segments, type = LINZ_TYPE[M.linz?.types?.[p.t]] || "river";
    // the whole LINZ line (rendered features are clipped to map tiles)
    f = { properties: p, geometry: M.linzFeats?.[p.i]?.geometry || f.geometry };
    const linz = { name: p.n || "", sid: p.sid, type };
    const seg = S ? nearestReach(S, e.lngLat.lng, e.lngLat.lat) : -1;
    const name = p.n || (seg >= 0 && S.r[seg] >= 0 ? S.rivers[S.r[seg]] : `Unnamed ${type}`);
    if (seg >= 0) return { kind: "reach", region: M.R.id, id: `${M.R.id}:reach:${seg}`, seg, name, linz, geometry: f.geometry };
    const a = M.areaAt(e.lngLat);
    return { kind: "linz-river", region: M.R.id, id: `linz:${p.sid}`, name, linz, lat: e.lngLat.lat, lon: e.lngLat.lng, geometry: f.geometry,
      km2: a ? Math.max(a.km2, a.channel?.km2 || 0) : null };
  }

  function reachFeature(i) {
    const S = M.R?.segments; if (!S) return null;
    return { kind: "reach", region: M.R.id, id: `${M.R.id}:reach:${i}`, seg: i, name: S.r[i] >= 0 ? S.rivers[S.r[i]] : "Unnamed stream" };
  }
  M.sectionFeature = sectionFeature; M.reachFeature = reachFeature;

  const SRC_LABEL = Object.fromEntries(SOURCES.map(([k, l]) => [k, l]));
  // The numbers a predicted run shows, from the section's reaches and the model the runs were found with
  // (no score until those scores have loaded). A section placed by river name can be separate pieces.
  M.card.section = (f) => {
    const s = f.sec, ready = scored?.R === M.R, st = RF.runs.measure(M.R, s.m, { model: ready ? scored.model : null });
    return {
      eyebrow: `Known river · ${SRC_LABEL[s.src] || s.srcName}`, title: s.section ? `${s.river}: ${s.section}` : s.river,
      lines: [el("span", { class: "rf-row" },
        el("span", { class: "rf-pill", style: `background:${M.gradeColor(M.gradeBin(s))};color:#fff;border-color:transparent`, text: s.grade ? `Grade ${s.grade}` : "Grade not recorded" })),
      st ? M.runLine(ready ? st : Object.assign(st, { score: null }), { mapped: true }) : el("span", { class: "rf-note", text: "No modelled reaches here." }),
      st?.pieces > 1 ? el("span", { class: "rf-note", text: `Mapped as ${st.pieces} separate pieces: length is their total, flow and area are for the largest.` }) : null],
    };
  };
  M.card.reach = (f) => {
    const S = M.R.segments, i = f.seg;
    return { eyebrow: f.linz ? `LINZ ${f.linz.type} · numbers from the nearest modelled reach` : "Modelled channel · one reach", title: f.name,
      lines: [el("span", { class: "num", text: `${fmt.grad(S.g[i])} m/km · flood ${fmt.flow(S.maf[i])} m³/s · ${fmt.km2(S.a[i])} km² · ${Math.round(S.zt[i])} m` })] };
  };
})();


/* --- pages/map/55-flow.js --- */
/* Flow direction: small arrows pointing downstream along the river lines from zoom 13, on known sections,
   predicted runs, LINZ rivers and modelled channels. Each arrow layer follows its line's visibility, filter
   and colour, and sits just above it, so a line drawn over another also covers its arrows. Arrows give way
   to labels and are not tap targets (taps reach the line under them).
   Direction: modelled reaches run upstream to downstream (S.c), and so do the lines of known sections and
   predicted runs built from them (RF.runs.chains / path). LINZ lines are digitised either way, so each is
   oriented once per region (lineDirections) and gets no arrows when its direction is unclear.
   Used by 50-rivers.js: M.flow.{sync, orientLinz}. Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el } = RF.util;
  const MINZOOM = 13, IMAGE = "rf-flow";
  // [arrow layer, the line it follows, its slot, the layer it is drawn under (null: top of the slot)]
  const LAYERS = [["linz-flow", "linz-line", "network", "net-line"], ["net-flow", "net-line", "network", null],
    ["pred-flow", "pred-line", "rivers", "known-casing"], ["known-flow", "known-line", "rivers", null]];
  // the arrowhead (a notched dart pointing +x, along the line), logical px from the icon centre
  const DART = [[4.5, 0], [-3, 4], [-1.2, 0], [-3, -4]];
  const KEY = '<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M1 6h20" stroke="var(--river-linz)" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="M15 6 7.5 2 9.3 6 7.5 10Z" fill="currentColor"/></svg>';

  M.defineLayer({ id: "flow", parent: "rivers", label: "Flow direction", note: "Arrows downstream, from zoom 13", defaultOn: true, swatch: "none",
    legend: "Flow direction, downstream (from zoom 13)", legendKey: () => el("span", { class: "map-key map-key--flow", html: KEY }), apply: sync });

  /** The arrowhead as a signed distance field (MapLibre SDF: edge at 0.75, 1/8 per px), so its colour and halo can be set. */
  function arrowhead() {
    const PR = 2, N = 16, S = N * PR, data = new Uint8Array(S * S * 4), P = DART;
    const seg = (x, y, [ax, ay], [bx, by]) => {
      const vx = bx - ax, vy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)));
      return Math.hypot(x - ax - t * vx, y - ay - t * vy);
    };
    for (let r = 0; r < S; r++) for (let q = 0; q < S; q++) {
      const x = (q + 0.5) / PR - N / 2, y = (r + 0.5) / PR - N / 2;
      let d = Infinity, inside = false;
      P.forEach((a, k) => {
        const b = P[(k + 1) % P.length];
        d = Math.min(d, seg(x, y, a, b));
        if ((a[1] > y) !== (b[1] > y) && x < a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1])) inside = !inside;
      });
      data[4 * (r * S + q) + 3] = Math.max(0, Math.min(255, Math.round(255 * (0.75 - (inside ? -d : d) / 8))));
    }
    return [{ width: S, height: S, data }, { sdf: true, pixelRatio: PR }];
  }

  // "zoom" must be the input of a top-level interpolate, so the data terms go into each stop.
  const zoomed = (lo, hi) => ["interpolate", ["linear"], ["zoom"], MINZOOM, lo, 16, hi];
  const SIZE = {
    "known-flow": zoomed(0.9, 1.3),
    "pred-flow": zoomed(["+", 0.75, ["*", 0.2, ["get", "t"]]], ["+", 1, ["*", 0.3, ["get", "t"]]]),
    "linz-flow": zoomed(["case", ["get", "named"], 0.9, 0.8], ["case", ["get", "named"], 1.2, 1.05]),
    "net-flow": zoomed(["+", 0.8, ["*", 0.15, ["get", "w"]]], ["+", 1.05, ["*", 0.2, ["get", "w"]]]),
  };

  M.layerInits.push(() => {
    const map = M.map;
    if (!map.hasImage(IMAGE)) map.addImage(IMAGE, ...arrowhead());
    LAYERS.forEach(([id, line, slot, before]) => {
      const src = map.getLayer(line)?.source; if (!src) return;
      M.addLayer({ id, type: "symbol", source: src, minzoom: MINZOOM, filter: id === "linz-flow" ? ["==", ["get", "dir"], 1] : ["all"],
        layout: { visibility: "none", "symbol-placement": "line", "symbol-spacing": zoomed(130, 190), "icon-image": IMAGE, "icon-size": SIZE[id],
          "icon-rotation-alignment": "map", "icon-keep-upright": false, "icon-padding": 1 },
        paint: { "icon-color": "#ffffff", "icon-halo-width": 1, "icon-opacity": zoomed(0.85, 1) } }, slot, before);
    });
  });

  /** Arrows on wherever their line is shown, in its filter and colour (lines: 50-rivers.js). */
  function sync() {
    const map = M.map;
    if (!M.ready || !map.getLayer("known-flow")) return;
    const on = M.isVisible("flow"), casing = M.casing();
    LAYERS.forEach(([id, line]) => {
      if (!map.getLayer(id)) return;
      const show = on && map.getLayoutProperty(line, "visibility") !== "none";
      M.vis(id, show);
      if (!show) return;
      if (id === "known-flow" || id === "pred-flow") {
        // inside the line, in the casing colour
        map.setFilter(id, map.getFilter(line) || ["all"]);
        map.setPaintProperty(id, "icon-color", casing);
      } else {
        // over a thin line: its colour, with a thin casing-coloured halo so it reads on any base map
        map.setPaintProperty(id, "icon-color", map.getPaintProperty(line, "line-color"));
        map.setPaintProperty(id, "icon-halo-color", casing);
      }
    });
  }

  // ---------- LINZ lines: oriented downstream once per region ----------
  let oriented = null; // the LINZ data (M.linz) already oriented
  M.onAreaGrid(() => orientLinz());
  /** Turn each LINZ line to run downstream (in place) and mark it dir 1, or dir 0 when unclear. Runs once both
   *  the lines and the area grid of the region are loaded (called by 50-rivers.js and on the area grid). */
  function orientLinz() {
    const R = M.R, L = M.linz, F = M.linzFeats, G = M.areaGrid(), src = M.map?.getSource("src-linz");
    if (!R || !L || !F || !G || G.R !== R || !src || oriented === L) return;
    oriented = L;
    const dirs = lineDirections(R, G.area, F.map((f) => f.geometry.coordinates), F.map((f) => L.types?.[f.properties.t] === "canal_cl"));
    let reversed = 0, unknown = 0;
    F.forEach((f, i) => {
      if (dirs[i] < 0) { f.geometry.coordinates.reverse(); reversed++; }
      if (!dirs[i]) unknown++;
      f.properties.dir = dirs[i] ? 1 : 0;
    });
    M.flow.stats = { region: R.id, lines: F.length, oriented: F.length - unknown, reversed, unknown };
    src.setData({ type: "FeatureCollection", features: F });
  }

  /**
   * Direction of each line: 1 runs downstream as digitised, -1 runs upstream (reverse it), 0 unclear.
   * Signals, from samples every 3/4 cell along the line on the heat-map grid:
   * - reaches: the modelled reaches (upstream to downstream) through the sampled cells point along the line,
   *   or against it, at 80 % of at least 4 samples that cover at least a quarter of the line (so a stream
   *   running beside a larger river near their confluence is not taken for it);
   * - elevation: the reaches at the line's two ends (elevation interpolated along each reach) differ by 3 m;
   * - area: the catchment-area code (the largest in the 3x3 cells around each sample, so a line a cell off
   *   the modelled channel still reads it; sea and nodata left out) is larger in the line's last third than in
   *   its first (by at least 2 codes, ~18 %), or smaller, and the rank trend over the whole line (Kendall)
   *   agrees, so neither a stretch off the channel nor an end touching a larger channel decides it; and the
   *   code at the line's downstream end must not be below that at its upstream end.
   * The first of reaches, elevation and area that gives a direction decides it, and no other may disagree,
   * except that the area (a coarser grid, cut off at the region edge) does not count against reaches that
   * cover half the line or more. A line that strays from the modelled drainage (reaches both ways, or
   * signals that disagree) gets no arrows, and so do canals (skip).
   */
  function lineDirections(R, A, lines, skip) {
    const W = R.width, H = R.height, x0 = R.merc[0], y1 = R.merc[3], pw = (R.merc[2] - x0) / W, ph = (y1 - R.merc[1]) / H;
    const E = 6378137, rad = Math.PI / 180, NS = 32, step = 0.75 * pw;
    const merc = (p) => [E * p[0] * rad, E * Math.log(Math.tan(Math.PI / 4 + p[1] * rad / 2))];
    const cell = (x, y) => {
      const q = Math.floor((x - x0) / pw), r = Math.floor((y1 - y) / ph);
      return q < 0 || r < 0 || q >= W || r >= H ? -1 : r * W + q;
    };
    const near = (i, fn) => {
      const q = i % W, r = (i - q) / W;
      for (let dr = -1; dr <= 1; dr++) for (let dq = -1; dq <= 1; dq++) {
        const rr = r + dr, qq = q + dq;
        if (rr >= 0 && qq >= 0 && rr < H && qq < W) fn(rr * W + qq);
      }
    };
    // the reaches drawn into the grid: direction in NS sectors (0 = none) and elevation per cell
