<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>
<body>
<title>River Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Find unexplored whitewater in New Zealand from LINZ terrain, NIWA flood statistics and the river guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* --- core/tokens.css --- */
/* River Finder design tokens. Shared by every page: use these, never literal colours.
   Layout concept: one-screen field tool. A slim app bar (bottom tab bar on phones) over full-bleed
   pages; chrome stays quiet so colour is reserved for data (grades, scores, catchments).
   Owner: core. Pages may add page-scoped tokens in their own CSS (prefix them, e.g. --top-*). */
:root {
  /* type */
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 0.75rem; --fs-sm: 0.8125rem; --fs-md: 0.9375rem; --fs-lg: 1.125rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  /* space and shape */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --radius: 6px; --radius-lg: 10px;
  --bar-h: 52px; --tab-h: 58px; --touch: 44px;

  /* neutrals: faint green-grey (bush and paper) */
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #eceee9;
  --fg: #1c201e;
  --muted: #5a635e;
  --line: #d9ded9;
  --line-strong: #b9c0ba;
  --shadow: 0 1px 2px rgb(20 28 24 / 0.08), 0 4px 16px rgb(20 28 24 / 0.08);
  --scrim: rgb(16 20 18 / 0.45);

  /* interface accent: the catchment blue */
  --accent: #2a78d6;
  --accent-fg: #ffffff;
  --accent-soft: #e3eefb;
  --focus: #2a78d6;

  /* semantic status (separate from the accent) */
  --ok: #18853a; --warn: #b7791f; --crit: #c53030;
  --ok-soft: #e2f3e7; --warn-soft: #fbf0dc; --crit-soft: #fbe4e4;

  /* data: whitewater grade, II (blue) to VI (violet) */
  --grade-2: #2f7fe0; --grade-3: #3f63d6; --grade-4: #5a4ccc; --grade-5: #7a3dbd; --grade-6: #9430aa;
  /* data: model score, low (red) to high (green) through amber */
  --score-lo: #d43d3d; --score-mid: #e0a419; --score-hi: #1e9a45;
  /* data: LINZ river network, other map features */
  --river-linz: #8a9690; --falls: #0e7c86; --road: #6b5a4a; --track: #a0642c; --catch: #0b9a2c;
  --gauge-rain: #3b6fb6; --gauge-flow: #0f8a8a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1a; --surface-2: #212723; --fg: #e6ebe7; --muted: #9aa59f;
    --line: #2d3530; --line-strong: #46504a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 6px 20px rgb(0 0 0 / 0.35); --scrim: rgb(0 0 0 / 0.6);
    --accent: #5b9cec; --accent-fg: #0b1a2c; --accent-soft: #1b2b40; --focus: #86b6ef;
    --ok: #4cc06e; --warn: #e2a948; --crit: #f07272;
    --ok-soft: #173322; --warn-soft: #3a2c12; --crit-soft: #3d1a1a;
    --grade-2: #5a9bf0; --grade-3: #6f86ee; --grade-4: #8a76ea; --grade-5: #a565e0; --grade-6: #c05ad2;
    --score-lo: #ef5f5f; --score-mid: #f0bb3c; --score-hi: #3fbf68;
    --river-linz: #c9d1cc; --falls: #3fc1cc; --road: #c8b8a6; --track: #e0a060; --catch: #3fcf62;
    --gauge-rain: #79a6e8; --gauge-flow: #42c2c2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --surface-2: #212723; --fg: #e6ebe7; --muted: #9aa59f;
  --line: #2d3530; --line-strong: #46504a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 6px 20px rgb(0 0 0 / 0.35); --scrim: rgb(0 0 0 / 0.6);
  --accent: #5b9cec; --accent-fg: #0b1a2c; --accent-soft: #1b2b40; --focus: #86b6ef;
  --ok: #4cc06e; --warn: #e2a948; --crit: #f07272;
  --ok-soft: #173322; --warn-soft: #3a2c12; --crit-soft: #3d1a1a;
  --grade-2: #5a9bf0; --grade-3: #6f86ee; --grade-4: #8a76ea; --grade-5: #a565e0; --grade-6: #c05ad2;
  --score-lo: #ef5f5f; --score-mid: #f0bb3c; --score-hi: #3fbf68;
  --river-linz: #c9d1cc; --falls: #3fc1cc; --road: #c8b8a6; --track: #e0a060; --catch: #3fcf62;
  --gauge-rain: #79a6e8; --gauge-flow: #42c2c2;
  color-scheme: dark;
}

/* --- core/base.css --- */
/* Shared layout and components. Owner: core. Class names start with rf-; pages prefix their own
   classes with the page id (map-, top-, models-, info-). */
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs-md)/1.5 var(--font-ui); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 650; }
h1 { font-size: var(--fs-xl); } h2 { font-size: var(--fs-lg); } h3 { font-size: var(--fs-md); }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num, .rf-num { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 0.95em; }
.rf-muted { color: var(--muted); }
.rf-note { color: var(--muted); font-size: var(--fs-sm); max-width: 70ch; }
.rf-eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- app frame: bar on top (desktop), tab bar at the bottom (phones) ---------- */
.rf-app { height: 100%; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr); }
.rf-bar {
  display: flex; align-items: center; gap: var(--sp-4); background: var(--surface);
  border-bottom: 1px solid var(--line); z-index: 30;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rf-brand { display: flex; align-items: center; gap: var(--sp-2); font-weight: 700; font-size: var(--fs-md); color: var(--fg); text-decoration: none; white-space: nowrap; }
.rf-brand svg { width: 22px; height: 22px; flex: none; }
.rf-nav { display: flex; gap: var(--sp-1); height: 100%; }
.rf-nav a {
  display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); height: 100%;
  color: var(--muted); text-decoration: none; font-weight: 550; font-size: var(--fs-sm);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.rf-nav a svg { width: 18px; height: 18px; flex: none; }
.rf-nav a:hover { color: var(--fg); }
.rf-nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.rf-bar-end { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.rf-pages { position: relative; min-height: 0; }
.rf-page { position: absolute; inset: 0; overflow: auto; }
.rf-page[data-scroll="none"] { overflow: hidden; }
/* Reading pages: centred column with the side gutter */
.rf-doc {
  max-width: 1080px; margin: 0 auto; display: grid; gap: var(--sp-5);
  padding-block: var(--sp-6) var(--sp-7);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 720px) {
  .rf-app { grid-template-rows: minmax(0, 1fr) calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
  .rf-bar { grid-row: 2; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  .rf-brand, .rf-bar-end { display: none; }
  .rf-pages { grid-row: 1; }
  .rf-nav { width: 100%; gap: 0; }
  .rf-nav a { flex: 1 1 0; flex-direction: column; justify-content: center; gap: 2px; padding: 0 2px; font-size: 11px; border-bottom: 0; border-top: 2px solid transparent; margin: -1px 0 0; }
  .rf-nav a svg { width: 22px; height: 22px; }
  .rf-nav a[aria-current="page"] { border-top-color: var(--accent); color: var(--accent); }
  .rf-doc { padding-block: var(--sp-5) var(--sp-6); }
}

/* ---------- components ---------- */
.rf-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 36px; padding: 0 var(--sp-3); border-radius: var(--radius);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font: 550 var(--fs-sm)/1 var(--font-ui); cursor: pointer; text-decoration: none; white-space: nowrap;
}
.rf-btn:hover { border-color: var(--fg); }
.rf-btn svg { width: 16px; height: 16px; flex: none; }
.rf-btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.rf-btn--primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.rf-btn--quiet { border-color: transparent; background: transparent; }
.rf-btn--quiet:hover { background: var(--surface-2); border-color: transparent; }
.rf-iconbtn { width: var(--touch); height: var(--touch); padding: 0; border-radius: 50%; }
@media (pointer: coarse) { .rf-btn { min-height: var(--touch); } }

.rf-pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600; line-height: 1.6; white-space: nowrap;
  background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
}
.rf-pill--ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.rf-pill--warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.rf-pill--crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.rf-pill--accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.rf-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; vertical-align: -1px; }

.rf-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--sp-4); min-width: 0; }
.rf-grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.rf-stack { display: grid; gap: var(--sp-3); align-content: start; min-width: 0; }
.rf-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }

.rf-tablewrap { overflow-x: auto; max-width: 100%; }
.rf-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.rf-table th, .rf-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rf-table th { font-weight: 600; color: var(--muted); font-size: var(--fs-xs); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.rf-table td.n, .rf-table th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.rf-table tbody tr:last-child td { border-bottom: 0; }
.rf-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--sp-4); font-size: var(--fs-sm); }
.rf-kv dt { color: var(--muted); }
.rf-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.rf-select, .rf-input {
  min-height: 36px; padding: 0 var(--sp-3); border-radius: var(--radius); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--fg); font: 400 var(--fs-sm) var(--font-ui); max-width: 100%;
}
@media (pointer: coarse) { .rf-select, .rf-input { min-height: var(--touch); font-size: 16px; } }

.rf-empty { display: grid; gap: var(--sp-2); justify-items: start; padding: var(--sp-5); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--muted); }
.rf-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.rf-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* copy-to-clipboard value */
.rf-copy { display: inline-flex; align-items: center; gap: var(--sp-2); max-width: 100%; }
.rf-copy code { font-family: var(--font-data); font-size: var(--fs-sm); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; user-select: all; overflow-wrap: anywhere; }
.rf-copy button { min-height: 28px; padding: 0 8px; font-size: var(--fs-xs); }

/* ---------- full-screen detail view (RF.detail) and dialogs (RF.dialog) ---------- */
.rf-detail, .rf-dialog { position: fixed; inset: 0; z-index: 100; display: grid; }
.rf-detail { background: var(--bg); grid-template-rows: auto minmax(0, 1fr); }
.rf-detail-head {
  display: flex; align-items: center; gap: var(--sp-3); background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: max(var(--sp-2), env(safe-area-inset-top, 0px)); padding-bottom: var(--sp-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.rf-detail-titles { min-width: 0; flex: 1; display: grid; gap: 2px; }
.rf-detail-titles h2 { font-size: var(--fs-lg); overflow-wrap: anywhere; }
@media (max-width: 720px) {
  .rf-detail-titles h2 { font-size: var(--fs-md); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rf-detail-titles .rf-eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.rf-detail-body { overflow: auto; overscroll-behavior: contain; }
.rf-detail-body > .rf-doc { padding-block: var(--sp-5) calc(var(--sp-7) + env(safe-area-inset-bottom, 0px)); }
.rf-dialog { background: var(--scrim); place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.rf-dialog-box {
  width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--surface); color: var(--fg);
  border-radius: var(--radius-lg); box-shadow: var(--shadow); display: grid; gap: var(--sp-4); padding: var(--sp-5);
}
.rf-toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 200;
  bottom: calc(var(--sp-5) + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: var(--sp-2) var(--sp-4); border-radius: 999px; font-size: var(--fs-sm); box-shadow: var(--shadow); pointer-events: none;
}
@media (max-width: 720px) { .rf-toast { bottom: calc(var(--tab-h) + var(--sp-3) + env(safe-area-inset-bottom, 0px)); } }

/* ---------- charts (RF.chart) ---------- */
.rf-chart { position: relative; margin: 0; min-width: 0; }
.rf-chart-host { width: 100%; overflow: hidden; touch-action: pan-y; }
.rf-chart-svg { display: block; max-width: 100%; height: auto; font-family: var(--font-ui); }
.rf-chart-title { font-size: 12px; font-weight: 600; fill: var(--fg); }
.rf-chart-ylab, .rf-chart-xlab { font: 11px var(--font-data); fill: var(--muted); }
.rf-chart-grid { stroke: var(--line); stroke-width: 1; }
.rf-chart-axis { stroke: var(--line-strong); stroke-width: 1; }
.rf-chart-cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.rf-chart-marker { fill: var(--falls); stroke: var(--surface); stroke-width: 1.5; }
.rf-chart-hit { cursor: crosshair; }
.rf-chart-tip {
  position: absolute; top: 8px; z-index: 2; pointer-events: none; padding: 6px 10px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font: 12px/1.45 var(--font-data); white-space: nowrap;
}
.rf-chart-tip-x { color: var(--muted); }
.rf-chart--empty { display: grid; gap: var(--sp-2); place-content: center; min-height: 140px; padding: var(--sp-4); text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); background: repeating-linear-gradient(135deg, transparent 0 10px, var(--surface-2) 10px 11px); }
.rf-chart-empty-title { font-weight: 600; }
.rf-chart--empty .rf-note { margin: 0 auto; }

/* --- pages/map/detail.css --- */
/* River detail view (full screen). Owner: map agent. */
.det-summary { display: grid; gap: var(--sp-3); max-width: 75ch; }
.det-desc { font-size: var(--fs-md); }
.det-grade { background: var(--g); color: #fff; border-color: transparent; }
.det-sec { display: grid; gap: var(--sp-3); min-width: 0; }
.det-sec > h3 { font-size: var(--fs-md); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line); }
.det-stats th[scope="row"] { text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); color: var(--fg); font-weight: 600; white-space: normal; }
.det-stats td.n { white-space: nowrap; font-size: var(--fs-sm); }
.det-stats td.rf-muted { font-size: var(--fs-xs); min-width: 160px; }
.det-data summary { cursor: pointer; font-size: var(--fs-sm); color: var(--muted); }
.det-data .rf-tablewrap { max-height: 320px; overflow: auto; margin-top: var(--sp-2); }
.det-coords { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.det-coord { display: grid; gap: var(--sp-2); align-content: start; padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); min-width: 0; }
.det-coord h4 { font-size: var(--fs-sm); }
.det-coord p { font-size: var(--fs-sm); }
.det-k { min-width: 56px; font-size: var(--fs-xs); }
.det-links { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.det-linkgroup { display: grid; gap: var(--sp-2); align-content: start; min-width: 0; }
.det-linkgroup h4 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.det-linklist { display: grid; gap: 6px; font-size: var(--fs-sm); }
.det-link { display: inline-flex; gap: 4px; align-items: center; overflow-wrap: anywhere; }
.det-link svg { width: 13px; height: 13px; flex: none; }
.det-gauge { font-size: var(--fs-sm); }
.det-foot { border-top: 1px solid var(--line); padding-top: var(--sp-3); }
.det-note-inline { display: none; }
.det-show span { display: inline-flex; }
@media (max-width: 720px) {
  .det-note { display: none; }
  .det-note-inline { display: block; font-weight: 400; color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
  .det-show { width: var(--touch); padding: 0; }
  .det-show-label { display: none !important; }
}
.det-gaugelist { display: grid; gap: 4px; }
.det-gk { font-size: var(--fs-xs); }
.det-gaugebtn { display: flex; justify-content: space-between; gap: var(--sp-2); align-items: baseline; text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--accent); font: 500 var(--fs-sm) var(--font-ui); cursor: pointer; }
.det-gaugebtn:hover { border-color: var(--accent); }
@media (pointer: coarse) { .det-gaugebtn { min-height: var(--touch); } }
/* Rain (57-rain.js) */
.det-rain-box { display: grid; gap: var(--sp-3); min-width: 0; }
.det-rain-table { width: auto; min-width: min(100%, 420px); }
.det-rain-table th.det-rain-grp { text-align: center; text-transform: none; letter-spacing: 0; font-size: var(--fs-xs); color: var(--fg); border-bottom-color: var(--line-strong); }
.det-rain-table tbody th { text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); color: var(--fg); font-family: var(--font-data); }
.det-rain-table td.n, .det-rain-table th.n { padding-left: 14px; }
.det-rain-table tr.det-rain-cur > * { background: var(--accent-soft); }
.det-rain-caveats { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: var(--fs-sm); color: var(--muted); max-width: 75ch; }
.det-rain-attr a { overflow-wrap: anywhere; }
@media (max-width: 720px) { .det-rain-table th, .det-rain-table td { padding: 6px 7px; } .det-rain-table td.n, .det-rain-table th.n { padding-left: 8px; } }

/* --- pages/map/map.css --- */
/* Map page. Desktop: side panel over a full-bleed map. Phone: full-screen map, panel as a bottom sheet.
   Owner: map agent. */
/* Shaded catchment of the selection (45-catchment.js): magenta, apart from the blues of the catchment-area
   map and the grades, the greens of satellite and high scores, and the greys of terrain. The fill is a
   light tone so it tints dark imagery instead of darkening it; the edge is strong. */
:root { --map-catch: #c81e7a; --map-catch-fill: #ff4fa7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --map-catch: #ff6db4; --map-catch-fill: #ff6db4; } }
:root[data-theme="dark"] { --map-catch: #ff6db4; --map-catch-fill: #ff6db4; }
.map-root { position: absolute; inset: 0; overflow: hidden; background: var(--surface-2); }
.map-canvas { position: absolute; inset: 0; }
.map-canvas:focus-visible { outline-offset: -3px; }

/* ---------- side panel / bottom sheet ---------- */
.map-panel {
  position: absolute; z-index: 5; top: 12px; bottom: 12px; left: max(12px, env(safe-area-inset-left, 0px)); width: 340px;
  display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden;
}
.map-panel[data-collapsed] { display: none; }
.map-panel-grip { display: none; }
.map-panel-head { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-2) var(--sp-2) var(--sp-3); }
.map-region { flex: 1; min-width: 0; font-weight: 600; }
.map-panel-close { width: 36px; height: 36px; }
.map-tabs { display: flex; gap: 2px; margin: 0 var(--sp-3); padding: 3px; background: var(--surface-2); border-radius: var(--radius); }
.map-tabs button { flex: 1; min-height: 30px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font: 600 var(--fs-sm) var(--font-ui); cursor: pointer; }
.map-tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.map-panel-body { overflow: auto; overscroll-behavior: contain; padding: var(--sp-3) var(--sp-3) var(--sp-5); }
.map-pane { display: grid; gap: var(--sp-5); grid-template-columns: minmax(0, 1fr); }
.map-sec { display: grid; gap: var(--sp-2); grid-template-columns: minmax(0, 1fr); min-width: 0; }

/* base maps */
.map-basemaps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.map-basemap {
  display: grid; gap: 4px; justify-items: center; padding: 6px 4px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--fg); font: 500 var(--fs-xs)/1.2 var(--font-ui); cursor: pointer; text-align: center;
}
.map-basemap[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.map-basemap:disabled { opacity: 0.45; cursor: not-allowed; }
.map-basemap-thumb { width: 100%; height: 34px; border-radius: 4px; border: 1px solid var(--line); }
.map-thumb-none { background: var(--surface-2); }
.map-thumb-terrain { background: linear-gradient(135deg, #f2f3ef 0%, #b9bdb8 45%, #e7e9e4 55%, #8f958f 100%); }
.map-thumb-topo { background: repeating-radial-gradient(circle at 70% 60%, #f3eedc 0 5px, #d9b98a 5px 6px), #f3eedc; }
.map-thumb-satellite { background: linear-gradient(160deg, #5b6e3c 0%, #34472a 40%, #7d7a5a 70%, #2c4b5c 100%); }
.map-thumb-linz-aerial { background: radial-gradient(circle at 30% 70%, #c9c2a4 0 3px, transparent 4px), linear-gradient(120deg, #6f8a4e 0%, #4c6a3a 35%, #8fa4a8 50%, #5f7f86 56%, #7b8f55 70%, #a39a72 100%); }
.map-thumb-catch { background: linear-gradient(90deg, #d7e6fa, #2a78d6 70%, #0d366b); }
.map-thumb-catch-log { background: linear-gradient(90deg, #86b6ef, #2a78d6 40%, #0d366b); }
.map-catch-ctl { display: grid; gap: var(--sp-3); padding: var(--sp-3); background: var(--surface-2); border-radius: var(--radius); }
.map-slider { display: grid; gap: 2px; }
.map-slider-row { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-sm); }
.map-slider input { width: 100%; accent-color: var(--accent); }
.map-check { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-sm); }

/* layer tree */
.map-tree { display: grid; }
.map-node {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; column-gap: var(--sp-2);
  min-height: 36px; padding: 2px 0 2px calc(var(--depth, 0) * 20px); border-bottom: 1px solid var(--line);
}
.map-node:last-child { border-bottom: 0; }
.map-node input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
.map-node-label { display: grid; font-size: var(--fs-sm); cursor: pointer; min-width: 0; line-height: 1.3; }
.map-node--group > .map-node-label { font-weight: 650; }
.map-node-note { color: var(--muted); font-size: var(--fs-xs); }
.map-node[data-off="true"] .map-node-label { color: var(--muted); }
.map-node-count { color: var(--muted); font-size: var(--fs-xs); }
.map-node-swatches { display: inline-flex; gap: 3px; align-items: center; }
.map-node-link { color: var(--muted); display: inline-flex; }
.map-node-link svg { width: 14px; height: 14px; }
@media (pointer: coarse) { .map-node { min-height: 44px; } .map-node input[type="checkbox"] { width: 20px; height: 20px; } }
.map-swatch { position: relative; display: inline-block; cursor: pointer; border-radius: 3px; }
.map-swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.map-swatch:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.map-swatch--line, .map-key--line { width: 20px; height: 6px; border-radius: 3px; background: var(--sw); }
.map-swatch--dot, .map-key--dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sw); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); }
.map-swatch--area, .map-key--area { width: 14px; height: 14px; border-radius: 3px; background: var(--sw); }
@media (pointer: coarse) { .map-swatch--line { height: 10px; width: 26px; } .map-swatch--dot { width: 18px; height: 18px; } }
.map-key { display: inline-block; flex: none; }
.map-key--flow { width: 20px; height: 11px; color: var(--fg); }
.map-key--flow svg { display: block; width: 100%; height: 100%; }
/* the Pareto frontier outline: a run's line in its casing, outlined */
.map-key--front { width: 18px; height: 4px; margin: 0 3px; border-radius: 2px; background: var(--score-hi); box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--sw); }
/* controls under a tree row (e.g. the Rain window), a note under the tree */
.map-node-ctl { padding: 6px 0 8px calc(var(--depth, 0) * 20px + 25px); border-bottom: 1px solid var(--line); }
.map-tree-note { padding-top: var(--sp-2); }

/* Rain (57-rain.js): segmented past/next and hours, the colour steps */
.map-rain-ctl { display: flex; flex-wrap: wrap; gap: 6px var(--sp-2); align-items: center; }
.map-rain-ctl-x { display: inline-flex; align-items: center; gap: 4px; }
.map-rain-unit { color: var(--muted); font-size: var(--fs-sm); }
.map-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.map-seg button {
  min-width: 32px; min-height: 30px; padding: 0 8px; border: 0; border-left: 1px solid var(--line); background: transparent;
  color: var(--fg); font: 550 var(--fs-sm)/1 var(--font-ui); font-variant-numeric: tabular-nums; cursor: pointer;
}
.map-seg button:first-child { border-left: 0; }
.map-seg button:hover { background: var(--surface-2); }
.map-seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); }
.map-seg button:focus-visible { outline-offset: -3px; }
@media (pointer: coarse) { .map-seg button { min-height: var(--touch); min-width: 42px; padding: 0 8px; } }
.map-rain-scale { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; width: 100%; max-width: 280px; }
.map-rain-scale--key { width: 48px; gap: 1px; }
.map-rain-step { display: grid; gap: 2px; min-width: 0; }
.map-rain-sw { display: block; height: 10px; border-radius: 2px; background: var(--c); }
.map-rain-scale--key .map-rain-sw { height: 6px; border-radius: 1px; }
.map-rain-sw--trace { opacity: 0.6; }
.map-rain-lab { font-size: 10px; color: var(--muted); white-space: nowrap; }
.map-rain-note { font-size: var(--fs-xs); color: var(--muted); }
.map-rain-open { justify-self: start; }
.map-minilegend { display: grid; gap: var(--sp-2); }
.map-minilegend .map-rain-scale { max-width: none; }
/* card: past and next at the outlet, each with the colour of its step */
.map-rain-card { display: flex; gap: var(--sp-2); align-items: baseline; color: var(--fg); }
.map-rain-k { flex: none; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.map-rain-parts { display: flex; flex-wrap: wrap; gap: 2px var(--sp-3); min-width: 0; }
.map-rain-part { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.map-rain-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--line-strong); }
.map-rain-dot--dry { background: transparent; }
.map-rain-when { display: block; font-size: var(--fs-xs); }

/* Every reach by its score (52-score.js): the "From" cut, the colour ramp with its stops */
.map-score-ctl { display: flex; flex-wrap: wrap; gap: 6px var(--sp-2); align-items: center; }
.map-score-k { color: var(--muted); font-size: var(--fs-sm); }
.map-score-bar { display: block; width: 100%; max-width: 280px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--lo), var(--mid), var(--hi)); }
.map-score-ticks { display: flex; justify-content: space-between; max-width: 280px; font-size: 10px; color: var(--muted); }
.map-minilegend .map-score-bar, .map-minilegend .map-score-ticks { max-width: none; }
.map-minilegend .map-score-note { display: none; }

.map-model { display: grid; gap: 4px; padding: var(--sp-3); background: var(--surface-2); border-radius: var(--radius); font-size: var(--fs-sm); }
.map-model-more { justify-self: start; font-size: var(--fs-xs); padding: 0; min-height: 24px; }
.map-reset { justify-self: start; font-size: var(--fs-xs); color: var(--muted); }

/* legend */
.map-legend { display: grid; gap: var(--sp-3); }
.map-legend-row { display: flex; gap: var(--sp-3); align-items: center; font-size: var(--fs-sm); }
.map-legend-block { display: grid; gap: 4px; }
.map-legend-title { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
.map-ramp { width: 100%; max-width: 280px; height: 10px; border-radius: 3px; }
.map-ticks { position: relative; height: 16px; max-width: 280px; font: 400 10px var(--font-data); color: var(--muted); }
.map-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.map-ticks span:first-child { transform: none; }
.map-ticks span:last-child { transform: translateX(-100%); }

/* ---------- floating controls ---------- */
.map-layers-btn { position: absolute; z-index: 4; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); display: none; }
.map-layers-btn span { display: inline-flex; }
.map-layers-btn svg { width: 16px; height: 16px; }
.map-root:has(.map-panel[data-collapsed]) .map-layers-btn { display: inline-flex; }
.map-fit-btn { position: absolute; z-index: 4; top: 82px; right: max(10px, env(safe-area-inset-right, 0px)); width: 29px; height: 29px; min-height: 29px; border-radius: 4px; padding: 0; box-shadow: 0 0 0 2px rgb(0 0 0 / 0.1); }
.map-fit-btn svg { width: 16px; height: 16px; }
.map-chip { display: none; }
.map-status {
  position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px;
  background: var(--fg); color: var(--bg); font-size: var(--fs-sm); box-shadow: var(--shadow); pointer-events: none;
}
.map-minilegend { position: absolute; z-index: 3; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 28px; width: 220px; padding: var(--sp-2) var(--sp-3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.map-minilegend .rf-note { display: none; }
.map-root:has(.map-panel:not([data-collapsed])) .map-minilegend { display: none; }
.map-empty { position: absolute; z-index: 4; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); }
.map-error { margin: var(--sp-6); background: var(--surface); }

/* ---------- selection card ---------- */
.map-card {
  position: absolute; z-index: 6; bottom: 28px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 32px));
  display: grid; gap: var(--sp-2); padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4); background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.map-root:has(.map-panel:not([data-collapsed])) .map-card { left: calc(352px + (100% - 352px) / 2); width: min(420px, calc(100% - 384px)); }
.map-card-head { display: flex; gap: var(--sp-2); align-items: flex-start; }
.map-card-titles { flex: 1; min-width: 0; display: grid; gap: 2px; }
.map-card-title { font-size: var(--fs-lg); line-height: 1.25; overflow-wrap: anywhere; }
.map-card-close { width: 32px; height: 32px; margin: -4px -4px 0 0; }
.map-card-line { font-size: var(--fs-sm); color: var(--muted); min-width: 0; }
.map-card-actions { padding-top: var(--sp-1); }
.map-card-catch[aria-pressed="true"] { border-color: var(--map-catch); background: color-mix(in srgb, var(--map-catch) 12%, var(--surface)); }
.map-card-catch svg { color: var(--map-catch); }
.map-catch-line { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg); }
.map-catch-key {
  flex: none; width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--map-catch);
  background: color-mix(in srgb, var(--map-catch-fill) 30%, transparent);
}
/* LINZ aerial survey line on river cards (47-aerial.js) */
.map-aerial-line { display: flex; align-items: flex-start; gap: var(--sp-2); }
.map-aerial-key { flex: none; display: inline-flex; margin-top: 1px; color: var(--muted); }
.map-aerial-key svg { width: 15px; height: 15px; }
.map-aerial-link { white-space: nowrap; }

/* ---------- MapLibre controls in our tokens ---------- */
.map-root .maplibregl-ctrl-group { background: var(--surface); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.map-root .maplibregl-ctrl-group button + button { border-top-color: var(--line); }
.map-root .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: none; }
:root[data-theme="dark"] .map-root .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map-root .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1); } }
.map-root .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--muted); font-size: 10px; }
.map-root .maplibregl-ctrl-attrib a { color: var(--muted); }
.map-root .maplibregl-ctrl-scale { background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--fg); border-color: var(--fg); font: 10px var(--font-data); }
.map-root .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }

/* ---------- phones: full-screen map, panel as a bottom sheet ---------- */
@media (max-width: 720px) {
  .map-panel {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 78%; border-radius: 14px 14px 0 0; border-bottom: 0;
    grid-template-rows: auto auto auto minmax(0, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    transition: transform 0.22s ease;
  }
  .map-panel[data-collapsed] { display: grid; transform: translateY(105%); visibility: hidden; }
  .map-panel-grip { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 0; }
  .map-panel-head { padding-top: var(--sp-2); }
  .map-layers-btn, .map-root:has(.map-panel[data-collapsed]) .map-layers-btn { display: none; }
  .map-chip {
    display: inline-flex; align-items: center; gap: var(--sp-2); position: absolute; z-index: 4;
    top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 70px);
    min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    font: 600 var(--fs-sm) var(--font-ui); box-shadow: var(--shadow); cursor: pointer;
  }
  .map-chip span { display: inline-flex; min-width: 0; }
  .map-chip svg { width: 18px; height: 18px; }
  .map-chip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block !important; }
  .map-fit-btn { top: calc(82px + env(safe-area-inset-top, 0px)); }
  .map-card, .map-root:has(.map-panel:not([data-collapsed])) .map-card { left: 8px; right: 8px; bottom: 8px; transform: none; width: auto; }
  /* Details, Zoom to and Show catchment stay on one row down to 360 px, with room for wider system fonts */
  .map-card-actions { gap: 6px; }
  .map-card-actions .rf-btn { padding: 0 10px; gap: 6px; }
  .map-minilegend { bottom: 30px; width: 190px; }
  .map-root:has(.map-card:not([hidden])) .map-minilegend { display: none; }
  .map-basemaps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .map-basemap { padding: 4px 3px; }
  .map-basemap-thumb { height: 24px; }
}

/* --- pages/top/top.css --- */
/* Top rivers page (#top). Owner: Top-rivers agent. */

/* ---------- header: model, link to Models, safety note ---------- */
.top-model { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); }
.top-model p { flex: 1 1 300px; min-width: 0; font-size: var(--fs-sm); }
.top-model strong { overflow-wrap: anywhere; }
.top-safety {
  display: flex; align-items: flex-start; gap: var(--sp-2); max-width: 80ch;
  padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--warn); border-radius: var(--radius);
  background: var(--warn-soft); color: var(--fg); font-size: var(--fs-sm);
}
.top-safety svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--warn); }

/* ---------- controls: region and "New leads only", then the filter panel ---------- */
.top-controls { display: grid; gap: var(--sp-3); min-width: 0; }
.top-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); }
.top-region { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; max-width: 100%; }
.top-region select { min-width: 0; }
.top-check { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 36px; font-size: var(--fs-sm); font-weight: 550; cursor: pointer; }
.top-check input, .top-chip input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); }
.top-ftoggle { display: none; }
.top-badge {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--accent); color: var(--accent-fg); font: 600 var(--fs-xs)/1 var(--font-ui);
}
.top-ftoggle::after {
  content: ""; width: 7px; height: 7px; margin: -3px 2px 0 2px; flex: none;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg);
}

   anything not listed there is internal and may change. */
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("rf-data").textContent);

  // Navigation order and icons. Page modules register themselves with RF.page(id, def).

    { id: "top", title: "Top rivers", icon: "list" },
    { id: "models", title: "Models", icon: "model" },
    { id: "info", title: "Info", icon: "info" },
  ];
  const ICONS = {
    map: '<path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/>',

    back: '<path d="M15 5l-7 7 7 7"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
    external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
    pin: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
    river: '<path d="M3 6c3 0 3 3 6 3s3-3 6-3 3 3 6 3M3 12c3 0 3 3 6 3s3-3 6-3 3 3 6 3"/>',
    // a catchment: the basin outline and its streams joining at the outlet
    catchment: '<path d="M12 21 5 15.5 3.5 9 7.5 4l4.5 1.5L16.5 4l4 5-1.5 6.5Z"/><path d="M12 21v-8.5M12 12.5 8.5 9M12 15.5l3.5-4"/>',
    logo: '<path d="M4 20c2.5-5 6-6.5 8-8.5S14.5 6 13 3"/><path d="M11 20c2.5-3 6-4 7.5-6S20 9 19 6" opacity=".55"/>',

  const pages = {}, handlers = {};

    config: DATA.app || {},
    /** Raw build payload (regions index, model registry). Prefer RF.data / RF.models. */
    payload: DATA,
    nav: NAV,
    /** Shared state. Read freely; change only through the setters (they emit events). */
    state: { page: null, region: null, model: null, selection: null, runParams: null },

    // ---------- events ----------
    /** Subscribe; returns an unsubscribe function. Events: ready, page, region, model, runs, select. */
    on(evt, fn) { (handlers[evt] ||= new Set()).add(fn); return () => handlers[evt].delete(fn); },
    off(evt, fn) { handlers[evt]?.delete(fn); },
    emit(evt, payload) {

    },

    /** Register a page: def = {title, mount(el), show(params), hide()}. mount runs once, on first show. */

    go(id, params = {}, opts = {}) {
      const def = pages[id] || pages.map;

    pages,

    // ---------- shared state setters ----------
    /** Load a region (see RF.data.region) and make it current. Resolves to the region object. */
    async setRegion(id) {
      const R = await RF.data.region(id);
      if (RF.state.region !== R.id) {
        RF.state.region = R.id;
        RF.store.set("region", R.id);
        RF.emit("region", { id: R.id, region: R });
      }
      return R;
    },
    /** Make a model current (id from RF.models.list()). */
    setModel(id) {
      if (!RF.models.get(id) || RF.state.model === id) return;
      RF.state.model = id;
      RF.store.set("model", id);
      RF.emit("model", { id });
    },
    /** Replace the run-finder parameters (see RF.runs.defaults()); null restores the defaults. */
    setRunParams(params) {
      RF.state.runParams = params ? Object.assign(RF.runs.defaults(), params) : RF.runs.defaults();
      RF.emit("runs", { params: RF.state.runParams });
    },
    /** Select a feature (see README: feature references). Pages listen for "select". */
    select(feature) { RF.state.selection = feature || null; RF.emit("select", { feature: RF.state.selection }); },

    // ---------- per-browser preferences ----------
    store: {
      get(key, fallback = null) {
        try { const v = localStorage.getItem(`rf:${key}`); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
      },
      set(key, value) { try { localStorage.setItem(`rf:${key}`, JSON.stringify(value)); } catch (e) { /* private mode */ } },
      remove(key) { try { localStorage.removeItem(`rf:${key}`); } catch (e) { /* ignore */ } },
    },

    // ---------- small utilities ----------
    util: {
      icon,
      $: (sel, root = document) => root.querySelector(sel),
      $$: (sel, root = document) => Array.from(root.querySelectorAll(sel)),
      /** el("div", {class: "x", onclick: fn}, child, "text") */
      el(tag, props = {}, ...children) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
          if (v === null || v === undefined || v === false) continue;
          if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
          else if (k === "html") e.innerHTML = v;
          else if (k === "text") e.textContent = v;
          else if (k === "dataset") Object.assign(e.dataset, v);
          else e.setAttribute(k, v === true ? "" : v);
        }
        children.flat().forEach((c) => { if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c)); });
        return e;
      },
      esc: (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]),
      fmt: {
        km2: (v) => v == null || !isFinite(v) ? "–" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3),
        flow: (v) => v == null || !isFinite(v) ? "–" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2),
        grad: (v) => v == null || !isFinite(v) ? "–" : v.toFixed(0),
        km: (m) => m == null || !isFinite(m) ? "–" : m >= 10000 ? `${(m / 1000).toFixed(0)} km` : m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`,
        dist: (m) => m >= 20000 ? "over 20 km" : m < 50 ? "on it" : m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`,
        coord: (lat, lon) => `${lat.toFixed(5)}, ${lon.toFixed(5)}`,
        int: (v) => v == null ? "–" : Math.round(v).toLocaleString("en-NZ"),
      },
      /** Copy text; resolves true on success. Must run inside a click handler. */
      async copy(text) {
        try { await navigator.clipboard.writeText(text); RF.util.toast("Copied"); return true; } catch (e) {
          const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.append(ta); ta.select();
          let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
          ta.remove(); RF.util.toast(ok ? "Copied" : "Select the text to copy it"); return ok;
        }
      },
      /** A value with a Copy button (coordinates, ids). */
      copyable(text, label = "Copy") {
        const { el } = RF.util;
        return el("span", { class: "rf-copy" }, el("code", { text }),
          el("button", { type: "button", class: "rf-btn", "aria-label": `${label}: ${text}`, onclick: () => RF.util.copy(text) }, label));
      },
      toast(msg, ms = 1600) {
        let t = document.querySelector(".rf-toast");
        if (!t) { t = document.createElement("div"); t.className = "rf-toast"; t.setAttribute("role", "status"); document.body.append(t); }
        t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, ms);
      },
      css: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),
      debounce(fn, ms = 150) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; },
      /** NZTM2000 (EPSG:2193) [E, N] from WGS84 lat/lon (transverse Mercator on GRS80, Snyder 1987). */
      toNZTM(lat, lon) {
        const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, lon0 = 173 * Math.PI / 180;
        const e2 = f * (2 - f), ep2 = e2 / (1 - e2), phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
        const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2), T = Math.tan(phi) ** 2;
        const C = ep2 * Math.cos(phi) ** 2, A = (lam - lon0) * Math.cos(phi);
        const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi
          - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
          + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
        const E = 1600000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);
        const Nn = 10000000 + k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24
          + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
        return [E, Nn];
      },
      /** Decode a greyscale image (URL or data URI) into a Uint8Array of its red channel. */
      decodeGray(src, w, h) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas"); c.width = w; c.height = h;
            const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
            const px = ctx.getImageData(0, 0, w, h).data, out = new Uint8Array(w * h);
            for (let i = 0; i < out.length; i++) out[i] = px[i * 4];
            resolve(out);
          };
          img.onerror = () => reject(new Error(`Could not decode ${String(src).slice(0, 60)}`));
          img.src = src;
        });
      },
      b64bytes(txt) {
        const s = atob(txt.trim()), b = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
        return b;
      },
    },

    /** Small modal dialog: RF.dialog({title, body: Node, actions: [{label, primary, onclick}]}) → close(). */
    dialog({ title, body, actions = [], label }) {
      const { el } = RF.util;
      const opener = document.activeElement;
      const box = el("div", { class: "rf-dialog-box", role: "dialog", "aria-modal": "true", "aria-label": label || title });
      if (title) box.append(el("h2", { text: title }));
      if (body) box.append(body);
      const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); opener?.focus?.(); };
      const row = el("div", { class: "rf-row", style: "justify-content:flex-end" });
      actions.forEach((a) => row.append(el("button", { type: "button", class: `rf-btn${a.primary ? " rf-btn--primary" : ""}`, onclick: () => { a.onclick?.(); if (a.close !== false) close(); } }, a.label)));
      if (actions.length) box.append(row);
      const wrap = el("div", { class: "rf-dialog", onclick: (e) => { if (e.target === wrap) close(); } }, box);
      const onKey = (e) => { if (e.key === "Escape") close(); };
      document.addEventListener("keydown", onKey);
      document.body.append(wrap);
      (box.querySelector(".rf-btn--primary") || box.querySelector("button, a"))?.focus();
      return close;
    },
  });

  // ---------- app frame and routing ----------
  function buildNav() {
    const nav = document.getElementById("rf-nav");
    NAV.forEach((p) => {
      const a = RF.util.el("a", { href: `#${p.id}`, dataset: { page: p.id }, html: `${icon(p.icon)}<span>${p.title}</span>` });
      a.addEventListener("click", (e) => { e.preventDefault(); RF.go(p.id); });
      nav.append(a);
    });
    document.getElementById("rf-brand").innerHTML = `${icon("logo")}<span>River Finder</span>`;
  }
  const routeFromHash = () => { const id = location.hash.slice(1); return NAV.some((p) => p.id === id) ? id : "map"; };

  /** Called once by core/start.js after every page module has registered. */
  RF._start = () => {
    buildNav();
    window.addEventListener("popstate", () => {
      if (RF.detail?.isOpen()) { RF.detail.close({ fromHistory: true }); return; }
      const id = routeFromHash(); if (id !== RF.state.page) RF.go(id, {}, { fromHistory: true });
    });
    window.addEventListener("hashchange", () => { const id = routeFromHash(); if (id !== RF.state.page) RF.go(id, {}, { fromHistory: true }); });
    const m = RF.store.get("model");
    RF.state.model = RF.models.get(m) ? m : RF.models.default;
    RF.state.runParams = RF.runs.defaults();
    RF.go(routeFromHash(), {}, { replace: true });
    RF.emit("ready", {});
  };
})();

/* --- core/data.js --- */
/* RF.data and RF.models: the regions index, region loading (JSON + packed reaches + optional
   waterfalls/access), per-model scores, hydro-affected reaches and the model registry. Owner: core.
   Files are the ones `river-finder nz viewer` / `models viewer` / `external attach` write
   (see viewer_nz.py, models.py, external.py); this reads them unchanged. */
(() => {
  "use strict";
  const RF = window.RF, P = RF.payload;
  const INDEX = (P.regions || []).map((r) => Object.assign({ group: "Regions" }, r));
  const cache = new Map(), done = new Map();

  // Packed reaches: one little-endian buffer + header (viewer_nz.pack_segments).
  function decodeSegments(buf, H, info) {
    const n = H.n, S = Object.assign({}, info);
    H.fields.forEach((f) => {
      const out = new Array(n);
      if (f.kind === "i32") { const a = new Int32Array(buf, f.off, n); for (let i = 0; i < n; i++) out[i] = a[i]; }
      else if (f.kind === "u8") { const a = new Uint8Array(buf, f.off, n); for (let i = 0; i < n; i++) out[i] = a[i]; }
      else {
        const a = new Uint16Array(buf, f.off, n);
        for (let i = 0; i < n; i++) {
          const q = a[i];
          out[i] = f.kind === "u16log" ? 10 ** (q * f.scale + f.add)
            : f.kind === "u16null" ? (q === 0 ? null : (q - 1) * f.scale + f.add) : q * f.scale + f.add;
        }
      }
      S[f.k] = out;
    });
    const nf = H.z.nf, z = new Int8Array(buf, H.z.off, n * nf);
    S.z = new Array(n);
    for (let i = 0; i < n; i++) { const row = new Array(nf); for (let k = 0; k < nf; k++) row[k] = z[i * nf + k] * H.z.scale; S.z[i] = row; }
    const C = H.coords, cnt = new Uint16Array(buf, C.count, n), first = new Int32Array(buf, C.first, 2 * n),
      del = new Int16Array(buf, C.delta, 2 * C.ndelta), sc = C.scale;
    S.c = new Array(n);
    for (let i = 0, p = 0; i < n; i++) {
      let x = first[2 * i], y = first[2 * i + 1];
      const pts = [[x * sc, y * sc]];
      for (let k = 1; k < cnt[i]; k++, p++) { x += del[2 * p]; y += del[2 * p + 1]; pts.push([x * sc, y * sc]); }
      S.c[i] = pts;
    }
    return S;
  }

  async function getText(url, what) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Could not load ${what} (HTTP ${res.status}).`);
    return res.text();
  }

  // Waterfalls, rapids and access (river_finder.external): <id>_x.txt holds per reach three uint16
  // distances in 10 m (road, 4WD/private road, foot track), then uint8 waterfall count and uint8
  // tallest height (m). <id>_falls.json = [lon, lat, name, height m | null, reach index | -1, kind ("r" = rapids)].
  async function loadExternal(R) {
    const S = R.segments; if (!S) return;
    try {
      const [xr, fr] = await Promise.all([fetch(`${R.id}_x.txt`), fetch(`${R.id}_falls.json`)]);
      if (xr.ok) {
        const b = RF.util.b64bytes(await xr.text()), buf = b.buffer, n = S.g.length;
        const d = (k) => Array.from(new Uint16Array(buf, 2 * n * k, n), (v) => v * 10);
        S.dRoad = d(0); S.dTrack = d(1); S.dFoot = d(2);
        S.fallsN = Array.from(new Uint8Array(buf, 6 * n, n)); S.fallsH = Array.from(new Uint8Array(buf, 7 * n, n));
      }
      R.falls = fr.ok ? await fr.json() : [];
    } catch (e) { R.falls = R.falls || []; /* optional layer */ }
  }

  // Known sections placed on this region's reaches (river_finder.webdata): <id>_sections.json.
  async function loadSections(R) {
    R.sections = [];
    try { const res = await fetch(`${R.id}_sections.json`); if (res.ok) R.sections = await res.json(); } catch (e) { /* optional */ }
  }

  async function load(entry) {
    const R = Object.assign({}, entry);
    if (R.src) {
      Object.assign(R, JSON.parse(await getText(R.src, R.title)));
      if (R.segB64) R.segments = decodeSegments(RF.util.b64bytes(await getText(R.segB64, `the ${R.title} reaches`)).buffer, R.segHead, R.segInfo);
    }
    R.falls = R.falls || [];
    await Promise.all([loadExternal(R), loadSections(R)]);
    R.loaded = true;
    return R;
  }

  RF.data = {
    /** Index of every region: [{id, title, group, bounds: [[lat0, lon0], [lat1, lon1]], segments}]. */
    regions: () => INDEX.slice(),
    /** Region id to open when nothing else says which: last used, else the first. */
    defaultRegion: () => { const r = RF.store.get("region"); return INDEX.some((e) => e.id === r) ? r : INDEX[0]?.id ?? null; },
    entry: (id) => INDEX.find((r) => r.id === id) || null,
    /** Load a region once (cached). Resolves to R: the index entry plus
     *  segments (S, columnar: see README), falls, runs (reference markers), rec2, stats, image fields. */
    region(id) {
      const entry = RF.data.entry(id);
      if (!entry) return Promise.reject(new Error(`Unknown region "${id}".`));
      if (!cache.has(id)) {
        const p = load(entry);
        p.then((R) => done.set(id, R), () => cache.delete(id));
        cache.set(id, p);
      }
      return cache.get(id);
    },
    /** The already-loaded region, or null (no fetch). */
    loaded: (id) => done.get(id) || null,
    /** Forget a loaded region so its memory can be freed (a later region(id) loads it again). The region open
     *  on the map (RF.state.region) is kept. For pages that scan many regions and keep only summaries. */
    release(id) {
      if (!id || id === RF.state.region) return false;
      const had = cache.delete(id); done.delete(id);
      return had;
    },
    /** Per-model reach scores: {pct: number[] (percentile 0-100), role: number[] | null}.
     *  role bits 0-1: 1 = the model trained on this reach's river, 2 = test river; bit 2: on a guide section.
     *  Falls back to the scores packed with the reaches when a model file is missing. */
    async scores(regionId, modelId) {
      const R = await RF.data.region(regionId), S = R.segments;
      if (!S) return { pct: [], role: null };
      R.mscore = R.mscore || {};
      if (!R.mscore[modelId]) {
        try {
          if (!modelId) throw new Error("no model");
          const b = RF.util.b64bytes(await getText(`${R.id}_m_${modelId}.txt`, "model scores")), n = S.g.length;
          R.mscore[modelId] = { pct: Array.from(new Uint16Array(b.buffer, 0, n), (v) => v / 100), role: Array.from(new Uint8Array(b.buffer, 2 * n, n)) };
        } catch (e) { R.mscore[modelId] = { pct: S.reg.slice(), role: null, fallback: true }; }
      }
      return R.mscore[modelId];
    },
    /** National gauges (river_finder.webdata): {flow: [[site, name, lat, lon, council, operator, funder,
     *  area km², years, mean annual flood, Q10, Q100]], rain: [[agent, name, lat, lon, owner]], sources}. */
    gauges() {
      if (!gaugesP) gaugesP = fetch("gauges.json").then((r) => (r.ok ? r.json() : { flow: [], rain: [] })).catch(() => ({ flow: [], rain: [] }));
      return gaugesP;
    },
    /** Hydro-affected reaches of a region (river_finder.webdata.write_hydro): <id>_hydro.json, optional, fetched once.
     *  Resolves to the file ({classes, exclude, notes, schemes, r: [[reach, class, scheme, share %]]}) plus
     *  at: Map(reach → [class name, scheme record, share %]); null when the region has no file. Never rejects. */
    hydro(id) {
      if (!hydroP.has(id)) {
        hydroP.set(id, fetch(`${id}_hydro.json`).then((res) => (res.ok ? res.json() : null)).then((H) => {
          if (!H || !Array.isArray(H.r)) return null;
          H.at = new Map(H.r.map(([m, c, s, share]) => [m, [H.classes[c], H.schemes[s], share ?? 100]]));
          return H;
        }).catch(() => null));
      }
      return hydroP.get(id);
    },
    /** The hydro class over most of the flagged length of a set of reaches (S = Region.segments, H from hydro()):
     *  {cls, scheme, frac (flagged share of the length, 0-1), note, out (class in H.exclude: not a new lead)}; null
     *  when none is flagged. Pages pick their own threshold on frac (Top rivers and the details pill: 0.5). */
    hydroOf(H, S, members) {
      if (!H?.at?.size || !S) return null;
      const by = new Map(); let all = 0, hit = 0;
      (members || []).forEach((m) => {
        const L = S.len[m] || 0; all += L;
        const h = H.at.get(m); if (!h) return;
        hit += L; const key = `${h[0]}|${h[1]?.id}`, cur = by.get(key);
        if (cur) cur.len += L; else by.set(key, { cls: h[0], scheme: h[1], len: L });
      });
      if (!hit || !all) return null;
      const top = [...by.values()].sort((a, b) => b.len - a.len)[0];
      return { cls: top.cls, scheme: top.scheme, frac: hit / all, note: H.notes?.[top.cls] || "", out: (H.exclude || []).includes(top.cls) };
    },
    decodeSegments,
  };
  let gaugesP = null;
  const hydroP = new Map();   // region id → Promise<hydro file | null>

  // ---------- model registry (models/*.json cards, models/evaluations.json) ----------
  const REG = P.registry || null, CARDS = REG ? REG.models : [];
  RF.models = {
    /** Model cards: [{id, title, description, created, kind, coef, intercept, variant, split, train_rivers, test_rivers, ...}]. */
    list: () => CARDS.slice(),
    get: (id) => CARDS.find((m) => m.id === id) || null,
    default: REG ? REG.default : null,
    /** {splits, evaluations} from models/evaluations.json, or null. */
    evaluations: REG ? REG.evaluations : null,
    /** Feature descriptions keyed by feature name. */
    descriptions: REG ? REG.descriptions : {},
    /** Cross-validated model zoo (models.cv_summary of models/cv/results.json): {created, folds, repeats,
     *  domain_km2, spec_version, models: [{id, kind, title, description, inputs, cv: {auc, auc_style, auc_size,
     *  auc_style_size, recall_top10, recall_top5, median_pct: {mean, sd, fold_sd}}, loro_auc_style}]}, or null. */
    cv: REG ? REG.cv || null : null,
    /** Pooled regression and run-finder defaults from model.json (coef, holdout, lorocv, run_params, ...), or null. */
    legacy: P.model || null,
  };
})();

/* --- core/rain.js --- */
/* RF.rain: live rain per reach from the hourly job (bead rf-t26.9; file format and reference decoder in
   src/river_finder/rainfall/live.py). Owner: core.
   Files under RF.config.rainBase (the standalone site only; the artifact host blocks other hosts):
   index.json (runs, windows, attribution, the region list) and <region>.bin.gz (raw gzip bytes, unpacked here
   with DecompressionStream). Loaded on demand, refreshed about every 15 min while the page is visible. Any
   failure, a stale index or a reach-count mismatch ends in a quiet error state ({code, message}), never a throw
   into the page. Events: RF.emit("rain", {region}) when a region's state changes. */
(() => {
  "use strict";
  const RF = window.RF;
  const BASE = RF.config.target === "site" ? String(RF.config.rainBase || "") : "";
  const WINDOWS = [1, 3, 6, 12, 24];
  const REFRESH_MS = 15 * 60e3, RETRY_MS = 60e3, STALE_HOURS = 12, TIMEOUT_MS = 20e3, KEEP = 3;
  const MAGIC = [0x52, 0x46, 0x52, 0x31]; // "RFR1"
  const UNAVAILABLE = "Live rain unavailable";
  const MSG = {
    host: "Live rain needs the standalone site: this host blocks outside data.",
    off: "Live rain is not part of this build.",
    browser: `${UNAVAILABLE}: this browser cannot unpack the files.`,
    reference: "Live rain isn't available for the 5 m reference areas.",
    missing: `${UNAVAILABLE} for this region.`,
    mismatch: `${UNAVAILABLE}: the rain files are for another build of the river network.`,
    network: `${UNAVAILABLE}: the rain files did not load.`,
    format: `${UNAVAILABLE}: the rain files have an unknown format.`,
  };
  const PERMANENT = new Set(["host", "off", "browser", "reference"]);
  const canGunzip = typeof DecompressionStream === "function" && typeof Response === "function" && typeof Blob === "function";
  const failure = (code, message, extra) => Object.assign(new Error(message || MSG[code] || UNAVAILABLE), { code }, extra);

  // ---------- times ----------
  /** "2026-11-20 18:00Z" (an hour, as in the files) or ISO -> Date (null if unreadable). */
  const parseTime = (s) => { if (!s) return null; const d = new Date(String(s).trim().replace(" ", "T")); return isNaN(d) ? null : d; };
  const NZ = (() => {
    try {
      const o = { timeZone: "Pacific/Auckland" };
      return { time: new Intl.DateTimeFormat("en-NZ", { ...o, hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZoneName: "short" }),
        day: new Intl.DateTimeFormat("en-NZ", { ...o, weekday: "short" }), date: new Intl.DateTimeFormat("en-CA", o) };
    } catch (e) { return null; }
  })();
  /** NZ local time of an hour: "07:00 NZDT", with the weekday when it is not today in NZ ("Sat 07:00 NZDT"). */
  function nzTime(s, opts = {}) {
    const d = s instanceof Date ? s : parseTime(s);
    if (!d) return "–";

  const RANKINGS = [

    { id: "pareto", label: "Pareto layer", note: "The frontier first: runs that no other run beats on flood flow, gradient and height-to-area at once; then the next layer, and so on. Within a layer, the weighted score" },
    { id: "wsum", label: "Weighted score", note: "The weighted mean of the three part scores (flood flow, gradient, height-to-area), 0 to 100" },
