    if (S.dRoad) {
      const near = (A) => members.reduce((t, m) => Math.min(t, A[m]), Infinity);
      acc = { putIn: S.dRoad[first], takeOut: S.dRoad[last], road: near(S.dRoad), track: near(S.dTrack), foot: near(S.dFoot) };
      members.forEach((m) => { falls += S.fallsN[m]; fallsH = Math.max(fallsH, S.fallsH[m]); });
    }
    const isListed = C.listed.has(river) || guide || members.some((m) => C.onGuide.has(m)), ws = wsc / (len * 1000);
    return {
      river, len, drop, grad: drop / (len * 1000) * 1000, effG: eg / (len * 1000), s50,
      aTop: S.a[first], aBot: S.a[last], maf: S.maf[last], ha: has[has.length >> 1], ws,
      score: C.rankBy === "pareto" || C.rankBy === "wsum" ? 100 * ws : score, role: rl, guide: isListed, acc, falls, fallsH,
      status: isListed ? "listed" : rl === 2 ? "heldout" : "candidate", pieces: P.length, top: first, bottom: last,
    };
  }

  /**
   * Find runs in a loaded region.
   * opts: {params (default RF.state.runParams), rankBy (default params.rankBy, else "model" when a model is given,
   *        else "pareto"), model: {pct, role} from RF.data.scores()}
   * Returns runs sorted best first. Each run is a feature reference ({kind: "run", region, id, members, ...}).
   */
  function find(R, opts = {}) {
    const S = R.segments; if (!S) return [];
    const C = context(R, opts), { p, D, rankBy } = C;
    const n = S.g.length, ok = new Uint8Array(n), runId = new Int32Array(n).fill(-1), runs = [];
    for (let i = 0; i < n; i++) ok[i] = D.ws[i] >= p.threshold && (!p.gate || (D.dQ[i] > 0 && D.dS[i] > 0 && D.dH[i] > 0)) ? 1 : 0;
    for (let s = 0; s < n; s++) {
      if (!ok[s] || runId[s] >= 0 || (S.u[s] >= 0 && ok[S.u[s]])) continue;
      const members = []; let gap = [], cur = s;
      while (cur >= 0 && runId[cur] < 0) {
        if (ok[cur]) { members.push(...gap, cur); gap = []; }
        else { gap.push(cur); if (gap.length > p.maxGap) break; }
        cur = S.d[cur];
      }
      if (members.reduce((t, m) => t + S.len[m], 0) / 1000 < p.minLen) continue;
      const rid = runs.length; members.forEach((m) => { runId[m] = rid; });
      const r = summarize(C, members);
      runs.push(Object.assign({ kind: "run", region: R.id, id: `${R.id}:run:${members[0]}`, rid, members, name: r.river || "Unnamed creek" }, r));
    }
    const layers = paretoLayers(runs.map((r) => [Math.log10(Math.max(r.maf, 1e-3)), r.effG, r.ha]));
    runs.forEach((r, i) => { r.layer = layers[i]; });
    return rankBy === "pareto" ? runs.sort((a, b) => a.layer - b.layer || b.ws - a.ws) : runs.sort((a, b) => b.score - a.score);
  }

  let memo = null;
  /**
   * The numbers find() gives a run (len, grad, s50, aTop, aBot, maf, ha, score, acc, falls, ...) for any set of
   * reaches, such as a known section, scored with the same parameters and model. A section placed by river
   * name can be several separate pieces: `pieces` says how many (see summarize). Null when no reaches.
   * opts as find().
   */
  function measure(R, members, opts = {}) {
    const S = R?.segments, ms = S ? [...new Set(members || [])].filter((m) => m >= 0 && m < S.g.length) : [];
    if (!ms.length) return null;
    return summarize(memoized(R, opts), ms);
  }
  function memoized(R, opts) {
    const p = opts.params || RF.state.runParams || defaults(), model = opts.model || null, rankBy = opts.rankBy || rankOf(p, !!model);
    if (!memo || memo.R !== R || memo.p !== p || memo.model !== model || memo.rankBy !== rankBy) memo = context(R, { params: p, model, rankBy });
    return memo;
  }

  /**
   * Every reach's score (0-100, reach order) under a ranking, as runs take their best reach's: the model's
   * percentiles ("model"), 100 × the weighted score ("wsum"; also "pareto", which ranks whole runs), the similarity
   * percentile ("sig") or the percentile of the feature-weighted sum ("comp"). opts as find(); null without reaches.
   */
  function scores(R, opts = {}) { return R?.segments ? memoized(R, opts).scores : null; }

  /** Two Chaikin passes: softens the 5-8 m grid staircase; keeps both end points. */
  function smooth(pts) {
    if (pts.length < 3) return pts;
    let sm = pts;
    for (let pass = 0; pass < 2; pass++) {
      const nx = [sm[0]];
      for (let i = 0; i < sm.length - 1; i++) {
        const a = sm[i], b = sm[i + 1];
        nx.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]], [0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
      }
      nx.push(sm[sm.length - 1]);
      sm = nx;
    }
    return sm;
  }
  const join = (S, ms) => {
    const pts = [];
    ms.forEach((m) => S.c[m].forEach((pt, k) => {
      const q = pts[pts.length - 1];
      if (k === 0 && q && q[0] === pt[0] && q[1] === pt[1]) return;
      pts.push(pt);
    }));
    return pts;
  };

  /** One smoothed line for reaches already in downstream order (a run): [[lon, lat], ...]. */
  function path(S, members) { return smooth(join(S, members)); }

  /**
   * Smoothed lines for any set of reaches (in any order, with branches): one line per connected
   * downstream chain, so reaches are never joined out of order. Returns [[[lon, lat], ...], ...].
   */
  function chains(S, members) {
    const set = new Set(members), fed = new Set(), seen = new Set(), out = [];
    members.forEach((m) => { if (set.has(S.d[m])) fed.add(S.d[m]); });
    const walk = (start) => {
      const chain = []; let cur = start;
      while (cur >= 0 && set.has(cur) && !seen.has(cur)) { seen.add(cur); chain.push(cur); cur = S.d[cur]; }
      if (!chain.length) return;
      const pts = join(S, chain);
      if (cur >= 0 && seen.has(cur)) pts.push(S.c[cur][0]); // close the joint at a confluence already drawn
      out.push(smooth(pts));
    };
    members.filter((m) => !fed.has(m)).forEach(walk);
    members.forEach((m) => { if (!seen.has(m)) walk(m); });
    return out;
  }

  /** Every reach upstream of (and including) a reach: Uint8Array mask in reach order. */
  function upstream(S, seg) {
    const n = S.d.length, ups = new Array(n);
    for (let i = 0; i < n; i++) { const d = S.d[i]; if (d >= 0) (ups[d] ||= []).push(i); }
    const mask = new Uint8Array(n), stack = [seg];
    while (stack.length) { const s = stack.pop(); if (mask[s]) continue; mask[s] = 1; (ups[s] || []).forEach((u) => stack.push(u)); }
    return mask;
  }

  RF.runs = { defaults, find, measure, scores, pieces, path, chains, smooth, upstream, segmentScores, percentiles, paretoLayers,
    rankings: RANKINGS, rankOf, features };
})();

/* --- core/detail.js --- */
/* RF.detail: the full-screen detail view used for anything selectable (rivers, gauges, waterfalls,
   roads). It sits over the current page without touching it, so closing it (×, Esc, browser back)
   leaves the map view and every scroll position exactly as they were. Owner: core.
   Renderers are registered per feature kind (the Map page registers river, waterfall, gauge, ...). */
(() => {
  "use strict";
  const RF = window.RF, { el, icon, esc } = RF.util;
  const renderers = {};
  let current = null; // {wrap, opener, pushed, feature}

  function onKey(e) { if (e.key === "Escape" && current) { e.preventDefault(); close(); } }

  function fallback(f) {
    const dl = el("dl", { class: "rf-kv" });
    Object.entries(f).forEach(([k, v]) => {
      if (v === null || v === undefined || typeof v === "object") return;
      dl.append(el("dt", { text: k }), el("dd", { text: String(v) }));
    });
    return { title: f.name || f.kind || "Details", eyebrow: f.kind, body: dl };
  }

  /** Open the detail view for a feature reference. Returns a promise that resolves when rendered. */
  async function open(feature, opts = {}) {
    if (!feature) return;
    if (current) remove();
    const opener = opts.opener || document.activeElement;
    const titles = el("div", { class: "rf-detail-titles" },
      el("span", { class: "rf-eyebrow", "data-role": "eyebrow" }), el("h2", { "data-role": "title", id: "rf-detail-title", text: feature.name || "Loading…" }),
      el("span", { class: "rf-muted", "data-role": "subtitle", style: "font-size:var(--fs-sm)" }));
    const closeBtn = el("button", { type: "button", class: "rf-btn rf-btn--quiet rf-iconbtn", "aria-label": "Close details", html: icon("close") });
    closeBtn.addEventListener("click", () => close());
    const actions = el("div", { class: "rf-row", "data-role": "actions" });
    const head = el("header", { class: "rf-detail-head" }, titles, actions, closeBtn);
    const doc = el("div", { class: "rf-doc" }, el("p", { class: "rf-muted", text: "Loading…" }));
    const body = el("div", { class: "rf-detail-body" }, doc);
    const wrap = el("div", { class: "rf-detail", role: "dialog", "aria-modal": "true", "aria-labelledby": "rf-detail-title" }, head, body);
    document.body.append(wrap);
    let pushed = false;
    if (!opts.noHistory) { try { history.pushState({ rfDetail: true }, "", location.hash || "#"); pushed = true; } catch (e) { pushed = false; } }
    current = { wrap, opener, pushed, feature };
    document.addEventListener("keydown", onKey);
    closeBtn.focus({ preventScroll: true, focusVisible: false });
    RF.select(feature);
    try {
      const render = renderers[feature.kind] || fallback;
      const out = (await render(feature, { actions, close })) || {};
      if (!current || current.wrap !== wrap) return; // closed while rendering
      head.querySelector('[data-role="eyebrow"]').textContent = out.eyebrow || "";
      head.querySelector('[data-role="title"]').textContent = out.title || feature.name || "Details";
      head.querySelector('[data-role="subtitle"]').textContent = out.subtitle || "";
      doc.replaceChildren(...[].concat(out.body || []));
    } catch (e) {
      console.error(e);
      doc.replaceChildren(el("p", { html: `Could not show these details: ${esc(e.message)}` }));
    }
  }

  function remove() {
    if (!current) return;
    const { wrap, opener } = current;
    wrap.remove(); document.removeEventListener("keydown", onKey);
    current = null;
    try { opener?.focus?.({ preventScroll: true }); } catch (e) { /* gone */ }
  }

  /** Close the detail view (pops the history entry it pushed, so Back and × behave the same). */
  function close(opts = {}) {
    if (!current) return;
    if (current.pushed && !opts.fromHistory) { current.pushed = false; try { history.back(); } catch (e) { /* ignore */ } }
    remove();
    RF.emit("detail-close", {});
  }

  RF.detail = {
    /** render(feature, {actions, close}) → {title, subtitle, eyebrow, body: Node | Node[]} (may be async). */
    register(kind, render) { renderers[kind] = render; },
    open, close,
    isOpen: () => !!current,
    current: () => current?.feature || null,
  };
})();

/* --- core/chart.js --- */
/* RF.chart: small SVG charts in the app's tokens. Owner: core.
   RF.chart.tracks({x, xLabel, tracks: [{label, unit, y, color, area, fmt, markers}], ...}) draws one
   graph with stacked tracks that share the x axis and one crosshair (each track has its own y scale:
   several measures along a river without a misleading dual axis). Redraws on resize; touch friendly. */
(() => {
  "use strict";
  const RF = window.RF, { el } = RF.util;
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs = {}, ...kids) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v !== null && v !== undefined) e.setAttribute(k, v); });
    kids.forEach((k) => k !== null && k !== undefined && e.append(k.nodeType ? k : document.createTextNode(String(k))));
    return e;
  };

  /** About n round tick values covering [lo, hi]. */
  function ticks(lo, hi, n = 4) {
    if (!(hi > lo)) return [lo];
    const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
    const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
    return out;
  }
  const nearest = (xs, v) => { let lo = 0, hi = xs.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < v) lo = m; else hi = m; } return Math.abs(xs[lo] - v) <= Math.abs(xs[hi] - v) ? lo : hi; };

  function tracks(opts) {
    const { x, tracks: T, xLabel = "", xFmt = (v) => v.toFixed(1), label = "Chart" } = opts;
    const wrap = el("figure", { class: "rf-chart", role: "img", "aria-label": label });
    const tip = el("div", { class: "rf-chart-tip", hidden: true });
    const host = el("div", { class: "rf-chart-host" });
    wrap.append(host, tip);
    const M = { l: 52, r: 14, t: 22, gap: 30, b: 34 };

    function draw() {
      const W = Math.max(280, host.clientWidth || 600);
      const heights = T.map((t) => t.height || 120);
      const H = M.t + heights.reduce((a, b) => a + b, 0) + M.gap * (T.length - 1) + M.b;
      const x0 = x[0], x1 = x[x.length - 1] > x0 ? x[x.length - 1] : x0 + 1;
      const sx = (v) => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
      const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "rf-chart-svg" });
      let top = M.t;
      const frames = [];
      T.forEach((t, k) => {
        const h = heights[k], ys = t.y.filter((v) => v !== null && isFinite(v));
        let lo = Math.min(...ys), hi = Math.max(...ys);
        if (t.zero) lo = Math.min(0, lo);
        if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
        const pad = (hi - lo) * 0.08; lo -= t.zero && lo === 0 ? 0 : pad; hi += pad;
        const tk = ticks(lo, hi, h > 100 ? 4 : 3);
        const sy = (v) => top + h - (v - lo) / (hi - lo) * h;
        svg.append(s("text", { x: M.l, y: top - 8, class: "rf-chart-title" }, `${t.label}${t.unit ? ` (${t.unit})` : ""}`));
        tk.forEach((v) => {
          if (v < lo || v > hi) return;
          svg.append(s("line", { x1: M.l, x2: W - M.r, y1: sy(v), y2: sy(v), class: "rf-chart-grid" }));
          svg.append(s("text", { x: M.l - 6, y: sy(v) + 4, class: "rf-chart-ylab", "text-anchor": "end" }, (t.fmt || ((q) => String(q)))(v)));
        });
        const pts = x.map((xv, i) => (t.y[i] === null || !isFinite(t.y[i]) ? null : [sx(xv), sy(t.y[i])])).filter(Boolean);
        if (t.area && pts.length > 1) {
          svg.append(s("path", { d: `M${pts[0][0]},${top + h}L${pts.map((p) => p.join(",")).join("L")}L${pts[pts.length - 1][0]},${top + h}Z`, fill: t.color, "fill-opacity": 0.12, stroke: "none" }));
        }
        svg.append(s("path", { d: `M${pts.map((p) => p.join(",")).join("L")}`, fill: "none", stroke: t.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
        (t.markers || []).forEach((mk) => {
          const px = sx(mk.x), i = nearest(x, mk.x), py = sy(t.y[i]);
          svg.append(s("path", { d: `M${px},${py - 9}l-5,-9h10z`, class: "rf-chart-marker" }, s("title", {}, mk.label)));
        });
        svg.append(s("line", { x1: M.l, x2: W - M.r, y1: top + h, y2: top + h, class: "rf-chart-axis" }));
        frames.push({ top, h, sy, t });
        top += h + M.gap;
      });
      const base = top - M.gap;
      ticks(x0, x1, Math.max(3, Math.floor((W - M.l) / 90))).forEach((v) => {
        if (v < x0 || v > x1) return;
        svg.append(s("text", { x: sx(v), y: base + 16, class: "rf-chart-xlab", "text-anchor": "middle" }, xFmt(v)));
      });
      if (xLabel) svg.append(s("text", { x: W - M.r, y: base + 30, class: "rf-chart-xlab", "text-anchor": "end" }, xLabel));
      // crosshair
      const cross = s("line", { y1: M.t - 4, y2: base, class: "rf-chart-cross", visibility: "hidden" });
      const dots = frames.map((f) => s("circle", { r: 4, fill: f.t.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
      const hit = s("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: H, fill: "transparent", class: "rf-chart-hit" });
      svg.append(cross, ...dots, hit);
      const move = (ev) => {
        const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
        const xv = x0 + (px - M.l) / (W - M.l - M.r) * (x1 - x0), i = nearest(x, xv), cx = sx(x[i]);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
        const lines = [`${xLabel ? `${xFmt(x[i])} ${xLabel.replace(/^.*\((.*)\)$/, "$1")}` : xFmt(x[i])}`];
        frames.forEach((f, k) => {
          const v = f.t.y[i];
          if (v === null || !isFinite(v)) { dots[k].setAttribute("visibility", "hidden"); return; }
          dots[k].setAttribute("cx", cx); dots[k].setAttribute("cy", f.sy(v)); dots[k].setAttribute("visibility", "visible");
          lines.push(`${f.t.label}: ${(f.t.tipFmt || f.t.fmt || String)(v)}${f.t.unit ? ` ${f.t.unit}` : ""}`);
        });
        tip.replaceChildren(...lines.map((l, k) => el("div", { class: k ? "" : "rf-chart-tip-x", text: l })));
        tip.hidden = false;
        const left = (cx / W) * r.width;
        tip.style.left = `${Math.min(Math.max(left + 12, 0), r.width - tip.offsetWidth - 4)}px`;
        if (left + 12 + tip.offsetWidth > r.width) tip.style.left = `${Math.max(left - tip.offsetWidth - 12, 0)}px`;
      };
      const leave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); };
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", leave);
      host.replaceChildren(svg);
    }
    const ro = new ResizeObserver(RF.util.debounce(draw, 60));
    ro.observe(host);
    requestAnimationFrame(draw);
    return wrap;
  }

  /** An empty chart frame with a message (placeholders such as the flow-rate chart). */
  function placeholder(title, message) {
    return el("figure", { class: "rf-chart rf-chart--empty" },
      el("div", { class: "rf-chart-empty-title", text: title }), el("p", { class: "rf-note", text: message }));
  }

  RF.chart = { tracks, placeholder, ticks };
})();

/* --- pages/map/10-core.js --- */
/* Map page internals shared by the map files (loaded in name order): RF.mapkit (M).
   Owner: map agent. Other pages use RF.go("map", {select}) and RF.map.* (see 90-page.js). */
(() => {
  "use strict";
  const RF = window.RF;
  const M = (RF.mapkit = {});
  M.NZ_BOUNDS = [[166.3, -47.4], [178.7, -34.3]];
  M.map = null;           // the maplibregl.Map, once mounted
  M.R = null;             // the region on the map
  M.ready = false;
  M.isPhone = () => window.matchMedia("(max-width: 720px)").matches;

  // ---------- layer slots: groups are drawn in this order (bottom to top) ----------
  // Each group is closed by an invisible anchor layer; addLayer(def, group) inserts before it, or before
  // the layer `before` when that is on the map (to place a layer between two of its group).
  // "catchment" (the shaded catchment of the selection) sits under every line, so rivers stay visible on it.
  M.SLOTS = ["base", "terrain", "overlay", "regions", "catchment", "network", "access", "rivers", "points", "select", "labels"];
  M.initSlots = () => M.SLOTS.forEach((s) => M.map.addLayer({ id: `slot-${s}`, type: "background", layout: { visibility: "none" } }));
  M.addLayer = (def, group, before) => {
    if (M.map.getLayer(def.id)) M.map.removeLayer(def.id);
    M.map.addLayer(def, before && M.map.getLayer(before) ? before : `slot-${group}`);
  };
  M.setSource = (id, spec) => {
    const src = M.map.getSource(id);
    if (src && spec.type === "geojson") { src.setData(spec.data); return src; }
    if (src) { M.layersUsing(id).forEach((l) => M.map.removeLayer(l)); M.map.removeSource(id); }
    M.map.addSource(id, spec);
    return M.map.getSource(id);
  };
  M.layersUsing = (src) => (M.map.getStyle()?.layers || []).filter((l) => l.source === src).map((l) => l.id);
  M.vis = (id, on) => { if (M.map.getLayer(id)) M.map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); };

  // ---------- colours ----------
  M.token = (name) => RF.util.css(name) || "#888";
  M.isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  };
  M.hexRgb = (h) => { const s = h.replace("#", ""); const v = s.length === 3 ? s.split("").map((c) => c + c).join("") : s; return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16)); };
  const themeHandlers = [];
  M.onTheme = (fn) => themeHandlers.push(fn);
  const fireTheme = () => themeHandlers.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", fireTheme);
  new MutationObserver(fireTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- preferences (per browser) ----------
  const PREF_KEY = "map-prefs";
  M.prefs = Object.assign({ basemap: "terrain", layers: {}, colors: {}, catch: {} }, RF.store.get(PREF_KEY, {}) || {});
  if (M.prefs.basemap === "aerial") M.prefs.basemap = "satellite"; // renamed when LINZ aerial gave way to Sentinel-2
  M.savePrefs = RF.util.debounce(() => RF.store.set(PREF_KEY, M.prefs), 300);

  // ---------- label glyphs, served from glyphs/<Font_Name>__<range>.txt (base64) ----------
  M.FONT_WATER = ["Noto Sans Italic"];
  M.FONT_LABEL = ["Noto Sans Regular"];
  let glyphsReady = false;
  M.initGlyphs = () => {
    if (glyphsReady || !window.maplibregl) return;
    glyphsReady = true;
    window.maplibregl.addProtocol("rfglyph", async (params) => {
      const m = /^rfglyph:\/\/(.+)\/(\d+-\d+)$/.exec(params.url);
      if (!m) return { data: new ArrayBuffer(0) };
      const font = decodeURIComponent(m[1]).split(",")[0].trim().replace(/ /g, "_");
      try {
        const res = await fetch(`glyphs/${font}__${m[2]}.txt`);
        if (!res.ok) return { data: new ArrayBuffer(0) };
        return { data: RF.util.b64bytes(await res.text()).buffer };
      } catch (e) { return { data: new ArrayBuffer(0) }; }
    });
  };

  // ---------- region geometry helpers ----------
  /** Image corners for a region grid: TL, TR, BR, BL as [lon, lat]. */
  M.corners = (R) => { const [[la0, lo0], [la1, lo1]] = R.bounds; return [[lo0, la1], [lo1, la1], [lo1, la0], [lo0, la0]]; };
  M.lngLatBounds = (R) => { const [[la0, lo0], [la1, lo1]] = R.bounds; return [[lo0, la0], [lo1, la1]]; };
  M.fitRegion = (R, opts = {}) => M.map.fitBounds(M.lngLatBounds(R), Object.assign({ padding: M.padding(), duration: 600 }, opts));
  /** Padding that keeps fitted features clear of the side panel (desktop) or the card. */
  M.padding = () => {
    if (M.isPhone()) return { top: 60, bottom: 40, left: 24, right: 24 };
    const panel = document.querySelector(".map-panel:not([data-collapsed])");
    return { top: 40, bottom: 40, left: (panel ? panel.offsetWidth + 24 : 0) + 24, right: 72 };
  };
  M.bboxOf = (coords) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    coords.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });

  M.regionHooks = [];
  M.onRegion = (fn) => M.regionHooks.push(fn);

/* --- pages/map/20-basemaps.js --- */
/* Base maps: none, terrain (own LINZ-DEM hillshade), NZ Topo50 (LINZ Basemaps; standalone site only,
   needs a Basemaps key), satellite (Sentinel-2 cloudless 2025 by EOX, CC BY-NC-SA 4.0: live tiles on the
   standalone site, a pre-rendered image per region on the artifact host, which blocks tile servers),
   aerial (the LINZ Basemaps aerial layer at every zoom: LINZ photos, with LINZ's own satellite where it has no
   photos; standalone site with a key, like Topo50; the survey under each river in 47-aerial.js), catchment area (linear) and catchment area (log), plus region

(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit;
  const SITE = RF.config.target !== "artifact";
  const KEY = RF.config.basemapsKey || "";

  const LINZ_ATTR = '<a href="https://basemaps.linz.govt.nz/" target="_blank" rel="noopener">LINZ Basemaps</a> CC BY 4.0';
  const LINZ_AERIAL_ATTR = 'Aerial photos <a href="https://basemaps.linz.govt.nz/" target="_blank" rel="noopener">LINZ Basemaps</a> CC BY 4.0';
  // EOxCloudless (Sentinel-2 cloudless) 2025: the newest cloud-free mosaic, CC BY-NC-SA 4.0

  M.S2_ATTR = 'Satellite <a href="https://cloudless.eox.at" target="_blank" rel="noopener">EOxCloudless 2025</a> by EOX (modified Copernicus Sentinel data 2025) <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>';

  M.BASEMAPS = [
    { id: "none", label: "None", note: "Plain background" },
    { id: "terrain", label: "Terrain", note: "Shaded relief from the LINZ elevation model" },
    { id: "topo", label: "Topographic", note: "NZ Topo50 maps (LINZ)", site: true, key: true },
    { id: "satellite", label: "Satellite", note: "Sentinel-2 cloudless 2025 (EOX), 10 m pixels" },
    { id: "linz-aerial", label: "Aerial", site: true, key: true,

    { id: "catch", label: "Catchment area", note: "Upstream area at every point, linear colour scale" },
    { id: "catch-log", label: "Catchment area (log)", note: "Upstream area, logarithmic colour scale" },

  M.basemapHidden = (b) => SITE && !!b.key && !KEY;
  /** The base map a visitor starts on: the LINZ aerial photos where the site has them (built with a key), else the
      terrain. A base map picked in the panel (prefs.basemapChosen) is kept from then on. */
  M.defaultBasemap = () => (SITE && KEY ? "linz-aerial" : "terrain");
  if (!M.prefs.basemapChosen) M.prefs.basemap = M.defaultBasemap();
  /** Photo base maps (dark imagery: overlays take a stronger tint). */
  M.isImagery = (id) => id === "satellite" || id === "linz-aerial";

  // Sequential blue, small to large catchment. Every land point is coloured, so the ramp spans the full
  // range: ridges pale, channels dark in light mode; in dark mode the largest rivers are brightest.
  const RAMP_LIGHT = ["#f4f8fd", "#dceafb", "#bcd6f6", "#94bdf0", "#6aa1e8", "#3f84dc", "#2a6cc0", "#1d5299", "#123a70", "#0a2550"];
  const RAMP_DARK = ["#101b28", "#152b44", "#1b3d61", "#225181", "#2c67a3", "#3f82c6", "#62a0e2", "#93c0f0", "#c5dcf8", "#eef5fd"];
  M.ramp = () => (M.isDark() ? RAMP_DARK : RAMP_LIGHT).map(M.hexRgb);
  M.rampAt = (t) => {
    const R = M.ramp(), x = Math.min(Math.max(t, 0), 1) * (R.length - 1), i = Math.min(Math.floor(x), R.length - 2), f = x - i;
    return [0, 1, 2].map((k) => Math.round(R[i][k] + (R[i + 1][k] - R[i][k]) * f));
  };

  // Catchment settings (per browser): smallest area shown, opacity, linear range, fade truncated.
  // minKm2 2e-5 = every land cell (the area code starts below one 5 m or 8 m cell)

  /** Area for people: m² under 0.01 km², else km². */

  M.catchSettings = () => Object.assign({}, M.catchDefaults, M.prefs.catch || {});

  function initBaseSources() {
    const map = M.map;
    if (SITE) {
      if (KEY) map.addSource("bm-topo", { type: "raster", tiles: [linz("topo-raster")], tileSize: 256, maxzoom: 17, attribution: LINZ_ATTR });
      map.addSource("bm-sat", { type: "raster", tiles: [S2_TILES], tileSize: 256, maxzoom: 14 });
      // The LINZ aerial layer at every zoom: full coverage (LINZ fills gaps in its photos with its own satellite imagery)
      if (KEY) map.addSource("bm-aerial", { type: "raster", tiles: [linz("aerial")], tileSize: 256, maxzoom: 20, attribution: LINZ_AERIAL_ATTR });
      if (KEY) M.addLayer({ id: "bm-topo", type: "raster", source: "bm-topo", layout: { visibility: "none" }, paint: { "raster-fade-duration": 150 } }, "base");
      M.addLayer({ id: "bm-sat", type: "raster", source: "bm-sat", layout: { visibility: "none" }, paint: { "raster-fade-duration": 150 } }, "base");
      if (KEY) M.addLayer({ id: "bm-aerial", type: "raster", source: "bm-aerial", layout: { visibility: "none" }, paint: { "raster-fade-duration": 150 } }, "base");
    }
    let warned = false;
    map.on("error", (e) => {
      if (e?.sourceId && String(e.sourceId).startsWith("bm-")) {
        if (!warned) { warned = true; RF.util.toast(e.sourceId === "bm-sat" ? "Satellite tiles did not load. Check the connection." : "LINZ Basemaps tiles did not load. Check the connection or the API key."); }

    });

    const feats = RF.data.regions().map((r) => {
      const [[la0, lo0], [la1, lo1]] = r.bounds;
      return { type: "Feature", properties: { id: r.id, title: r.title }, geometry: { type: "Polygon", coordinates: [[[lo0, la0], [lo1, la0], [lo1, la1], [lo0, la1], [lo0, la0]]] } };
    });
    map.addSource("regions", { type: "geojson", data: { type: "FeatureCollection", features: feats } });
    M.addLayer({ id: "regions-fill", type: "fill", source: "regions", paint: { "fill-color": "#000", "fill-opacity": 0 } }, "regions");
    M.addLayer({ id: "regions-line", type: "line", source: "regions", paint: { "line-color": M.token("--muted"), "line-width": 1, "line-dasharray": [3, 2], "line-opacity": 0.7 } }, "regions");
    M.addLayer({ id: "regions-label", type: "symbol", source: "regions", maxzoom: 9,
      layout: { "text-field": ["get", "title"], "text-font": M.FONT_LABEL, "text-size": 12, "text-allow-overlap": false },
      paint: { "text-color": M.token("--muted"), "text-halo-color": M.token("--surface"), "text-halo-width": 1.5 } }, "labels");
    M.onTheme(() => {
      if (!M.map.getLayer("regions-line")) return;
      M.map.setPaintProperty("regions-line", "line-color", M.token("--muted"));
      M.map.setPaintProperty("regions-label", "text-color", M.token("--muted"));
      M.map.setPaintProperty("regions-label", "text-halo-color", M.token("--surface"));
      M.map.setPaintProperty("bg", "background-color", M.token("--surface-2"));
      paintHillshade(); redrawCatch();
    });
  }
  M.onRegion((R) => {
    if (M.map.getLayer("regions-line")) M.map.setFilter("regions-line", ["!=", ["get", "id"], R.id]);
  });

  // ---------- per-region terrain and catchment ----------
  let C = null; // {R, area, trunc, disp, dispTrunc, canvas, ctx, maxLog}

  // Hillshade drawn on a canvas so the nodata margin is transparent and the tint follows the theme
  // (and lightens under the catchment colours).
  const HS = { light: ["#8c928d", "#f7f8f5"], dark: ["#0d110f", "#545d58"], lightCatch: ["#c3c8c3", "#fafbf9"], darkCatch: ["#0a0d0b", "#323a35"] };
  function paintHillshade() {
    if (!C || !C.hs) return;
    const dark = M.isDark(), catchOn = M.prefs.basemap.startsWith("catch");
    const [lo, hi] = HS[(dark ? "dark" : "light") + (catchOn ? "Catch" : "")].map(M.hexRgb);
    const L = new Uint32Array(256);
    for (let v = 1; v < 256; v++) {
      const t = v / 255, c = [0, 1, 2].map((k) => Math.round(lo[k] + (hi[k] - lo[k]) * t));
      L[v] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
    }
    const img = C.hsCtx.createImageData(C.R.width, C.R.height), px = new Uint32Array(img.data.buffer), h = C.hs;
    for (let i = 0; i < px.length; i++) px[i] = L[h[i]];

    const src = M.map.getSource("terrain");
    if (src && src.play) { src.play(); src.pause(); }
    M.map.triggerRepaint();
  }

  async function loadRegionImages(R) {
    const coords = M.corners(R);
    C = null;
    const [hs, area, trunc] = await Promise.all([RF.util.decodeGray(R.hillshade, R.width, R.height),
      RF.util.decodeGray(R.area, R.width, R.height), RF.util.decodeGray(R.trunc, R.width, R.height)]);
    if (M.R !== R) return;
    const W = R.width, H = R.height;
    let maxCode = 0; for (let i = 0; i < area.length; i++) if (area[i] > maxCode) maxCode = area[i];
    // Display copy with channels widened by size (1 px; 3 px above 10 km²; 5 px above 100 km²), so
    // rivers stay visible zoomed out. Point readouts use the unwidened grid.
    const disp = area.slice(), dispTrunc = trunc.slice();
    const code = (km2) => Math.round((Math.log10(km2) - R.code.log_min) / R.code.step) + 2;
    const c10 = code(10), c100 = code(100);
    for (let i = 0; i < area.length; i++) {
      const c = area[i]; if (c < c10) continue;
      const rad = c >= c100 ? 2 : 1, r0 = (i / W) | 0, q0 = i - r0 * W;
      for (let dr = -rad; dr <= rad; dr++) for (let dq = -rad; dq <= rad; dq++) {

        const j = r * W + q; if (area[j] !== 0 && c > disp[j]) { disp[j] = c; dispTrunc[j] = trunc[i]; }

    const hsCanvas = document.createElement("canvas"); hsCanvas.width = W; hsCanvas.height = H;

          maxLog: R.code.log_min + (maxCode - 2) * R.code.step };
    M.setSource("terrain", { type: "canvas", canvas: hsCanvas, coordinates: coords, animate: false });
    M.addLayer({ id: "terrain", type: "raster", source: "terrain", layout: { visibility: "none" }, paint: { "raster-fade-duration": 0 } }, "terrain");
    paintHillshade();
    drawCatch();
    M.setSource("catch", { type: "canvas", canvas, coordinates: coords, animate: false });
    M.addLayer({ id: "catch", type: "raster", source: "catch", layout: { visibility: "none" }, paint: { "raster-fade-duration": 0, "raster-opacity": M.catchSettings().opacity } }, "overlay");
    applyBasemap();
    M.drawCatchLegend?.();

  }
  const areaHooks = [];
  /** Run fn(R) once a region's area grid is decoded (M.areaGrid() is then that region's). */
  M.onAreaGrid = (fn) => areaHooks.push(fn);
  M.onRegion((R) => loadRegionImages(R).catch((e) => { console.error(e); RF.util.toast("Could not draw the terrain for this region."); }));
  // Artifact host: no tile servers, so the satellite base map is the region's pre-rendered image (webdata.write_satellite).
  M.onRegion((R) => {
    if (SITE) return;
    M.setSource("sat-img", { type: "image", url: `${R.id}_sat.jpg`, coordinates: M.corners(R) });
    M.addLayer({ id: "sat-img", type: "raster", source: "sat-img", layout: { visibility: M.prefs.basemap === "satellite" ? "visible" : "none" }, paint: { "raster-fade-duration": 0 } }, "base");
  });

  /** Colour lookup per area code (256 entries, RGBA packed little-endian). */
  function lut(R, s, mode, dark) {
    const out = new Uint32Array(256), minLog = Math.max(Math.log10(Math.max(s.minKm2, 1e-9)), R.code.log_min), maxLog = Math.max(C.maxLog, minLog + 0.5);
    const a = Math.round(255);
    for (let c = 2; c < 256; c++) {
      const lg = R.code.log_min + (c - 2) * R.code.step;
      if (lg < minLog) continue;
      const t = mode === "catch-log" ? (lg - minLog) / (maxLog - minLog) : Math.min(10 ** lg / s.linMax, 1);
      const [r, g, b] = M.rampAt(t);

    }

  }

  function drawCatch() {
    if (!C) return;
    const s = M.catchSettings(), mode = M.prefs.basemap === "catch" ? "catch" : "catch-log";
    const L = lut(C.R, s, mode, M.isDark()), W = C.R.width, H = C.R.height;
    const img = C.ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer), d = C.disp, tr = C.dispTrunc;
    const fade = s.fadeTrunc;

      const v = L[d[i]];
      if (!v) continue;

    }

  }
  function redrawCatch() {
    if (!C) return;
    drawCatch();
    const src = M.map.getSource("catch");
    if (src && src.play) { src.play(); src.pause(); }
    M.map.triggerRepaint();
    M.drawCatchLegend?.();
  }
  M.redrawCatch = RF.util.debounce(redrawCatch, 60);
  M.setCatch = (patch) => {
    M.prefs.catch = Object.assign({}, M.prefs.catch, patch); M.savePrefs();
    if ("opacity" in patch && M.map.getLayer("catch")) M.map.setPaintProperty("catch", "raster-opacity", patch.opacity);
    if (Object.keys(patch).some((k) => k !== "opacity")) M.redrawCatch();
  };

  /** The region's decoded grids once drawn: {R, area (8-bit log code), trunc (0/255)} on the heat-map grid, or null. */
  M.areaGrid = () => (C ? { R: C.R, area: C.area, trunc: C.trunc } : null);
  /** Index of the heat-map grid pixel (row * width + column) under a map point, or -1 outside the region. */
  M.pixelOf = (R, lngLat) => {
    const p = window.maplibregl.MercatorCoordinate.fromLngLat(lngLat);
    const E = 20037508.342789244, x = p.x * 2 * E - E, y = E - p.y * 2 * E;
    const pw = (R.merc[2] - R.merc[0]) / R.width, ph = (R.merc[3] - R.merc[1]) / R.height;
    const q = Math.floor((x - R.merc[0]) / pw), r = Math.floor((R.merc[3] - y) / ph);
    return q < 0 || r < 0 || q >= R.width || r >= R.height ? -1 : r * R.width + q;
  };

  /** Catchment area at a map point: {km2, trunc, channel: {km2, lon, lat} | null}, or null off land.
   *  Every land point has an area (down to one cell); a much larger channel within ~3 px is also given,
   *  because a finger rarely lands exactly on a 1 px stream. */
  M.areaAt = (lngLat) => {
    if (!C) return null;
    const R = C.R, E = 20037508.342789244, i0 = M.pixelOf(R, lngLat);
    if (i0 < 0) return null;
    const pw = (R.merc[2] - R.merc[0]) / R.width, ph = (R.merc[3] - R.merc[1]) / R.height;
    const q = i0 % R.width, r = (i0 - q) / R.width, c0 = C.area[i0];
    if (c0 < 1) return null;
    const km2 = (c) => 10 ** (R.code.log_min + (c - 2) * R.code.step);
    const here = c0 >= 2 ? km2(c0) : 0;
    let best = c0, bi = i0;
    for (let dr = -3; dr <= 3; dr++) for (let dq = -3; dq <= 3; dq++) {
      const rr = r + dr, qq = q + dq; if (rr < 0 || qq < 0 || rr >= R.height || qq >= R.width) continue;
      const i = rr * R.width + qq; if (C.area[i] > best) { best = C.area[i]; bi = i; }
    }
    let channel = null;
    if (bi !== i0 && best >= 2 && km2(best) >= 0.5 && km2(best) >= 20 * Math.max(here, 1e-6)) {
      const bq = bi % R.width, br = (bi - bq) / R.width;
      const mx = R.merc[0] + (bq + 0.5) * pw, my = R.merc[3] - (br + 0.5) * ph;
      const ll = new window.maplibregl.MercatorCoordinate((mx + E) / (2 * E), (E - my) / (2 * E)).toLngLat();
      channel = { km2: km2(best), lon: ll.lng, lat: ll.lat, trunc: C.trunc[bi] > 0 };

    return { km2: here, trunc: C.trunc[i0] > 0, channel, pixelM: Math.round(pw * Math.cos(lngLat.lat * Math.PI / 180)) };
  };

  M.onBasemap = (fn) => basemapHooks.push(fn);
  /** Show the chosen base map. */
  function applyBasemap() {
    const id = M.prefs.basemap, map = M.map; if (!map) return;
    const b = M.BASEMAPS.find((x) => x.id === id);
    const use = b && M.basemapAvailable(b) ? id : "terrain";
    M.vis("bm-topo", use === "topo");
    M.vis("bm-sat", use === "satellite");
    M.vis("bm-aerial", use === "linz-aerial");
    M.vis("sat-img", use === "satellite");
    M.vis("terrain", use === "terrain" || use.startsWith("catch"));
    M.vis("catch", use.startsWith("catch"));
    paintHillshade();
    document.querySelector(".map-root")?.setAttribute("data-basemap", use);
    basemapHooks.forEach((fn) => { try { fn(use); } catch (e) { console.error(e); } });
  }
  M.setBasemap = (id) => {
    const prevCatch = M.prefs.basemap.startsWith("catch");
    M.prefs.basemap = id; M.prefs.basemapChosen = true; M.savePrefs();
    applyBasemap();
    if (id.startsWith("catch") && (prevCatch || true)) redrawCatch();
    M.renderLegend?.();
    M.renderBasemapControls?.();
  };
  M.initBasemaps = () => { initBaseSources(); applyBasemap(); };

  /** Legend content for the active base map (gradient bar for the catchment maps). */
  M.basemapLegend = () => {
    const id = M.prefs.basemap, { el } = RF.util;
    if (!id.startsWith("catch") || !C) return null;
    const s = M.catchSettings(), log = id === "catch-log", minLog = Math.max(Math.log10(s.minKm2), C.R.code.log_min), maxLog = Math.max(C.maxLog, minLog + 0.5);
    const cv = el("canvas", { width: 240, height: 10, class: "map-ramp", "aria-hidden": "true" });
    const ctx = cv.getContext("2d");
    for (let x = 0; x < 240; x++) {
      const t = x / 239, [r, g, b] = M.rampAt(t);
      ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(x, 0, 1, 10);
    }
    const ticks = el("div", { class: "map-ticks" });
    if (log) {
      const decades = []; for (let e = Math.ceil(minLog); e <= Math.floor(maxLog); e++) decades.push(e);
      const stride = Math.ceil(decades.length / 5);
      decades.filter((e, k) => k % stride === 0).forEach((e) => {
        const pos = (e - minLog) / (maxLog - minLog) * 100;
        const v = 10 ** e;
        ticks.append(el("span", { style: `left:${pos}%`, text: v < 0.01 ? `${Math.round(v * 1e6)} m²` : String(+v.toPrecision(1)) }));
      });

/* --- pages/map/40-select.js --- */
/* Selection on the map: tap anything drawn to highlight it and get a short card; "Details" opens the
   full-screen detail view (RF.detail), which closes back to the same map view; "Show catchment" shades
   what drains into the river (45-catchment.js) until the selection changes; the card names the LINZ aerial
   survey over the river (47-aerial.js).
   Layer files register:
     M.clickable({layers: [layerIds], priority, feature(mapFeature, event, allHits) → feature reference | null})
     M.card[kind] = (feature) → {eyebrow, title, lines: [Node|string]}
     M.geometry[kind] = (feature) → GeoJSON geometry (for highlight and zoom)
   Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el, icon, fmt } = RF.util;
  const clickables = [];
  M.card = {};
  M.geometry = {};
  M.clickable = (c) => { clickables.push(Object.assign({ priority: 50 }, c)); clickables.sort((a, b) => b.priority - a.priority); };

  // ---------- geometry of feature references ----------
  // Lines follow each connected downstream chain of reaches (never joined out of order), smoothed.
  M.geometry.run = (f) => { const S = M.R?.segments; return S ? { type: "MultiLineString", coordinates: RF.runs.chains(S, f.members) } : null; };
  M.geometry.section = M.geometry.run;
  /** The reaches bridged between a section's pieces (sec.gap, 50-rivers.js M.sectionLine), drawn dashed; null if none. */
  M.gapGeometry = (f) => {
    const S = M.R?.segments; if (f?.kind !== "section" || !f.sec?.gap?.length || !S) return null;
    const { gap } = M.sectionLine(S, f.sec);
    return gap.length ? { type: "MultiLineString", coordinates: RF.runs.chains(S, gap) } : null;
  };
  M.geometry.reach = (f) => { if (f.geometry) return f.geometry; const S = M.R?.segments; return S ? { type: "LineString", coordinates: RF.runs.smooth(S.c[f.seg]) } : null; };
  M.geometry["linz-river"] = (f) => f.geometry || null;
  M.card["linz-river"] = (f) => ({ eyebrow: `LINZ ${f.linz.type}`, title: f.name,
    lines: [f.km2 ? el("span", { class: "num", text: `Catchment area here: ${M.fmtArea(f.km2)}` }) : null,
      el("span", { class: "rf-note", text: "Smaller than the modelled reaches (from 1 km²), so no gradient or flow here." }),
      RF.util.copyable(fmt.coord(f.lat, f.lon))], noDetails: true });
  M.geometryOf = (f) => {
    if (M.geometry[f.kind]) return M.geometry[f.kind](f);
    if (f.lon !== undefined && f.lat !== undefined) return { type: "Point", coordinates: [f.lon, f.lat] };
    if (f.geometry) return f.geometry;
    return null;
  };
  const coordsOf = (g) => !g ? [] : g.type === "Point" ? [g.coordinates] : g.type === "LineString" ? g.coordinates
    : g.type === "MultiLineString" ? g.coordinates.flat() : [];

  const CASING_W = ["interpolate", ["linear"], ["zoom"], 8, 7, 14, 12], SEL_W = ["interpolate", ["linear"], ["zoom"], 8, 3, 14, 6];
  const GAP_CASING_W = ["interpolate", ["linear"], ["zoom"], 8, 5, 14, 8], GAP_W = ["interpolate", ["linear"], ["zoom"], 8, 2, 14, 4];
  M.initSelection = () => {
    const map = M.map;
    // lines: the feature (gap 0) and, for a section, the bridged reaches between its pieces (gap 1, dashed)
    const lines = (gap) => ["all", ["in", ["geometry-type"], ["literal", ["LineString", "MultiLineString"]]], ["==", ["coalesce", ["get", "gap"], 0], gap]];
    map.addSource("sel", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    M.addLayer({ id: "sel-gap-casing", type: "line", source: "sel", filter: lines(1),
      layout: { "line-cap": "butt", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": GAP_CASING_W, "line-opacity": 0.9 } }, "select");
    M.addLayer({ id: "sel-gap", type: "line", source: "sel", filter: lines(1),
      layout: { "line-cap": "butt", "line-join": "round" }, paint: { "line-color": M.token("--accent"), "line-width": GAP_W, "line-dasharray": [2, 1.5] } }, "select");
    M.addLayer({ id: "sel-casing", type: "line", source: "sel", filter: lines(0),
      layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": CASING_W, "line-opacity": 0.9 } }, "select");
    M.addLayer({ id: "sel-line", type: "line", source: "sel", filter: lines(0),
      layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": M.token("--accent"), "line-width": SEL_W } }, "select");
    M.addLayer({ id: "sel-point", type: "circle", source: "sel", filter: ["in", ["geometry-type"], ["literal", ["Point", "MultiPoint"]]],
      paint: { "circle-radius": 9, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": M.token("--accent"), "circle-stroke-width": 3 } }, "select");
    M.onTheme(() => {
      if (!map.getLayer("sel-line")) return;
      ["sel-line", "sel-gap"].forEach((l) => map.setPaintProperty(l, "line-color", M.token("--accent")));
      map.setPaintProperty("sel-point", "circle-stroke-color", M.token("--accent"));
    });
    // On the aerial photos a selected river is drawn as two rails either side of its line, so the channel itself shows.
    const gap = ["interpolate", ["linear"], ["zoom"], 12, 0, 14, 8, 17, 30];
    const selStyle = (use) => {
      if (!map.getLayer("sel-line")) return;
      const photo = use === "linz-aerial";
      map.setPaintProperty("sel-line", "line-gap-width", photo ? gap : 0);
      map.setPaintProperty("sel-casing", "line-gap-width", photo ? gap : 0);
      map.setPaintProperty("sel-line", "line-width", photo ? 2.5 : SEL_W);
      map.setPaintProperty("sel-casing", "line-width", photo ? 5 : CASING_W);
      map.setPaintProperty("sel-gap", "line-gap-width", photo ? gap : 0);
      map.setPaintProperty("sel-gap-casing", "line-gap-width", photo ? gap : 0);
      map.setPaintProperty("sel-gap", "line-width", photo ? 2 : GAP_W);
      map.setPaintProperty("sel-gap-casing", "line-width", photo ? 4 : GAP_CASING_W);
    };
    M.onBasemap(selStyle);
    selStyle(document.querySelector(".map-root")?.dataset.basemap);

    map.on("click", (e) => onClick(e));
    map.on("mousemove", RF.util.debounce((e) => {
      if (!M.ready) return;
      const hit = query(e.point, 4).length > 0;
      map.getCanvas().style.cursor = hit ? "pointer" : "";

  function query(point, tol, all = false) {
    const map = M.map, box = [[point.x - tol, point.y - tol], [point.x + tol, point.y + tol]], out = [];
    for (const c of clickables) {

        html: icon("catchment"), onclick: () => { if (shown(f)) { clear(); refresh(); } else show(f); } }, on ? "Hide catchment" : "Show catchment");

/* --- pages/map/47-aerial.js --- */
/* LINZ aerial survey per river (bead rf-aq6.29).
   Coverage: <id>_aerial.json next to the page (river_finder.webdata.write_aerial; format in web/README.md): per
   viewer reach the survey LINZ Basemaps draws on top at zoom 16, with its pixel size (GSD) and capture dates. River
   cards and the Details say which survey covers a river ("Aerial photo: 0.3 m, 2021-2024, Waikato Rural Aerial
   Photos") on every host, because that comes from data. The photos themselves are the Aerial base map
   (20-basemaps.js; standalone site built with a Basemaps key).
   Owner: map agent. Used by 40-select.js (card), 60-detail.js (Details) and 90-page.js:
   M.aerial.{file, of, describe, available, lines}. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el } = RF.util;
  const BASE = "linz-aerial";
  const PHOTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 2.5-2.5L21 19"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>';
  const files = new Map(); // region id -> Promise<A | null>

  /** <id>_aerial.json, decoded: {surveys, s (survey index per reach, -1 none), pct (Uint8Array: % of each reach under
   *  any photo)}; null when the file is missing or unreadable. */
  function file(id) {
    if (!files.has(id)) {
      files.set(id, fetch(`${id}_aerial.json`).then((res) => (res.ok ? res.json() : null)).then((A) => {
        if (!A || !Array.isArray(A.s) || !Array.isArray(A.surveys)) return null;
        const pct = new Uint8Array(A.s.length);
        for (let i = 0; i < A.s.length; i++) pct[i] = A.s[i] >= 0 ? 100 : 0;
        (A.part || []).forEach(([i, p]) => { if (i >= 0 && i < pct.length) pct[i] = p; });
        A.pct = pct;
        return A;
      }).catch(() => null));
    }
    return files.get(id);
  }

  /** Over reaches ms (length-weighted): {sv: the survey under most of them (null: none), share: part of the length under
   *  any photo, main: part under sv, others: how many other surveys}; null without data for this build's reaches. */
  function of(A, S, ms) {
    if (!A || !S || A.s.length !== S.d.length || !ms?.length) return null;
    let all = 0, cov = 0;
    const by = new Map();
    ms.forEach((m) => {
      const L = S.len[m] || 0, c = L * A.pct[m] / 100, s = A.s[m];
      all += L; cov += c;
      if (s >= 0) by.set(s, (by.get(s) || 0) + c);
    });
    if (!all) return null;
    let best = -1, bl = 0;
    by.forEach((l, s) => { if (l > bl) { bl = l; best = s; } });
    return { sv: best >= 0 ? A.surveys[best] || null : null, share: cov / all, main: bl / all, others: Math.max(by.size - 1, 0) };
  }
  const fmtGsd = (g) => `${+(+g).toPrecision(3)} m`;
  /** {value: "0.3 m, 2021-2024", name: "Waikato Rural Aerial Photos", title: the LINZ survey title} of a summary with a survey. */
  const describe = (a) => ({ value: `${fmtGsd(a.sv.gsd)}, ${a.sv.years}`, name: a.sv.name, title: a.sv.title });
  /** The Aerial base map works here (standalone site built with a Basemaps key). */
  const available = () => { const b = M.BASEMAPS?.find((x) => x.id === BASE); return !!b && M.basemapAvailable(b); };

  const reachesOf = (f) => (f.kind === "run" || f.kind === "section" ? f.members || f.sec?.m || []
    : f.kind === "reach" ? [f.seg] : (f.kind === "waterfall" || f.kind === "rapids") && f.seg >= 0 ? [f.seg] : null);
  const WHERE = { run: "run", section: "section", reach: "reach", waterfall: "reach", rapids: "reach" };

  // ---------- the aerial file of the region on the map ----------
  let cur = null; // {R, A}, once loaded
  M.onRegion((R) => {
    cur = null;
    file(R.id).then((A) => { if (M.R !== R) return; cur = { R, A }; M.refreshCard?.(); });
  });

  function summary(f) {
    if (!f || !cur || cur.R !== M.R || !cur.A || (f.region && f.region !== cur.R.id)) return null;
    const ms = reachesOf(f);
    return ms && ms.length ? of(cur.A, cur.R.segments, ms) : null;
  }

  // ---------- the middle of a line (for the LINZ Basemaps link) ----------
  function cumDist(c) {
    const out = [0];
    for (let i = 1; i < c.length; i++) {
      const k = Math.cos(c[i][1] * Math.PI / 180), dx = (c[i][0] - c[i - 1][0]) * 111320 * k, dy = (c[i][1] - c[i - 1][1]) * 110574;
      out.push(out[i - 1] + Math.hypot(dx, dy));
    }
    return out;
  }
  /** The longest line of a geometry (a section in pieces: its longest piece), downstream order. */
  function lineOf(g) {
    const ls = g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : [];
    let best = null;
    ls.filter((c) => c.length > 1).forEach((c) => { const cum = cumDist(c), L = cum[cum.length - 1]; if (!best || L > best.L) best = { line: c, cum, L }; });
    if (best) best.pieces = ls.length;
    return best;
  }
  function pointAt(t, d) {
    const { line, cum } = t;
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    const f = cum[hi] > cum[lo] ? (d - cum[lo]) / (cum[hi] - cum[lo]) : 0, a = line[lo], b = line[hi];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  // ---------- card ----------
  function basemapsLink(f) {
    const g = M.geometryOf(f), t = g && lineOf(g), p = g?.type === "Point" ? g.coordinates : t ? pointAt(t, t.L / 2) : null;
    if (!p) return null;
    return el("a", { class: "map-aerial-link", href: `https://basemaps.linz.govt.nz/@${p[1].toFixed(5)},${p[0].toFixed(5)},z16`, target: "_blank", rel: "noopener",
      title: "LINZ aerial photos in LINZ Basemaps (opens in a new tab)" }, "See it in LINZ Basemaps");
  }
  /** Card lines: which aerial survey covers the river. */
  function lines(f) {
    const a = summary(f), out = [];
    if (a) {
      const where = WHERE[f.kind] || "river";
      if (!a.sv) {
        out.push(el("span", { class: "map-aerial-line" }, el("span", { class: "map-aerial-key", html: PHOTO }),
          el("span", { text: `No LINZ aerial photos over this ${where}: satellite only.` })));
      } else {
        const d = describe(a), part = a.share < 0.95 ? ` (${Math.round(100 * a.share)}% of the ${where})` : "";
        const more = a.others ? `; ${a.others} other survey${a.others > 1 ? "s" : ""} on parts` : "";
        out.push(el("span", { class: "map-aerial-line", title: d.title }, el("span", { class: "map-aerial-key", html: PHOTO }),
          el("span", {}, "Aerial photo: ", el("span", { class: "num", text: d.value }), `, ${d.name}${part}${more}. `,
            available() ? null : basemapsLink(f))));
      }
    }
    return out;
  }
  M.aerial = { file, of, describe, available, lines, PHOTO };
})();

/* --- pages/map/50-rivers.js --- */
/* River layers: known rivers (guide sections, by grade and by source), predicted runs (ranked as the Models page
   sets: the current model by default, red low to green high; by Pareto layer the frontier is green; the frontier is
   outlined), the river network (grey/white) and river names along the lines.
   Owner: map agent. */
(() => {
  "use strict";
  const RF = window.RF, M = RF.mapkit, { el, fmt } = RF.util;
  const EMPTY = { type: "FeatureCollection", features: [] };
  const GRADES = [2, 3, 4, 5, 6];
  const SOURCES = [
    ["riverguide", "NZ RiverGuide", "https://www.riverguide.co.nz/"],
    ["packrafting", "packraftingtrips.nz", "https://www.packraftingtrips.nz/"],
    ["other", "Other guides and reports", null],
    ["local", "Local knowledge", null],
  ];
  const ROMAN = { 2: "II", 3: "III", 4: "IV", 5: "V", 6: "VI" };
  // Colour by the section's stated grade (gnum), not its hardest rapid.
  M.gradeBin = (sec) => { const g = sec.gnum ?? sec.gmin ?? sec.gmax; return g == null ? 0 : Math.max(2, Math.min(6, Math.floor(g + 1e-6))); };
  M.gradeColor = (bin) => bin ? M.colorOf(`known-g${bin}`) : M.colorOf("known-g0");
  let runs = [], runToken = 0, scored = null; // scored: {R, model} the predicted runs were found with

  /**
   * A known section's reaches (sec.m) and the reaches bridged between its pieces (sec.gap: flatter or smaller
   * reaches on its path, not part of the section; webdata.py). line: both, so pieces are drawn and counted as one
   * line down the river; gapKm: the bridged length. Indices outside the region's reaches are dropped.
   */
  M.sectionLine = (S, sec) => {
    const n = S.d.length, members = (sec.m || []).filter((i) => i >= 0 && i < n), own = new Set(members);
    const gap = [...new Set(sec.gap || [])].filter((i) => i >= 0 && i < n && !own.has(i));
    return { members, gap, line: gap.length ? members.concat(gap) : members, gapKm: gap.reduce((t, i) => t + S.len[i], 0) / 1000 };
  };
  /** "Approximate: placed by river name, 1 of 3 pieces kept, 2.4 km left out (...)" for a section whose name match
   *  was cut to one path (sec.dropped = {pieces, branches, km}); "" when nothing was left out. */
  M.approxText = (sec) => {
    const d = sec?.dropped; if (!d) return "";
    const kept = [d.pieces ? `1 of ${d.pieces + 1} pieces` : "", d.branches ? `1 of ${d.branches + 1} branches` : ""].filter(Boolean).join(" and ");
    const why = [d.pieces ? `${d.pieces > 1 ? "stretches" : "a stretch"} with the same name that ${d.pieces > 1 ? "do" : "does"} not join this one` : "",
      d.branches ? `${d.branches > 1 ? "other forks" : "another fork"} with the name` : ""].filter(Boolean).join("; ");
    return `Approximate: placed by river name, ${kept || "one path"} kept, ${(+d.km || 0).toFixed(1)} km left out${why ? ` (${why})` : ""}.`;
  };

  // ---------- layer tree ----------
  M.defineGroup({ id: "rivers", label: "Rivers" });
  M.defineGroup({ id: "known", parent: "rivers", label: "Known rivers", note: "Sections in the guides (dashed: the reaches between the pieces of one)" });
  M.defineGroup({ id: "known-grade", parent: "known", label: "By grade" });
  GRADES.forEach((g) => M.defineLayer({ id: `known-g${g}`, parent: "known-grade", label: `Grade ${ROMAN[g]}`, defaultOn: true,
    colors: [{ key: "c", token: `--grade-${g}` }], legend: `Known river, grade ${ROMAN[g]}`,
    count: () => (M.R?.sections || []).filter((s) => M.gradeBin(s) === g).length, apply: applyKnown }));
  M.defineLayer({ id: "known-g0", parent: "known-grade", label: "Grade not recorded", defaultOn: true,
    colors: [{ key: "c", token: "--muted" }], legend: "Known river, grade not recorded",
    count: () => (M.R?.sections || []).filter((s) => !M.gradeBin(s)).length, apply: applyKnown });
  M.defineGroup({ id: "known-src", parent: "known", label: "By source" });
  SOURCES.forEach(([k, label, link]) => M.defineLayer({ id: `known-src-${k}`, parent: "known-src", label, link, defaultOn: true, swatch: "none",
    count: () => (M.R?.sections || []).filter((s) => s.src === k).length, apply: applyKnown }));

  // the ranking in use (Models page: RF.runs.rankOf), for the note and the legend
  const ranking = () => RF.runs.rankOf(RF.state.runParams, !!RF.state.model);
  const PRED_NOTE = { pareto: "Ranked by Pareto layer: green is the frontier, red the deepest layer", wsum: "Ranked by the weighted score, red (low) to green (high)",
    sig: "Ranked by similarity to known runs, red (low) to green (high)", comp: "Ranked by your feature weights, red (low) to green (high)" };
  const predNote = () => PRED_NOTE[ranking()] || "Current model, red (low) to green (high)";
  M.defineLayer({ id: "pred", parent: "rivers", label: "Predicted runs", note: predNote, defaultOn: true,
    colors: [{ key: "lo", token: "--score-lo", label: "low score" }, { key: "mid", token: "--score-mid", label: "middle" }, { key: "hi", token: "--score-hi", label: "high score" }],
    legend: "Predicted run: low to high score", count: () => runs.filter((r) => r.status !== "listed").length, apply: applyPred });
  M.defineLayer({ id: "pred-listed", parent: "pred", label: "Include runs already in the guides", defaultOn: false, swatch: "none",
    count: () => runs.filter((r) => r.status === "listed").length, apply: applyPred });
  M.defineLayer({ id: "pred-front", parent: "pred", label: "Outline the Pareto frontier", defaultOn: true,
    note: "Runs that no other run beats on flood flow, gradient and height-to-area at once",
    colors: [{ key: "c", token: "--fg", label: "outline" }], legend: "Pareto frontier: no other run beats it on flood, gradient and height-to-area",
    legendKey: () => el("span", { class: "map-key map-key--front", style: `--sw:${M.colorOf("pred-front")}` }),
    count: () => runs.filter((r) => r.layer === 1 && (r.status !== "listed" || M.isVisible("pred-listed"))).length, apply: applyPred });

  M.defineLayer({ id: "linz", parent: "rivers", label: "LINZ rivers", note: "NZ Topo50 river lines with LINZ names (not unnamed headwaters under 2 km²)", defaultOn: true,
    link: "https://data.linz.govt.nz/layer/103632-nz-river-name-lines-pilot/",
    colors: [{ key: "c", token: "--river-linz" }], legend: "LINZ river (NZ River Name Lines)", count: () => M.linz?.lines.length ?? null, apply: applyLinz });
  M.defineLayer({ id: "net", parent: "rivers", label: "Modelled channels", note: "From the LINZ elevation model (shown when LINZ lines are missing)", defaultOn: false,
    colors: [{ key: "c", token: "--muted" }], legend: "Modelled channel (LINZ DEM)", count: () => M.R?.segments?.g.length ?? null, apply: applyNet });
  M.defineLayer({ id: "names", parent: "rivers", label: "River names", note: "From zoom 11", defaultOn: true, swatch: "none", apply: applyNames });

  // ---------- map layers ----------
  // "zoom" must be the input of a top-level interpolate, so extra width goes into each stop.
  const width = (base, add = 0) => ["interpolate", ["linear"], ["zoom"], 7, base * 0.45 + add, 10, base * 0.8 + add, 13, base * 1.3 + add, 16, base * 2.2 + add];
  const byScore = ["+", 0.6, ["*", 0.6, ["get", "t"]]];
  const predWidth = (add = 0) => ["interpolate", ["linear"], ["zoom"], 8, ["+", add, ["*", 2, byScore]], 13, ["+", add, ["*", 4, byScore]], 16, ["+", add, ["*", 7, byScore]]];
  const casing = () => (M.isDark() ? "#0b0f0d" : "#ffffff");
  M.casing = casing;

  M.layerInits = M.layerInits || [];
  M.layerInits.push(() => {
    const map = M.map;
    ["net", "linz", "known", "pred", "names"].forEach((id) => map.addSource(`src-${id}`, { type: "geojson", data: EMPTY, tolerance: 0.4 }));
    M.addLayer({ id: "linz-line", type: "line", source: "src-linz", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#888", "line-opacity": 0.95,
        "line-width": ["interpolate", ["linear"], ["zoom"], 8, ["case", ["get", "named"], 1.1, 0.5], 12, ["case", ["get", "named"], 2, 1], 16, ["case", ["get", "named"], 4, 2]] } }, "network");
    M.addLayer({ id: "net-line", type: "line", source: "src-net", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#888", "line-width": ["interpolate", ["linear"], ["zoom"], 8, ["interpolate", ["linear"], ["get", "w"], 0, 0.4, 1, 1.6], 14, ["interpolate", ["linear"], ["get", "w"], 0, 1, 1, 4]], "line-opacity": 0.9 } }, "network");
    // the Pareto frontier: an outline round the casing of frontier runs
    M.addLayer({ id: "pred-front", type: "line", source: "src-pred", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#888", "line-width": predWidth(5), "line-opacity": 0.95 } }, "rivers");
    M.addLayer({ id: "pred-casing", type: "line", source: "src-pred", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": casing(), "line-width": predWidth(2), "line-opacity": 0.85 } }, "rivers");
    M.addLayer({ id: "pred-line", type: "line", source: "src-pred", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#888", "line-width": predWidth() } }, "rivers");

    M.addLayer({ id: "known-gap-casing", type: "line", source: "src-known", filter: ["==", ["get", "gap"], 1], layout: { "line-cap": "butt", "line-join": "round" },
      paint: { "line-color": casing(), "line-width": width(2.2, 2), "line-opacity": 0.9 } }, "rivers");
    M.addLayer({ id: "known-gap", type: "line", source: "src-known", filter: ["==", ["get", "gap"], 1], layout: { "line-cap": "butt", "line-join": "round" },
      paint: { "line-color": "#888", "line-width": width(2.2), "line-dasharray": [2, 1.5] } }, "rivers");
    M.addLayer({ id: "known-casing", type: "line", source: "src-known", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": casing(), "line-width": width(4, 2.5), "line-opacity": 0.9 } }, "rivers");
    M.addLayer({ id: "known-line", type: "line", source: "src-known", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#888", "line-width": width(4) } }, "rivers");
    M.addLayer({ id: "names-label", type: "symbol", source: "src-names", minzoom: 11,
      layout: { "symbol-placement": "line", "text-field": ["get", "n"], "text-font": M.FONT_WATER, "text-size": ["interpolate", ["linear"], ["zoom"], 11, 11, 15, 14],
        "symbol-spacing": 350, "text-max-angle": 50, "text-padding": 4, "text-letter-spacing": 0.03, "text-offset": [0, -0.8] },
      paint: { "text-color": "#1f5fa8", "text-halo-color": "#fff", "text-halo-width": 1.6 } }, "labels");
    M.onTheme(() => {
      ["pred-casing", "known-casing", "known-gap-casing"].forEach((l) => map.getLayer(l) && map.setPaintProperty(l, "line-color", casing()));
      if (map.getLayer("names-label")) {
        map.setPaintProperty("names-label", "text-color", M.isDark() ? "#9cc4f2" : "#1f5fa8");
        map.setPaintProperty("names-label", "text-halo-color", M.isDark() ? "#111513" : "#ffffff");
      }
    });
    if (M.isDark()) { map.setPaintProperty("names-label", "text-color", "#9cc4f2"); map.setPaintProperty("names-label", "text-halo-color", "#111513"); }
    // On the LINZ aerial photos the river lines fade from zoom 13, so the channel shows through them (still a guide).

    const fade = (use) => Object.entries(OPACITY).forEach(([l, o]) => map.getLayer(l) && map.setPaintProperty(l, "line-opacity",

    M.clickable({ layers: ["known-line", "known-casing", "known-gap", "known-gap-casing"], priority: 90, feature: (f) => sectionFeature(f.properties.i) });
    M.clickable({ layers: ["pred-line", "pred-casing", "pred-front"], priority: 80, feature: (f) => runs[f.properties.i] || null });
    M.clickable({ layers: ["net-line"], priority: 40, feature: (f) => reachFeature(f.properties.i) });
    M.clickable({ layers: ["linz-line"], priority: 45, feature: (f, e) => linzFeature(f, e) });
  });

  // ---------- data per region ----------
  const multi = (S, members) => ({ type: "MultiLineString", coordinates: RF.runs.chains(S, members) });

  // Each section's reaches (gap 0), then the reaches bridged between its pieces (gap 1, drawn dashed).
  function buildKnown(R) {
    const S = R.segments; if (!S) return EMPTY;
    const feats = [];
    (R.sections || []).forEach((sec, i) => {
      const props = { i, g: M.gradeBin(sec), src: sec.src }, { members, gap } = M.sectionLine(S, sec);

    // width 0..1 from catchment area on a log scale, 1 km² to about 3000 km²
    return { type: "FeatureCollection", features: S.c.map((c, i) => ({
      type: "Feature", properties: { i, w: Math.min(1, Math.max(0, Math.log10(Math.max(S.a[i], 1)) / 3.5)) },
      geometry: { type: "LineString", coordinates: c } })) };

  // Named rivers as long lines: chain reaches downstream while the name stays the same, so labels fit.
  function buildNames(R) {
    const S = R.segments; if (!S) return EMPTY;
    const n = S.c.length, name = (i) => (S.r[i] >= 0 ? S.rivers[S.r[i]] : ""), feats = [];

  // LINZ river lines (river_finder.linz): <id>_linz.json = {names, types, q, lines: [[type, name | -1, section id, flat]]}.
  // flat: integer lon/lat steps of q degrees, each point relative to the one before (the first to 0, 0);
  // files without q hold plain lon/lat. Unnamed headwater lines under 2 km² are left out of the file.

    M.map.getSource("src-linz").setData({ type: "FeatureCollection", features: feats });

    M.map.getSource("src-names").setData(L ? { type: "FeatureCollection", features: feats.filter((f) => f.properties.named).map((f) => ({ type: "Feature", properties: { n: f.properties.n }, geometry: f.geometry })) } : buildNames(R));

  // ---------- styling (visibility, colours, filters) ----------

    const srcs = SOURCES.map(([k]) => k).filter((k) => M.isVisible(`known-src-${k}`));
    const filter = (gap) => ["all", ["in", ["get", "g"], ["literal", bins]], ["in", ["get", "src"], ["literal", srcs]], ["==", ["get", "gap"], gap]];
    const color = ["match", ["get", "g"], ...GRADES.flatMap((g) => [g, M.gradeColor(g)]), M.gradeColor(0)];
    const on = M.isVisible("known") && bins.length > 0 && srcs.length > 0;
    ["known-line", "known-casing"].forEach((l) => { M.map.setFilter(l, filter(0)); M.vis(l, on); });
    ["known-gap", "known-gap-casing"].forEach((l) => { M.map.setFilter(l, filter(1)); M.vis(l, on); });

    M.map.setPaintProperty("known-gap", "line-color", color);

  }
  function applyPred() {

    M.vis("pred-front", on && M.isVisible("pred-front"));
    M.map.setPaintProperty("pred-front", "line-color", M.colorOf("pred-front"));
    M.map.setPaintProperty("pred-line", "line-color", ["interpolate", ["linear"], ["get", "t"], 0, M.colorOf("pred", "lo"), 0.5, M.colorOf("pred", "mid"), 1, M.colorOf("pred", "hi")]);

    M.vis("net-line", on || (M.isVisible("linz") && !M.linz));

  }
  function applyLinz() {

  }

  }

  const LINZ_TYPE = { river_cl: "river", canal_cl: "canal" };
  function linzFeature(f, e) {

    const seg = S ? nearestReach(S, e.lngLat.lng, e.lngLat.lat) : -1;

    if (seg >= 0) return { kind: "reach", region: M.R.id, id: `${M.R.id}:reach:${seg}`, seg, name, linz, geometry: f.geometry };

    const S = M.R?.segments; if (!S) return null;

  }

  const SRC_LABEL = Object.fromEntries(SOURCES.map(([k, l]) => [k, l]));
  // The numbers a predicted run shows, from the section's reaches and the model the runs were found with
  // (no score until those scores have loaded). A section placed by river name can be separate pieces; the
  // bridged reaches between them (sec.gap) join them into one line but are not counted.

    const approx = M.approxText(s);

      lines: [el("span", { class: "rf-row" },
        el("span", { class: "rf-pill", style: `background:${M.gradeColor(M.gradeBin(s))};color:#fff;border-color:transparent`, text: s.grade ? `Grade ${s.grade}` : "Grade not recorded" }),
        approx ? el("span", { class: "rf-pill rf-pill--warn", text: "Approximate" }) : null),
      st ? M.runLine(ready ? st : Object.assign(st, { score: null }), { mapped: true }) : el("span", { class: "rf-note", text: "No modelled reaches here." }),
      apart > 1 ? el("span", { class: "rf-note", text: `Mapped as ${apart} separate pieces: length is their total, flow and area are for the largest.` })
        : st?.pieces > 1 && L.gapKm ? el("span", { class: "rf-note", text: `Mapped as ${st.pieces} pieces along one line; the ${L.gapKm.toFixed(1)} km between them (dashed) is not counted.` }) : null,
      approx ? el("span", { class: "rf-note", text: approx }) : null],
    };
  };

    const S = M.R.segments, i = f.seg;
    return { eyebrow: f.linz ? `LINZ ${f.linz.type} · numbers from the nearest modelled reach` : "Modelled channel · one reach", title: f.name,
      lines: [el("span", { class: "num", text: `${fmt.grad(S.g[i])} m/km · flood ${fmt.flow(S.maf[i])} m³/s · ${fmt.km2(S.a[i])} km² · ${Math.round(S.zt[i])} m` })] };
  };
})();


/* --- pages/map/52-score.js --- */
/* Reach scores: every modelled reach coloured by its score under the ranking in use (RF.runs.rankOf: the current
   model's national percentile from the per-model score files the predicted runs use, by default; or the weighted
   score, the similarity to known runs or the user's feature weights: RF.runs.scores), red (low) through amber to
   green (high) from the score tokens. Off by default; "From" hides the lower reaches and stretches the ramp over the rest.
   Drawn from the modelled-channel features (M.netData, source src-net: one per reach, property i = reach index) with
   the scores handed to MapLibre as one literal array read by ["at", ["get", "i"], …]: a model or ranking switch only
   repaints, and no feature is built or re-sent per reach. Below zoom 8 a source of the larger rivers (from 30 km², as
   the rain layer) stands in, because the tiler drops reaches shorter than its tolerance at region scale.
   Owner: map agent. */
(() => {
  "use strict";

  const EMPTY = { type: "FeatureCollection", features: [] };
  const CUTS = [0, 50, 70, 90];
  const LO_MAXZOOM = 8, W_LO = 0.422, W_MID = 0.258;   // w = log10(km²) / 3.5: 30 km² below zoom 8, 8 km² below zoom 9
  const LINES = ["score-line-lo", "score-line"];
  M.prefs.score = Object.assign({ min: 0 }, M.prefs.score || {});
  if (!CUTS.includes(M.prefs.score.min)) M.prefs.score.min = 0;
  const cut = () => M.prefs.score.min;

  // cur: {R, mid, p (run params), rank, fallback, src (the score array it came from), q: per-reach score 0-100
  // (integers), shown: reaches at or above the cut}
  let cur = null;

  let loInto = null;           // the M.netData written into the zoomed-out source
  let painted = { q: null, sig: "" };

  const fresh = () => !!cur && cur.R === M.R && cur.mid === RF.state.model && cur.p === RF.state.runParams;
  const short = (id) => (RF.models.get(id)?.title || id || "").split(":")[0];
  const rank = () => (fresh() ? cur.rank : RF.runs.rankOf(RF.state.runParams, !!RF.state.model));
  /** What the colours show: "Model v4" / "Pooled regression" / "Weighted score" / ... */
  function source() {
    const r = rank();
    if (r !== "model") return { pareto: "Weighted score", wsum: "Weighted score", sig: "Similarity to known runs", comp: "Your feature weights" }[r];
    return !cur || cur.fallback || !cur.mid ? "Pooled regression" : `Model ${short(cur.mid)}`;
  }
  const KIND = { model: "national percentile", pareto: "0 to 100", wsum: "0 to 100", sig: "percentile", comp: "percentile" };
  const ABOUT = {
    model: "National percentile among reaches of 2 km² or more: 100 is most like the known runs.",
    pareto: "The run finder's weighted mean of the three part scores (flood flow, gradient, height-to-area), × 100. Pareto layers rank whole runs, not reaches.",
    wsum: "The run finder's weighted mean of the three part scores (flood flow, gradient, height-to-area), × 100.",
    sig: "How close each reach's terrain is to the average reach of the known runs, as a percentile.",
    comp: "Your feature weights (Models page) on the standardised features, as a percentile among reaches of 2 km² or more.",
  };

  // ---------- layer tree, legend ----------
  M.defineLayer({ id: "score", parent: "rivers", after: "pred", label: "Every reach by its score", defaultOn: false,
    note: () => (M.isVisible("score") && !fresh() ? "Loading the scores…" : `${source()}: ${KIND[rank()]}, red (low) to green (high)`),
    colors: [{ key: "lo", token: "--score-lo", label: "low score" }, { key: "mid", token: "--score-mid", label: "middle" }, { key: "hi", token: "--score-hi", label: "high score" }],
    count: () => (fresh() ? cur.shown : null), legendBlock: legend, mini: true, controls, apply: sync });

  function controls() {
    return el("div", { class: "map-score-ctl" }, el("span", { class: "map-score-k", id: "map-score-from", text: "From" }),
      el("div", { class: "map-seg", role: "radiogroup", "aria-labelledby": "map-score-from" },
        ...CUTS.map((v) => el("button", { type: "button", role: "radio", "aria-checked": String(v === cut()), "aria-label": v ? `Score ${v} and up` : "All reaches",
          dataset: { v: String(v) }, onclick: () => setCut(v) }, v ? `${v}+` : "All"))));
  }
  function setCut(v) {
    M.prefs.score.min = v; M.savePrefs();
    document.querySelectorAll(".map-score-ctl .map-seg button").forEach((b) => b.setAttribute("aria-checked", String(+b.dataset.v === v)));
    if (fresh()) cur.shown = countFrom(cur.q, v);
    sync(); M.renderTree(); M.renderLegend();
  }

  /** The colour ramp with its stops: the cut, the middle of the rest, 100. */

    return el("div", { class: "map-legend-block map-score-legend" }, title,
      el("span", { class: "map-score-bar", role: "img", "aria-label": `Colour ramp from ${lo} (red) through ${(lo + 100) / 2} (amber) to 100 (green)`,
        style: `--lo:${c[0]};--mid:${c[1]};--hi:${c[2]}` }),

    const def = (id, lo) => Object.assign({ id, type: "line", source: lo ? "src-score-lo" : "src-net",

    M.clickable({ layers: LINES, priority: 46, feature: (f, e, hits) => {
      const h = fresh() && (hits || [f]).find((x) => (cur.q[x.properties.i] ?? -1) >= cut());
      return h ? M.reachFeature(h.properties.i) : null;

  });

  const countFrom = (q, lo) => { let n = 0; for (let i = 0; i < q.length; i++) if (q[i] >= lo) n++; return n; };

  /** Each reach's score for the region on the map, the current model and the run-finder settings (with them the
   *  ranking): fetched once per region and model, recomputed when the settings change. */
  async function load() {

    if (!R?.segments || (want && want.R === R && want.mid === mid && want.p === p)) return;
    want = key;

    // so nothing is repainted

  }

  /** The zoomed-out source: the larger modelled channels (the same features, so the same reach index i). */

    ["pred-flow", "pred-line", "rivers", "known-casing"], ["known-flow", "known-line", "rivers", null]];

   *   running beside a larger river near their confluence is not taken for it);

   * - area: the catchment-area code (the largest in the 3x3 cells around each sample, so a line a cell off

   *   code at the line's downstream end must not be below that at its upstream end.

   * except that the area (a coarser grid, cut off at the region edge) does not count against reaches that
   * cover half the line or more. A line that strays from the modelled drainage (reaches both ways, or

    colors: [{ key: "c", token: "--road" }], legend: "4WD or private road (dashed)", count: () => counts.track, apply: applyAccess });

    M.addLayer({ id: "acc-road-line", type: "line", source: "src-access", minzoom: 8, filter: ["==", ["get", "k"], 0],

        "line-opacity": ["interpolate", ["linear"], ["zoom"], 9.5, ["case", ["==", ["get", "m"], 1], 0.85, 0], 11, 0.85] } }, "access");
    M.addLayer({ id: "acc-track-line", type: "line", source: "src-access", minzoom: 10.5, filter: ["==", ["get", "k"], 1],

    M.addLayer({ id: "acc-foot-line", type: "line", source: "src-access", minzoom: 10.5, filter: ["==", ["get", "k"], 2],
      layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#a0642c", "line-width": w(1.4), "line-dasharray": [0.6, 1.8], "line-opacity": 0.95 } }, "access");

      el("span", { html: icon("pin"), "aria-hidden": "true" }), el("span", { class: "det-show-label", text: "Show on map" })));

    links.push(ext(`https://basemaps.linz.govt.nz/@${f.lat.toFixed(5)},${f.lon.toFixed(5)},z16`, "LINZ Basemaps"));
    links.push(ext(`https://www.google.com/maps/search/?api=1&query=${f.lat.toFixed(5)},${f.lon.toFixed(5)}`, "Google Maps"));

  const SAMPLE = 6000;   // most other reaches drawn in 3D (all of them count in the AUC)

  /** Chance that a random pos value is above a random neg value (ties count half). */
  function auc(pos, neg) {
    if (!pos.length || !neg.length) return NaN;
    const all = new Float64Array(pos.length + neg.length), lab = new Uint8Array(all.length);
    pos.forEach((v, k) => { all[k] = v; lab[k] = 1; });

    const idx = Array.from(all.keys()).sort((a, b) => all[a] - all[b]);
    let sum = 0;
    for (let i = 0; i < idx.length;) {
      let j = i; while (j < idx.length && all[idx[j]] === all[idx[i]]) j++;
      const avg = (i + j + 1) / 2; for (let k = i; k < j; k++) if (lab[idx[k]]) sum += avg;

  function buildSep() {

    const plot = el("div", { class: "models-plot", role: "img", "aria-label": "3D scatter of reaches: known runs and the other reaches" });

    const axisPick = (k) => el("label", { class: "rf-stack models-ctl", for: `models-sep-${k}` }, el("span", { class: "rf-eyebrow", text: `${k.toUpperCase()} axis` }),
      el("select", { id: `models-sep-${k}`, class: "rf-select", onchange: (e) => { st[k] = e.target.value; draw(); } },

    const openBtn = el("button", { type: "button", class: "rf-btn rf-btn--primary", onclick: () => { st.open = true; openBtn.hidden = true; plotBox.hidden = false; draw(); } }, "Show the 3D view");
    const plotBox = el("div", { class: "rf-stack", hidden: true }, el("div", { class: "rf-row models-ctls" }, axisPick("x"), axisPick("y"), axisPick("z")), plot, plotNote);

    /** Reaches of 2 km² or more in the region: known = on a guide section; role from the model's scores. */
